  aAll: 'Mapa completo', aAllHow: 'Resolva todos os níveis', aClean10: 'Traço limpo', aClean10How: 'Termine 10 níveis com 3 estrelas', aClean50: 'Sem borracha', aClean50How: 'Termine 50 níveis com 3 estrelas',
  aEasy: 'Fácil completo', aEasyHow: 'Resolva todos os níveis fáceis', aNormal: 'Médio completo', aNormalHow: 'Resolva todos os níveis médios', aHard: 'Difícil completo', aHardHow: 'Resolva todos os níveis difíceis', aExpert: 'Mestre', aExpertHow: 'Resolva todos os níveis de mestre',
  aDaily: 'Linha do dia', aDailyHow: 'Resolva um desafio diário', aStreak3: 'Três seguidos', aStreak3How: 'Resolva o desafio diário 3 dias seguidos', aStreak7: 'Semana cheia', aStreak7How: 'Resolva o desafio diário 7 dias seguidos',
};
const LOCALES = Object.freeze({ en: EN, tr: TR, es: ES, de: DE, fr: FR, pt: PT });
/** Anahtar eşlemeleri (veri kimliği → metin anahtarı). */
const TIER_KEYS = Object.freeze({ tutorial: 'tierTutorial', shapes: 'tierShapes', easy: 'tierEasy', normal: 'tierNormal', hard: 'tierHard', expert: 'tierExpert', more: 'tierMore' });
const TIP_KEYS = Object.freeze({ 't-01': 'tip1', 't-02': 'tip2', 't-03': 'tip3', 't-04': 'tip4', 't-05': 'tip5', 't-06': 'tip6', 't-07': 'tip7', 't-08': 'tip8', 't-09': 'tip9' });
const REASON_KEYS = Object.freeze({ 'edge-used': 'statusEdgeUsed', 'wrong-direction': 'statusWrongDirection', 'wrong-start': 'statusWrongStart' });
const ACHIEVEMENT_KEYS = Object.freeze({
  'first-trail': 'aFirst', 'ten-trails': 'aTen', 'fifty-trails': 'aFifty', 'hundred-trails': 'aHundred', 'all-trails': 'aAll', 'clean-ten': 'aClean10', 'clean-fifty': 'aClean50',
  'tier-easy': 'aEasy', 'tier-normal': 'aNormal', 'tier-hard': 'aHard', 'tier-expert': 'aExpert', 'daily-first': 'aDaily', 'daily-streak-3': 'aStreak3', 'daily-streak-7': 'aStreak7',
});
/** Ayar 'auto' ise cihaz dillerinden desteklenen ilkini, yoksa İngilizceyi seçer. */
function resolveLanguage(setting, deviceLanguages = []) {
  if (CONFIG.i18n.languages.includes(setting)) return setting;
  for (const tag of deviceLanguages) {
    const code = String(tag || '').toLowerCase().split('-')[0];
    if (CONFIG.i18n.languages.includes(code)) return code;
  }
  return CONFIG.i18n.fallback;
}
/** @returns {(key:string, vars?:Record<string,string|number>) => string} */
function createTranslator(lang) {
  const table = LOCALES[lang] || LOCALES[CONFIG.i18n.fallback];
  const base = LOCALES[CONFIG.i18n.fallback];
  return (key, vars) => {
    let text = table[key];
    if (text === undefined) text = base[key];
    if (text === undefined) return key;
    return vars ? text.replace(/\{(\w+)\}/g, (m, name) => (vars[name] !== undefined ? String(vars[name]) : m)) : text;
  };
}

// ---- src/ui/app.js ----
// Uygulama bileşimi: ekranlar, yönlendirme ve oyun akışı. Kurallar core/, çizim render/ içindedir.
















const APP_VERSION = '1.0.0';
const ROUTES = Object.freeze({ home: 'home', play: 'game', daily: 'game', awards: 'awards', prefs: 'prefs' });
const SCREENS = ['home', 'game', 'awards', 'prefs'];
const DEMO_LEVEL_ID = 't-09';
const DEMO_STEP_MS = 520;
const DEMO_REST_STEPS = 4;
const WIN_SHEET_DELAY_MS = 650;
const TOAST_MS = 2600;
const MAX_PLAY_SEGMENT_MS = 30 * 60 * 1000;
const STAR_PATH = 'M12 2.6l2.9 6 6.6.9-4.8 4.6 1.2 6.5L12 17.5l-5.9 3.1 1.2-6.5L2.5 9.5l6.6-.9z';
const SVG_NS = 'http://www.w3.org/2000/svg';

function byId(id) {
  const node = document.getElementById(id);
  if (!node) throw new Error(`Arayüz öğesi eksik: #${id}`);
  return node;
}

function el(tag, props = {}, children = []) {
  const node = document.createElement(tag);
  for (const [k, v] of Object.entries(props)) {
    if (k === 'class') node.className = v;
    else if (k === 'text') node.textContent = v;
    else node.setAttribute(k, v);
  }
  for (const c of children) node.append(c);
  return node;
}

function startApp(hotData = {}) {
  // ---- servisler ----
  const catalog = new LevelCatalog();
  const { backend, persistent } = resolveBackend(() => window.localStorage);
  const problems = [];
  const store = new SafeStore(backend, CONFIG.save.key, sanitizeSave, (p) => { problems.push(p); console.warn('[linetra] kayıt sorunu:', p.stage, p.error); });
  const progress = new Progress(store, catalog);
  // Zemin: çözülen bölüm sayısına göre açılır; seçili zemin kilitliyse siyaha düşer.
  let currentBackground = null;
  function applyBackgroundVars() {
    currentBackground = resolveBackground(progress.settings.bg, progress.solvedCount());
    const root = document.documentElement;
    for (const [name, value] of Object.entries(backgroundVars(currentBackground, progress.settings.line))) root.style.setProperty(name, value);
    root.style.colorScheme = currentBackground.tone;
    root.setAttribute('data-bg', currentBackground.id);
    const meta = document.querySelector('meta[name="theme-color"]');
    if (meta) meta.setAttribute('content', currentBackground.colors.bg);
  }
  applyBackgroundVars();
  const audio = new GameAudio(() => progress.settings.sound, () => {
    const Ctor = window.AudioContext || window.webkitAudioContext;
    return Ctor ? new Ctor() : null;
  });
  const motionQuery = window.matchMedia('(prefers-reduced-motion: reduce)');
  const readColors = () => {
    const cs = getComputedStyle(document.documentElement);
    const v = (name) => cs.getPropertyValue(name).trim();
    return { edge: v('--edge'), dot: v('--dot'), arrow: v('--arrow'), node: v('--node'), nodeDone: v('--node-done'), trail: v('--trail'), danger: v('--danger'), hint: v('--hint'), bg: v('--bg'), contour: v('--contour') };
  };
  const env = { readColors, now: () => performance.now(), schedule: (cb) => window.requestAnimationFrame(cb), reducedMotion: motionQuery.matches };
  const boardRenderer = new BoardRenderer(byId('board-canvas'), env);
  const demoRenderer = new BoardRenderer(byId('demo-canvas'), env);

  // ---- durum ----
  let game = null;          // { level, mode, session, hints, since, won }
  let route = 'home';
  let sheetTimer = 0;
  let toastTimer = 0;
  let saveWarned = false;
  let demo = null;
  let lang = CONFIG.i18n.fallback;
  let t = createTranslator(lang);

  function formatDateKey(key) {
    const [y, m, d] = key.split('-').map(Number);
    try { return new Date(y, m - 1, d).toLocaleDateString(lang, { day: 'numeric', month: 'long' }); } catch (e) { return key; }
  }
  function tierName(tier) { return t(TIER_KEYS[tier]); }
  function levelLabel() { return game.mode === 'daily' ? t('dailyTitle') : t('level', { n: game.level.number }); }

  /** Dili uygular: sabit metinleri doldurur. Ekranı yeniden çizmek çağırana aittir. */
  function applyLanguage() {
    const devices = Array.isArray(navigator.languages) && navigator.languages.length ? navigator.languages : [navigator.language];
    lang = resolveLanguage(progress.settings.lang, devices);
    t = createTranslator(lang);
    document.documentElement.lang = lang;
    for (const node of document.querySelectorAll('[data-i18n]')) node.textContent = t(node.getAttribute('data-i18n'));
    for (const node of document.querySelectorAll('[data-i18n-aria]')) node.setAttribute('aria-label', t(node.getAttribute('data-i18n-aria')));
  }

  function haptic(pattern) {
    if (!progress.settings.haptics || typeof navigator.vibrate !== 'function') return;
    try { navigator.vibrate(pattern); } catch (e) { /* desteklenmiyor */ }
  }

  function toast(message) {
    const box = byId('toast');
    box.textContent = message; box.hidden = false;
    window.clearTimeout(toastTimer);
    toastTimer = window.setTimeout(() => { box.hidden = true; }, TOAST_MS);
  }

  // ---- yönlendirme ----
  function go(name) {
    route = ROUTES[name] ? name : 'home';
    try { if (window.location.hash !== `#${route}`) window.location.hash = route; } catch (e) { /* hash yazılamıyorsa içeride devam */ }
    applyRoute();
  }

  function applyRoute() {
    const screen = ROUTES[route] || 'home';
    if (screen !== 'game') { commitPlayTime(true); hideSheet(); }
    if (route === 'play' && !(game && (game.mode === 'campaign' || game.mode === 'more') && !game.won)) { if (!openCurrent()) { route = 'home'; return applyRoute(); } }
    if (route === 'daily' && !(game && game.mode === 'daily' && !game.won)) { if (!openDaily()) { route = 'home'; return applyRoute(); } }
    for (const s of SCREENS) byId(`screen-${s}`).hidden = s !== screen;
    if (screen === 'home') renderHome();
    else if (screen === 'game') renderGame();
    else if (screen === 'awards') renderAwards();
    else if (screen === 'prefs') renderPrefs();
    if (screen === 'home') startDemo(); else stopDemo();
    fitCanvases();
    return undefined;
  }

  // ---- oyun ----
  function commitPlayTime(pause) {
    if (!game || game.since === null) return;
    const elapsed = Math.min(MAX_PLAY_SEGMENT_MS, performance.now() - game.since);
    game.since = pause || game.won ? null : performance.now();
    progress.addPlayTime(elapsed);
  }

  function openLevel(level, mode) {
    commitPlayTime(true);
    hideSheet();
    const session = new PuzzleSession(level.graph, { startNodes: level.startNodes, liftPolicy: window.__linetraLiftPolicy === 'keep' ? 'keep' : 'reset' });
    game = { level, mode, session, hints: 0, since: performance.now(), won: false };
    boardRenderer.setBoard(level.graph, session, level.startNodes);
  }

  function openCampaign(index) {
    try { openLevel(catalog.load(index), 'campaign'); return true; } catch (err) {
      console.error('[linetra] bölüm açılamadı', err);
      toast(t('toastLevelFail'));
      return false;
    }
  }

  /** Sıradaki oynanacak bölümü açar: bölümler bittiyse sıradaki meydan okuma bölümünü. */
  function openCurrent() {
    const sum = progress.summary();
    return sum.solved >= sum.total ? openMore(progress.moreSolved()) : openCampaign(progress.nextLevelIndex());
  }

  function openMore(k) {
    try { openLevel(continuedLevel(k, catalog.count + 1), 'more'); return true; } catch (err) {
      console.error('[linetra] meydan okuma bölümü üretilemedi', err);
      toast(t('toastLevelFail'));
      return false;
    }
  }

  function openDaily() {
    try { openLevel(dailyLevel(dateKey()), 'daily'); return true; } catch (err) {
      console.error('[linetra] günlük bulmaca üretilemedi', err);
      toast(t('toastDailyFail'));
      return false;
    }
  }

  function setTip(text, warn = false) {
    const tip = byId('game-tip');
    tip.textContent = text || '';
    tip.className = warn ? 'tip warn' : 'tip';
  }

  // Tek yönlü çizgi ilk kez görülünce bir kez öğretilir: ipucu efektiyle çizilecek yer gösterilir (yıldız düşmez).
  function oneWayIntro() {
    if (!game || progress.hasSeenTip('oneWay')) return null;
    return game.session.graph.edges.find((e) => e.oneWay) || null;
  }

  function defaultTip() {
    if (!game) return '';
    if (game.mode === 'campaign' && TIP_KEYS[game.level.id]) return t(TIP_KEYS[game.level.id]);
    return '';
  }

  function updateHud() {
    if (!game) return;
    const s = game.session;
    byId('game-counter').replaceChildren(String(s.usedCount), el('span', { text: ` / ${s.totalEdges}` }));
    const idle = s.path.length === 0;
    byId('tool-undo').disabled = idle || s.isComplete;
    byId('tool-restart').disabled = idle || s.isComplete;
    byId('tool-hint').disabled = s.isComplete;
    byId('tool-undo').classList.toggle('nudge', s.isDeadEnd);
  }

  function renderGame() {
    if (!game) return;
    byId('game-tier').textContent = game.mode === 'daily' ? formatDateKey(game.level.dateKey) : (game.mode === 'more' ? tierName('more') : tierName(game.level.tier));
    byId('game-title').textContent = levelLabel();
    const intro = oneWayIntro();
    setTip(intro ? t('tipOneWay') : defaultTip());
    if (intro) boardRenderer.showHint({ type: 'move', from: intro.a, to: intro.b });
    updateHud();
    if (game.since === null && !game.won) game.since = performance.now();
  }

  const stroke = new StrokeController({
    getSession: () => (game && !game.won ? game.session : null),
    getPoints: () => boardRenderer.points,
    getPaths: () => boardRenderer.paths,
    getRadius: () => boardRenderer.hitRadius,
    emit: onStroke,
  });

  function onStroke(type, detail) {
    if (!game) return;
    const s = game.session;
    switch (type) {
      case StrokeEvent.START:
        audio.select(0); haptic(8); boardRenderer.notifyStart(detail.node); setTip(defaultTip()); break;
      case StrokeEvent.MOVE:
        if (s.graph.edges[detail.edge.index].oneWay) progress.markTipSeen('oneWay');
        audio.select(s.trail.length); haptic(8); boardRenderer.notifyCommit(); break;
      case StrokeEvent.UNDO:
        audio.undo(); boardRenderer.notifyChange(); setTip(defaultTip()); break;
      case StrokeEvent.INVALID: {
        boardRenderer.notifyInvalid(detail.node, detail.reason === 'edge-used' || detail.reason === 'wrong-direction' ? detail.edge : null);
        const message = REASON_KEYS[detail.reason] ? t(REASON_KEYS[detail.reason]) : '';
        if (message) { audio.invalid(); haptic([18, 40, 18]); setTip(message, true); }
        break;
      }
      case StrokeEvent.DEADEND:
        audio.deadend(); haptic([30, 50, 30]); setTip(t('statusDeadend'), true); break;
      case StrokeEvent.RESET:
        audio.burn(); haptic([40, 30, 80]); boardRenderer.notifyChange(); setTip(t('statusStrict'), true); break;
      case StrokeEvent.COMPLETE:
        onWin(); break;
      default: break;
    }
    updateHud();
  }

  function onWin() {
    if (!game || game.won) return;
    commitPlayTime(true);
    game.won = true;
    boardRenderer.notifyWin();
    audio.win(); haptic([12, 30, 12, 30, 30]);
    const counters = { ...game.session.counters, hints: game.hints };
    const result = game.mode === 'daily' ? progress.recordDaily(game.level.dateKey, counters)
      : (game.mode === 'more' ? progress.recordMore(game.level.extra, counters) : progress.recordLevel(game.level.id, counters));
    if (!result.saved && !saveWarned) { saveWarned = true; toast(t('toastSaveFail')); }
    setTip('');
    const won = game;
    window.clearTimeout(sheetTimer);
    sheetTimer = window.setTimeout(() => { if (game === won) showSheet(result); }, env.reducedMotion ? 0 : WIN_SHEET_DELAY_MS);
  }

  function showSheet(result) {
    const stars = byId('win-stars');
    stars.replaceChildren();
    stars.setAttribute('aria-label', t('ariaStars', { n: result.stars }));
    for (let i = 1; i <= CONFIG.rules.maxStars; i++) {
      const svg = document.createElementNS(SVG_NS, 'svg');
      svg.setAttribute('viewBox', '0 0 24 24');
      if (i <= result.stars) svg.setAttribute('class', 'on');
      const path = document.createElementNS(SVG_NS, 'path');
      path.setAttribute('d', STAR_PATH);
      svg.append(path); stars.append(svg);
    }
    byId('win-title').textContent = t(`win${result.stars}`);
    byId('win-detail').textContent = t('winDetail', { label: levelLabel(), n: game.session.totalEdges }) + (game.hints ? t('winHints', { n: game.hints }) : '');
    const awards = byId('win-awards');
    const news = [
      ...(result.newBackgrounds || []).map((id) => t('winBackground', { name: t(getBackground(id).nameKey) })),
      ...result.newAchievements.map((id) => t('winAward', { name: t(ACHIEVEMENT_KEYS[id]) })),
    ];
    awards.hidden = news.length === 0;
    awards.textContent = news.join(' · ');
    const next = byId('win-next');
    next.textContent = game.mode === 'daily' ? t('winHome') : t('winNext');
    byId('win-sheet').hidden = false;
    next.focus({ preventScroll: true });
  }

  function hideSheet() { window.clearTimeout(sheetTimer); byId('win-sheet').hidden = true; }

  function replay() {
    if (!game) return;
    openLevel(game.level, game.mode);
    renderGame();
  }

  function nextAfterWin() {
    if (!game) return go('home');
    if (game.mode === 'daily') return go('home');
    if (game.mode === 'more') { if (openMore(game.level.extra + 1)) renderGame(); return undefined; }
    const nextIndex = game.level.index + 1;
    if (!catalog.has(nextIndex)) { if (openMore(progress.moreSolved())) renderGame(); return undefined; }
    if (openCampaign(nextIndex)) renderGame();
    return undefined;
  }

  function useHint() {
    if (!game || game.won) return;
    const s = game.session;
    const hint = nextHint(game.level.graph, s.path, game.level.startNodes);
    if (hint.type === 'start' || hint.type === 'move') { game.hints++; boardRenderer.showHint(hint); setTip(defaultTip()); audio.tap(); }
    else if (hint.type === 'undo') { game.hints++; setTip(t('statusHintUndo'), true); byId('tool-undo').classList.add('nudge'); audio.tap(); }
    else if (hint.type === 'none') setTip(t('statusHintNone'), true);
  }

  // ---- ana ekran ----
  function renderHome() {
    const sum = progress.summary();
    const nextIndex = progress.nextLevelIndex();
    const allDone = sum.solved >= sum.total;
    const nextData = catalog.data(nextIndex);
    byId('home-play-title').textContent = sum.solved === 0 ? t('playStart') : t('playContinue');
    byId('home-play-sub').textContent = allDone ? `${t('level', { n: catalog.count + progress.moreSolved() + 1 })} · ${tierName('more')}` : `${t('level', { n: nextIndex + 1 })} · ${tierName(nextData.tier)}`;
    const today = dateKey();
    const dailyMeta = byId('home-daily-meta');
    const streak = progress.currentStreak(today);
    if (progress.dailyStars(today)) { dailyMeta.textContent = streak > 1 ? t('dailySolvedStreak', { n: streak }) : t('dailySolved'); dailyMeta.className = 'meta on'; }
    else { dailyMeta.textContent = streak > 0 ? t('dailyStreak', { n: streak }) : t('dailyNew'); dailyMeta.className = 'meta'; }
    byId('home-awards-meta').textContent = `${Object.keys(progress.data.achievements).length} / ${ACHIEVEMENTS.length}`;
  }

  function startDemo() {
    stopDemo();
    const index = catalog.indexOf(DEMO_LEVEL_ID);
    if (index < 0) return;
    let level; let solution;
    try { level = catalog.load(index); solution = findSolution(level.graph, { startNodes: level.startNodes }); } catch (e) { return; }
    if (!solution) return;
    const session = new PuzzleSession(level.graph, { startNodes: level.startNodes });
    demoRenderer.setBoard(level.graph, session, null);
    demo = { session, solution, step: 0, timer: 0 };
    if (env.reducedMotion) {
      session.start(solution[0]);
      for (let i = 1; i < solution.length; i++) session.moveTo(solution[i]);
      demoRenderer.notifyChange();
      return;
    }
    demo.timer = window.setInterval(() => {
      if (document.hidden || !demo) return;
      const d = demo;
      if (d.step === 0) { d.session.reset(); d.session.start(d.solution[0]); demoRenderer.notifyChange(); demoRenderer.notifyStart(d.solution[0]); }
      else if (d.step < d.solution.length) { const r = d.session.moveTo(d.solution[d.step]); if (r.ok) demoRenderer.notifyMove(r.edge, d.solution[d.step]); }
      else if (d.step === d.solution.length) demoRenderer.notifyWin();
      d.step = d.step >= d.solution.length + DEMO_REST_STEPS ? 0 : d.step + 1;
    }, DEMO_STEP_MS);
  }

  function stopDemo() { if (demo) { window.clearInterval(demo.timer); demo = null; } }

  // ---- istatistik / başarım / ayarlar ----
  function renderAwards() {
    const got = progress.data.achievements;
    byId('awards-total').replaceChildren(String(Object.keys(got).length), el('span', { text: ` / ${ACHIEVEMENTS.length}` }));
    byId('awards-list').replaceChildren(...ACHIEVEMENTS.map((a) => {
      const name = t(ACHIEVEMENT_KEYS[a.id]); const how = t(`${ACHIEVEMENT_KEYS[a.id]}How`);
      return el('div', { class: got[a.id] ? 'award on' : 'award' }, [el('i', { class: 'mark' }), el('span', {}, [el('b', { text: name }), el('span', { text: how })])]);
    }));
  }

  function bgPreview(background, locked) {
    const c = background.colors;
    const svg = document.createElementNS(SVG_NS, 'svg');
    svg.setAttribute('viewBox', '0 0 100 44'); svg.setAttribute('aria-hidden', 'true');
    const add = (tag, attrs) => { const node = document.createElementNS(SVG_NS, tag); for (const [k, v] of Object.entries(attrs)) node.setAttribute(k, String(v)); svg.append(node); };
    const line = (d, stroke) => add('path', { d, fill: 'none', stroke, 'stroke-width': 5, 'stroke-linecap': 'round', 'stroke-linejoin': 'round' });
    add('rect', { width: 100, height: 44, fill: c.bg });
    line('M12 32 L38 12 L64 30 L88 10', c.edge);
    line('M12 32 L38 12 L64 30', c.trail);
    [[12, 32, c.trail], [38, 12, c.trail], [64, 30, c.trail], [88, 10, c.ink]].forEach(([cx, cy, fill]) => add('circle', { cx, cy, r: 5.5, fill, stroke: c.bg, 'stroke-width': 2 }));
    const children = [svg];
    if (locked) {
      const lock = document.createElementNS(SVG_NS, 'svg');
      lock.setAttribute('viewBox', '0 0 24 24');
      const path = document.createElementNS(SVG_NS, 'path');
      path.setAttribute('d', 'M7 11V8a5 5 0 0 1 10 0v3M5 11h14v9H5z');
      lock.append(path);
      children.push(el('span', { class: 'lock', 'aria-hidden': 'true' }, [lock]));
    }
    return el('span', { class: 'bg-preview' }, children);
  }

  function chooseBackground(id) {
    const ok = progress.setSetting('bg', id);
    if (progress.settings.bg !== id) return; // kilitli ya da geçersiz: değişmez
    applyBackgroundVars(); refreshTheme(); renderPrefs(); audio.tap();
    if (!ok && !saveWarned) { saveWarned = true; toast(t('toastPrefFail')); }
  }

  function chooseLine(id) {
    const ok = progress.setSetting('line', id);
    if (progress.settings.line !== id) return;
    applyBackgroundVars(); refreshTheme(); renderPrefs(); audio.tap();
    if (!ok && !saveWarned) { saveWarned = true; toast(t('toastPrefFail')); }
  }

  function renderLineColors() {
    const cur = progress.settings.line;
    const auto = el('button', { class: 'tab', type: 'button', role: 'radio', id: 'line-auto', 'aria-checked': String(cur === AUTO_LINE), 'aria-selected': String(cur === AUTO_LINE), text: t('lineAuto') });
    auto.addEventListener('click', () => chooseLine(AUTO_LINE));
    const sw = LINE_COLORS.map((c) => {
      const name = t(c.nameKey);
      const b = el('button', { class: 'swatch', type: 'button', role: 'radio', id: `line-${c.id}`, 'aria-checked': String(cur === c.id), 'aria-label': name, title: name });
      b.style.setProperty('--sw', resolveTrail(currentBackground, c.id));
      b.addEventListener('click', () => chooseLine(c.id));
      return b;
    });
    byId('line-list').replaceChildren(auto, ...sw);
  }

  function renderBackgrounds() {
    const solved = progress.solvedCount();
    byId('bg-list').replaceChildren(...BACKGROUNDS.map((b) => {
      const locked = !isBackgroundUnlocked(b, solved);
      const remaining = b.unlockAt - solved;
      const name = t(b.nameKey);
      const card = el('button', {
        class: 'bg-card', type: 'button', role: 'radio', id: `bg-${b.id}`,
        'aria-checked': String(!locked && currentBackground.id === b.id),
        'aria-label': locked ? `${name}, ${t('bgLocked', { n: remaining })}` : name,
      }, [bgPreview(b, locked), el('b', { text: name }), el('small', { text: locked ? t('bgLocked', { n: remaining }) : '' })]);
      if (locked) card.disabled = true;
      else card.addEventListener('click', () => chooseBackground(b.id));
      return card;
    }));
  }

  function renderPrefs() {
    for (const name of ['sound', 'haptics']) byId(`pref-${name}`).setAttribute('aria-checked', String(progress.settings[name]));
    byId('reset-idle').hidden = false; byId('reset-confirm').hidden = true;
    byId('prefs-note').textContent = `${t('noteAbout', { v: APP_VERSION })} ${persistent ? t('noteSaved') : t('noteNotSaved')}`;
    renderBackgrounds();
    renderLineColors();
    const choices = [CONFIG.i18n.auto, ...CONFIG.i18n.languages];
    byId('lang-list').replaceChildren(...choices.map((code) => {
      const chip = el('button', { class: 'tab', type: 'button', role: 'radio', 'aria-checked': String(progress.settings.lang === code), 'aria-selected': String(progress.settings.lang === code), id: `lang-${code}`, text: code === CONFIG.i18n.auto ? t('langAuto') : LANGUAGE_NAMES[code] });
      chip.addEventListener('click', () => {
        const ok = progress.setSetting('lang', code);
        audio.tap(); applyLanguage(); renderPrefs();
        if (!ok && !saveWarned) { saveWarned = true; toast(t('toastPrefFail')); }
      });
      return chip;
    }));
  }

  // ---- tuval boyutu, tema, arka plan ----
  function fitCanvases() {
    const dpr = window.devicePixelRatio || 1;
    for (const [id, renderer] of [['board-wrap', boardRenderer], ['demo-wrap', demoRenderer]]) {
      const r = byId(id).getBoundingClientRect();
      if (r.width > 0 && r.height > 0) renderer.resize(r.width, r.height, dpr);
    }
  }

  function drawTopo() {
    const canvas = byId('topo');
    const w = window.innerWidth; const h = window.innerHeight;
    if (!(w > 0 && h > 0)) return;
    const dpr = Math.min(2, window.devicePixelRatio || 1);
    canvas.width = Math.round(w * dpr); canvas.height = Math.round(h * dpr);
    const ctx = canvas.getContext('2d');
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.clearRect(0, 0, w, h);
    ctx.strokeStyle = readColors().contour; ctx.lineWidth = 1.2;
    // Eşyükselti çizgileri: iki "tepe" etrafında bozulmuş halkalar.
    const peaks = [[w * 0.86, h * 0.2, 0.7], [w * 0.1, h * 0.74, 2.3]];
    const reach = Math.hypot(w, h) * 0.62;
    for (const [cx, cy, phase] of peaks) {
      for (let radius = 26; radius < reach; radius += 30) {
        ctx.beginPath();
        for (let step = 0; step <= 72; step++) {
          const a = (step / 72) * Math.PI * 2;
          const wobble = 1 + 0.13 * Math.sin(a * 3 + phase) + 0.07 * Math.sin(a * 5 + phase * 2 + radius / 90);
          const x = cx + Math.cos(a) * radius * wobble; const y = cy + Math.sin(a) * radius * wobble;
          if (step === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
        }
        ctx.stroke();
      }
    }
  }

  function refreshTheme() { boardRenderer.refreshColors(); demoRenderer.refreshColors(); drawTopo(); }

  // ---- olay bağlama ----
  boardRenderer.live = stroke; // ilerleyen kenarın canlı durumu
  attachPointerAdapter(byId('board-canvas'), stroke, (p) => boardRenderer.setPointer(p));
  document.addEventListener('pointerdown', () => audio.unlock(), { capture: true });
  for (const btn of document.querySelectorAll('[data-go]')) btn.addEventListener('click', () => { audio.tap(); go(btn.getAttribute('data-go')); });
  byId('home-play').addEventListener('click', () => {
    audio.tap();
    if (openCurrent()) go('play');
    return undefined;
  });
  byId('game-back').addEventListener('click', () => { audio.tap(); go('home'); });
  byId('tool-undo').addEventListener('click', () => {
    if (game && !game.won && game.session.undo()) { audio.undo(); boardRenderer.notifyChange(); setTip(defaultTip()); updateHud(); }
  });
  byId('tool-restart').addEventListener('click', () => {
    if (!game || game.won) return;
    game.session.reset(); audio.undo(); boardRenderer.notifyChange(); setTip(defaultTip()); updateHud();
  });
  byId('tool-hint').addEventListener('click', useHint);
  byId('win-replay').addEventListener('click', () => { audio.tap(); replay(); });
  byId('win-next').addEventListener('click', () => { audio.tap(); nextAfterWin(); });
  for (const sw of document.querySelectorAll('[data-pref]')) {
    sw.addEventListener('click', () => {
      const name = sw.getAttribute('data-pref');
      const ok = progress.setSetting(name, !progress.settings[name]);
      renderPrefs();
      if (name === 'sound' && progress.settings.sound) { audio.unlock(); audio.tap(); }
      if (name === 'haptics') haptic(20);
      if (!ok && !saveWarned) { saveWarned = true; toast(t('toastPrefFail')); }
    });
  }
  byId('reset-ask').addEventListener('click', () => { byId('reset-idle').hidden = true; byId('reset-confirm').hidden = false; });
  byId('reset-no').addEventListener('click', renderPrefs);
  byId('reset-yes').addEventListener('click', () => { progress.resetAll(); applyBackgroundVars(); refreshTheme(); game = null; renderPrefs(); toast(t('toastDeleted')); });

  window.addEventListener('hashchange', () => {
    const name = window.location.hash.replace('#', '') || 'home';
    if (name !== route) { route = ROUTES[name] ? name : 'home'; applyRoute(); }
  });
  window.addEventListener('resize', () => { fitCanvases(); drawTopo(); });
  if (typeof ResizeObserver === 'function') {
    const ro = new ResizeObserver(fitCanvases);
    ro.observe(byId('board-wrap')); ro.observe(byId('demo-wrap'));
  }
  document.addEventListener('visibilitychange', () => {
    if (document.hidden) { commitPlayTime(true); audio.suspend(); }
    else if (game && !game.won && ROUTES[route] === 'game') game.since = performance.now();
  });
  window.addEventListener('pagehide', () => commitPlayTime(true));
  if (motionQuery.addEventListener) motionQuery.addEventListener('change', () => { env.reducedMotion = motionQuery.matches; });
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(fitCanvases).catch(() => {});

  // ---- açılış ----
  applyLanguage();
  if (problems.length && store.lastLoadSource !== 'main') {
    toast(store.lastLoadSource === 'backup' ? t('toastRestored') : t('toastUnreadable'));
  }
  drawTopo();
  const initial = window.location.hash.replace('#', '');
  route = ROUTES[initial] ? initial : 'home';
  if (hotData && hotData.game && Number.isInteger(hotData.game.index) && openCampaign(hotData.game.index)) {
    game.session.restore({ path: hotData.game.path });
    game.hints = Number.isInteger(hotData.game.hints) ? hotData.game.hints : 0;
    boardRenderer.notifyChange();
  }
  applyRoute();

  return {
    // Test ve canlı güncelleme için dar bir pencere.
    snapshot: () => (game && game.mode === 'campaign' && !game.won ? { game: { index: game.level.index, path: game.session.path.slice(), hints: game.hints } } : {}),
    debug: { openMore(k) { return openMore(k) && (go('play'), true); }, openLevel(i) { return openCampaign(i) && (go('play'), true); }, setLiftPolicy(p) { window.__linetraLiftPolicy = p; }, get game() { return game; }, get background() { return currentBackground.id; }, get lang() { return lang; }, stroke, solve: () => (game ? findSolution(game.level.graph, { startNodes: game.level.startNodes }) : null), boardRenderer, demoRenderer, progress, catalog, go, get route() { return route; } },
  };
}

const linetraBoot = (data) => {
  const app = startApp(data || {});
  window.__linetra = app;
  if (window.claude && window.claude.hot && typeof window.claude.hot.snapshot === 'function') window.claude.hot.snapshot(() => app.snapshot());
};
if (window.claude && window.claude.hot && typeof window.claude.hot.ready === 'function') window.claude.hot.ready(linetraBoot);
else linetraBoot(window.claude && window.claude.hot && window.claude.hot.data ? window.claude.hot.data : {});
})();
</script>
