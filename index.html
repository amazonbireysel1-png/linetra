<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#000000">
<style>:root{padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px)}body{margin:0}[hidden]{display:none!important}</style>
</head>
<body>
<title>Linetra</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Figtree:wght@500;600;700&display=swap">
<style>
/* Düzen: tek ekranlık uygulama; dar bir sütun, sola yaslı başlıklar, altta başparmak bölgesi.
   Kimlik: arazi haritası — çam yeşili zemin, eşyükselti çizgileri, sarıdan turuncuya ısınan iz. */
:root {
  /* Varsayılan zemin siyah. Diğer zeminler çözülen bölüme göre açılır ve bu değişkenleri
     src/ui/backgrounds.js üzerinden uygular; cihazın açık/koyu temasını izlemez. */
  --bg: #000000; --surface: #111111; --ink: #F2F2F2; --ink-soft: #A0A0A0; --line: #2A2A2A;
  --edge: #444444; --arrow: #F2F2F2; --node: #F2F2F2; --node-done: #7A7A7A;
  --dot: #D9D9E6; --trail: #FFC445; --accent: #FF6A45; --accent-ink: #120800;
  --success: #3CCBB2; --danger: #FF6B7C; --hint: #86B4FF; --contour: #0E0E0E;
  --font-display: 'Bricolage Grotesque', 'Trebuchet MS', system-ui, sans-serif;
  --font-body: 'Figtree', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
  --radius: 14px; --tap: 52px;
  color-scheme: dark;
}
html, body { height: 100%; }
body {
  background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 16px; line-height: 1.45;
  overflow: hidden; overscroll-behavior: none; -webkit-tap-highlight-color: transparent;
  -webkit-user-select: none; user-select: none;
}
*, *::before, *::after { box-sizing: border-box; }
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; touch-action: manipulation; }
button:focus-visible, [tabindex]:focus-visible { outline: 3px solid var(--hint); outline-offset: 2px; }
h1, h2, p { margin: 0; }
h1, h2, .display { font-family: var(--font-display); text-wrap: balance; }

#topo { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; }
#app {
  position: relative; height: 100%; max-width: 520px; margin: 0 auto; display: flex; flex-direction: column;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.screen { flex: 1; min-height: 0; display: flex; flex-direction: column; gap: 16px; padding-block: 14px 16px; }
.scroll { flex: 1; min-height: 0; overflow-y: auto; overscroll-behavior: contain; }

/* Üst çubuk */
.bar { display: flex; align-items: center; gap: 10px; min-height: var(--tap); }
.bar h2 { font-size: 1.3rem; font-weight: 700; line-height: 1.15; min-width: 0; }
.bar .grow { flex: 1; min-width: 0; }
.bar small { display: block; font-family: var(--font-body); font-size: .8rem; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--ink-soft); }
.icon-btn { width: var(--tap); height: var(--tap); flex: none; display: grid; place-items: center; border-radius: 50%; margin-left: -12px; }
.icon-btn:active { background: var(--line); }
.icon-btn svg, .tool svg, .row svg { width: 24px; height: 24px; fill: none; stroke: currentColor; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }
.counter { font-family: var(--font-display); font-weight: 700; font-size: 1.15rem; font-variant-numeric: tabular-nums; white-space: nowrap; }
.counter span { color: var(--ink-soft); font-weight: 500; }

/* Ana ekran */
#screen-home { gap: 0; }
.brand { display: flex; align-items: baseline; gap: 12px; padding-top: 6px; }
.brand h1 { font-size: clamp(2.6rem, 13vw, 3.6rem); font-weight: 800; letter-spacing: -.035em; line-height: 1; }
.brand p { color: var(--ink-soft); font-weight: 500; }
.demo { flex: 1 0 120px; position: relative; }
.demo canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
.cta {
  display: flex; align-items: center; justify-content: space-between; gap: 12px; width: 100%; min-height: 64px; padding: 12px 22px;
  background: var(--accent); color: var(--accent-ink); border-radius: var(--radius); font-family: var(--font-display); font-weight: 700; font-size: 1.3rem; text-align: left;
}
.cta small { display: block; font-family: var(--font-body); font-size: .85rem; font-weight: 600; opacity: .85; }
.cta:active { transform: translateY(1px); filter: brightness(.94); }
.cta svg { width: 26px; height: 26px; fill: none; stroke: currentColor; stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; flex: none; }
.menu { margin-top: 10px; }
.row { display: flex; align-items: center; gap: 14px; width: 100%; min-height: var(--tap); padding: 6px 2px; border-bottom: 1px solid var(--line); text-align: left; font-weight: 600; font-size: 1.05rem; }
.row:last-child { border-bottom: 0; }
.row:active { background: var(--line); }
.row .grow { flex: 1; min-width: 0; }
.row .meta { color: var(--ink-soft); font-weight: 500; font-size: .95rem; font-variant-numeric: tabular-nums; white-space: nowrap; }
.row .meta.on { color: var(--success); font-weight: 700; }

/* Bölümler */
.tabs { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; margin-inline: -4px; padding: 2px 4px; }
.tabs::-webkit-scrollbar { display: none; }
.tabs.wrap { flex-wrap: wrap; overflow: visible; padding-bottom: 6px; }
.tab { flex: none; min-height: 40px; padding: 6px 14px; border-radius: 999px; border: 1.5px solid var(--line); font-weight: 600; white-space: nowrap; }
.tab[aria-selected="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.tab i { font-style: normal; font-weight: 500; opacity: .7; font-variant-numeric: tabular-nums; margin-left: 4px; }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(58px, 1fr)); gap: 8px; padding-bottom: 8px; }
.cell { aspect-ratio: 1; border-radius: 12px; border: 1.5px solid var(--line); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; font-family: var(--font-display); font-weight: 700; font-size: 1.1rem; font-variant-numeric: tabular-nums; }
.cell.done { background: var(--surface); border-color: var(--ink-soft); }
.cell.next { border-color: var(--accent); border-width: 2.5px; }
.cell:disabled { opacity: .38; cursor: default; }
.cell:not(:disabled):active { background: var(--line); }

/* Oyun */
#screen-game { gap: 6px; padding-bottom: 10px; }
.tip { min-height: 2.9em; color: var(--ink-soft); font-weight: 500; display: flex; align-items: center; }
.tip.warn { color: var(--danger); font-weight: 600; }
.board { flex: 1; min-height: 0; position: relative; }
.board canvas { position: absolute; inset: 0; width: 100%; height: 100%; touch-action: none; display: block; }
.tools { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.tool span { overflow: hidden; text-overflow: ellipsis; max-width: 100%; white-space: nowrap; }
.tool { min-width: 0; padding: 0 4px; min-height: 58px; border-radius: var(--radius); border: 1.5px solid var(--line); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; font-size: .82rem; font-weight: 600; background: var(--bg); }
.tool:active:not(:disabled) { background: var(--line); }
.tool:disabled { opacity: .4; cursor: default; }
.tool.nudge { border-color: var(--danger); color: var(--danger); }

/* Sonuç paneli */
.sheet { position: absolute; left: 0; right: 0; bottom: 0; z-index: 5; background: var(--surface); border-top: 1.5px solid var(--line); border-radius: 22px 22px 0 0;
  padding: 22px max(20px, env(safe-area-inset-right, 0px)) calc(18px + env(safe-area-inset-bottom, 0px)) max(20px, env(safe-area-inset-left, 0px));
  display: flex; flex-direction: column; gap: 14px; animation: rise .28s ease-out; }
@keyframes rise { from { transform: translateY(30%); opacity: 0; } }
.sheet h2 { font-size: 1.7rem; font-weight: 800; letter-spacing: -.02em; }
.sheet p { color: var(--ink-soft); font-weight: 500; }
.stars { display: flex; gap: 8px; }
.stars svg { width: 38px; height: 38px; fill: var(--line); }
.stars svg.on { fill: var(--trail); }
.sheet .actions { display: flex; gap: 8px; }
.btn { flex: 1; min-height: var(--tap); border-radius: var(--radius); border: 1.5px solid var(--line); font-weight: 700; padding: 8px 14px; }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); font-family: var(--font-display); font-size: 1.1rem; }
.btn.danger { border-color: var(--danger); color: var(--danger); }
.btn:active { filter: brightness(.93); }
.badge-line { font-size: .92rem; font-weight: 600; color: var(--success); }

/* İstatistik, başarım, ayarlar */
.section-title { font-size: .8rem; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--ink-soft); margin: 18px 0 4px; font-family: var(--font-body); }
.award { display: flex; gap: 14px; align-items: center; padding: 11px 0; border-bottom: 1px solid var(--line); }
.award .mark { width: 34px; height: 34px; flex: none; border-radius: 50%; border: 2px dashed var(--line); }
.award.on .mark { border: 0; background: var(--trail); }
.award b { display: block; font-weight: 700; }
.award span { color: var(--ink-soft); font-size: .92rem; }
.award:not(.on) b { color: var(--ink-soft); }
.switch-row { display: flex; align-items: center; gap: 14px; width: 100%; min-height: 60px; padding: 8px 0; border-bottom: 1px solid var(--line); text-align: left; }
.switch-row .grow { flex: 1; min-width: 0; }
.switch-row b { display: block; font-weight: 600; }
.switch-row span { color: var(--ink-soft); font-size: .9rem; }
.knob { width: 50px; height: 30px; flex: none; border-radius: 15px; background: var(--line); position: relative; transition: background .15s; }
.knob::after { content: ""; position: absolute; top: 3px; left: 3px; width: 24px; height: 24px; border-radius: 50%; background: var(--surface); transition: transform .15s; }
[aria-checked="true"] .knob { background: var(--success); }
[aria-checked="true"] .knob::after { transform: translateX(20px); }
.note { color: var(--ink-soft); font-size: .88rem; padding: 14px 0; -webkit-user-select: text; user-select: text; }
.confirm { display: flex; flex-direction: column; gap: 10px; padding: 14px 0; }
.confirm .actions { display: flex; gap: 8px; }

.toast { position: absolute; left: 16px; right: 16px; top: calc(10px + env(safe-area-inset-top, 0px)); z-index: 9; background: var(--ink); color: var(--bg); border-radius: var(--radius); padding: 12px 16px; font-weight: 600; text-align: center; animation: rise .25s ease-out; }
@media (prefers-reduced-motion: reduce) { .sheet, .toast { animation: none; } .knob, .knob::after { transition: none; } }
@media (max-height: 560px) { .brand h1 { font-size: 2.2rem; } .row { min-height: 44px; } .tip { min-height: 2em; font-size: .9rem; } }
@media (max-height: 480px) { .demo { display: none; } .brand { padding-bottom: 12px; } }

/* Zemin seçimi */
.bg-list { display: grid; grid-template-columns: repeat(auto-fill, minmax(132px, 1fr)); gap: 10px; padding-bottom: 6px; }
.bg-card { min-width: 0; display: flex; flex-direction: column; gap: 8px; padding: 8px; text-align: left; border-radius: var(--radius); border: 1.5px solid var(--line); background: var(--bg); }
.bg-card[aria-checked="true"] { border-color: var(--accent); border-width: 2.5px; padding: 7px; }
.bg-card:not(:disabled):active { background: var(--line); }
.bg-card:disabled { cursor: default; }
.bg-card:disabled .bg-preview { opacity: .55; }
.bg-preview { position: relative; display: block; border-radius: 8px; overflow: hidden; border: 1px solid var(--line); line-height: 0; }
.bg-preview svg { width: 100%; height: auto; display: block; }
.bg-preview .lock { position: absolute; right: 6px; top: 6px; width: 20px; height: 20px; padding: 3px; border-radius: 50%; background: rgba(0,0,0,.72); }
.bg-preview .lock svg { width: 14px; height: 14px; fill: none; stroke: #fff; stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; }
.bg-card b { display: block; font-weight: 700; font-size: .95rem; line-height: 1.2; overflow-wrap: anywhere; }
.bg-card small { display: block; color: var(--ink-soft); font-size: .8rem; font-weight: 500; line-height: 1.25; min-height: 1.25em; overflow-wrap: anywhere; }

.swatches { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; }
.swatch { width: 44px; height: 44px; border-radius: 50%; background: var(--sw); border: 2px solid var(--line); }
.swatch[aria-checked="true"] { box-shadow: 0 0 0 3px var(--bg), 0 0 0 5px var(--accent); }

</style>
<canvas id="topo" aria-hidden="true"></canvas>
<div id="app">
  <section class="screen scroll" id="screen-home">
    <div class="brand">
      <h1>Linetra</h1>
      <p data-i18n="tagline"></p>
    </div>
    <div class="demo" id="demo-wrap" aria-hidden="true"><canvas id="demo-canvas"></canvas></div>
    <button class="cta" id="home-play" type="button">
      <span><span id="home-play-title"></span><small id="home-play-sub"></small></span>
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
    </button>
    <nav class="menu" data-i18n-aria="ariaMainMenu">
      <button class="row" type="button" data-go="daily"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h16v14H4zM4 10h16M8 3v4M16 3v4"/></svg><span class="grow" data-i18n="menuDaily"></span><span class="meta" id="home-daily-meta"></span></button>
      <button class="row" type="button" data-go="awards"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="9" r="5"/><path d="M9 13.5 7.5 21l4.5-2.5 4.5 2.5L15 13.5"/></svg><span class="grow" data-i18n="menuAwards"></span><span class="meta" id="home-awards-meta"></span></button>
      <button class="row" type="button" data-go="prefs"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h10M18 7h2M4 17h2M10 17h10"/><circle cx="16" cy="7" r="2"/><circle cx="8" cy="17" r="2"/></svg><span class="grow" data-i18n="menuPrefs"></span></button>
    </nav>
  </section>

  <section class="screen" id="screen-game" hidden>
    <header class="bar">
      <button class="icon-btn" type="button" id="game-back" data-i18n-aria="ariaBack"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg></button>
      <h2 class="grow"><small id="game-tier"></small><span id="game-title"></span></h2>
      <span class="counter" id="game-counter" data-i18n-aria="ariaCounter"></span>
    </header>
    <p class="tip" id="game-tip" role="status"></p>
    <div class="board" id="board-wrap"><canvas id="board-canvas" data-i18n-aria="ariaBoard"></canvas></div>
    <div class="tools">
      <button class="tool" type="button" id="tool-undo"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 7 4 12l5 5M4 12h10a6 6 0 0 1 0 12"/></svg><span data-i18n="toolUndo"></span></button>
      <button class="tool" type="button" id="tool-restart"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 12a8 8 0 1 1-2.6-5.9M20 4v5h-5"/></svg><span data-i18n="toolRestart"></span></button>
      <button class="tool" type="button" id="tool-hint"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 18h6M10 21h4M12 3a6 6 0 0 0-3.5 10.9c.5.4.9 1 .9 1.6V16h5.2v-.5c0-.6.4-1.2.9-1.6A6 6 0 0 0 12 3z"/></svg><span data-i18n="toolHint"></span></button>
    </div>
  </section>

  <section class="screen" id="screen-awards" hidden>
    <header class="bar">
      <button class="icon-btn" type="button" data-go="home" data-i18n-aria="ariaHome"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg></button>
      <h2 class="grow" data-i18n="menuAwards"></h2>
      <span class="counter" id="awards-total"></span>
    </header>
    <div class="scroll" id="awards-list"></div>
  </section>

  <section class="screen" id="screen-prefs" hidden>
    <header class="bar">
      <button class="icon-btn" type="button" data-go="home" data-i18n-aria="ariaHome"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg></button>
      <h2 class="grow" data-i18n="menuPrefs"></h2>
    </header>
    <div class="scroll">
      <button class="switch-row" type="button" role="switch" id="pref-sound" data-pref="sound"><span class="grow"><b data-i18n="prefSound"></b><span data-i18n="prefSoundSub"></span></span><i class="knob"></i></button>
      <button class="switch-row" type="button" role="switch" id="pref-haptics" data-pref="haptics"><span class="grow"><b data-i18n="prefHaptics"></b><span data-i18n="prefHapticsSub"></span></span><i class="knob"></i></button>
      <p class="section-title" data-i18n="prefBackground"></p>
      <div class="bg-list" id="bg-list" role="radiogroup" data-i18n-aria="prefBackground"></div>
      <p class="section-title" data-i18n="prefLine"></p>
      <div class="swatches" id="line-list" role="radiogroup" data-i18n-aria="prefLine"></div>
      <p class="section-title" data-i18n="prefLang"></p>
      <div class="tabs wrap" id="lang-list" role="radiogroup"></div>
      <div class="confirm" id="reset-idle"><button class="btn danger" type="button" id="reset-ask" data-i18n="resetAsk"></button></div>
      <div class="confirm" id="reset-confirm" hidden>
        <p><b data-i18n="resetQuestion"></b> <span data-i18n="resetWarn"></span></p>
        <div class="actions"><button class="btn" type="button" id="reset-no" data-i18n="resetNo"></button><button class="btn danger" type="button" id="reset-yes" data-i18n="resetYes"></button></div>
      </div>
      <p class="note" id="prefs-note"></p>
    </div>
  </section>

  <div class="sheet" id="win-sheet" role="dialog" aria-labelledby="win-title" hidden>
    <div class="stars" id="win-stars" role="img"></div>
    <h2 id="win-title"></h2>
    <p id="win-detail"></p>
    <p class="badge-line" id="win-awards" hidden></p>
    <div class="actions"><button class="btn" type="button" id="win-replay" data-i18n="winReplay"></button><button class="btn primary" type="button" id="win-next"></button></div>
  </div>
  <div class="toast" id="toast" role="status" hidden></div>
</div>
<script>
(function () {
'use strict';

// ---- src/config.js ----
// Tüm ayar sabitleri tek yerde. Kod içinde "magic number" kullanılmaz.
const CONFIG = Object.freeze({
  input: Object.freeze({
    hitRadiusMaxPx: 44,        // rahat parmak hedefi üst sınırı
    hitRadiusMinPx: 14,        // çok sıkışık yerleşimde alt sınır
    hitRadiusSpacingRatio: 0.45, // en yakın iki düğüm arası mesafenin oranı (<0.5: daireler asla çakışmaz)
    undoRadiusRatio: 0.6,      // geri sürükleyerek geri alma için düğümün merkezine daha çok yaklaşmak gerekir (titreme koruması)
  }),
  layout: Object.freeze({
    boardPaddingPx: 40,
    maxNodeSpacingPx: 150,     // küçük bulmacaların aşırı büyümesini engeller
  }),
  rules: Object.freeze({
    unlockWindow: 3,           // tamamlanmamış kaç bölüm aynı anda açık
    maxStars: 3,
  }),
  solver: Object.freeze({
    maxExpansions: 400000,
    solutionCountCap: 1000,
    luckSamples: 300,
  }),
  i18n: Object.freeze({
    languages: Object.freeze(['en', 'tr', 'es', 'de', 'fr', 'pt']),
    fallback: 'en',
    auto: 'auto',
  }),
  save: Object.freeze({
    key: 'linetra.v3',
    version: 1,
  }),
  anim: Object.freeze({
    edgeDrawMs: 140,
    nodePulseMs: 320,
    shakeMs: 280,
    winMs: 900,
    hintMs: 1800,
  }),
});

// ---- src/core/session.js ----
// Tek bir bulmaca oturumunun kuralları. DOM, zaman veya çizim bilmez.

const SessionState = Object.freeze({ IDLE: 'idle', ACTIVE: 'active', COMPLETE: 'complete' });

const MoveReason = Object.freeze({
  OK: 'ok',
  UNKNOWN_NODE: 'unknown-node',
  WRONG_START: 'wrong-start',
  NOT_STARTED: 'not-started',
  ALREADY_STARTED: 'already-started',
  SAME_NODE: 'same-node',
  NO_EDGE: 'no-edge',
  EDGE_USED: 'edge-used',
  WRONG_DIRECTION: 'wrong-direction',
  FINISHED: 'finished',
});

class PuzzleSession {
  /**
   * @param {import('./graph.js').Graph} graph
   * @param {{startNodes?:number[]|null, liftPolicy?:'keep'|'reset'}} [rules]
   */
  constructor(graph, rules = {}) {
    this.graph = graph;
    this.startNodes = Array.isArray(rules.startNodes) && rules.startNodes.length ? new Set(rules.startNodes) : null;
    this.liftPolicy = rules.liftPolicy === 'reset' ? 'reset' : 'keep';
    this.path = [];        // düğüm id'leri
    this.trail = [];       // kenar index'leri (path ile paralel, 1 eksik)
    this.used = new Uint8Array(graph.edges.length);
    this.state = SessionState.IDLE;
    this.counters = { moves: 0, undos: 0, resets: 0, invalid: 0 };
  }

  get current() { return this.path.length ? this.path[this.path.length - 1] : null; }
  get usedCount() { return this.trail.length; }
  get totalEdges() { return this.graph.edges.length; }
  get isComplete() { return this.state === SessionState.COMPLETE; }
  isEdgeUsed(edge) { return this.used[edge.index] === 1; }

  canStartAt(nodeId) {
    if (!this.graph.hasNode(nodeId)) return false;
    return this.startNodes ? this.startNodes.has(nodeId) : true;
  }

  start(nodeId) {
    if (this.state === SessionState.COMPLETE) return this._fail(MoveReason.FINISHED);
    if (this.state !== SessionState.IDLE) return this._fail(MoveReason.ALREADY_STARTED);
    if (!this.graph.hasNode(nodeId)) return this._fail(MoveReason.UNKNOWN_NODE);
    if (!this.canStartAt(nodeId)) return this._fail(MoveReason.WRONG_START);
    this.path.push(nodeId);
    this.state = this.totalEdges === 0 ? SessionState.COMPLETE : SessionState.ACTIVE;
    return { ok: true, reason: MoveReason.OK, edge: null, complete: this.isComplete };
  }

  /** Hamle yapmadan, hamlenin neden geçerli/geçersiz olduğunu söyler. */
  checkMove(nodeId) {
    if (this.state === SessionState.COMPLETE) return { ok: false, reason: MoveReason.FINISHED, edge: null };
    if (this.state === SessionState.IDLE) return { ok: false, reason: MoveReason.NOT_STARTED, edge: null };
    if (!this.graph.hasNode(nodeId)) return { ok: false, reason: MoveReason.UNKNOWN_NODE, edge: null };
    const from = this.current;
    if (nodeId === from) return { ok: false, reason: MoveReason.SAME_NODE, edge: null };
    const edge = this.graph.edgeBetween(from, nodeId);
    if (!edge) return { ok: false, reason: MoveReason.NO_EDGE, edge: null };
    if (this.used[edge.index]) return { ok: false, reason: MoveReason.EDGE_USED, edge };
    if (!this.graph.canTraverse(edge, from)) return { ok: false, reason: MoveReason.WRONG_DIRECTION, edge };
    return { ok: true, reason: MoveReason.OK, edge };
  }

  moveTo(nodeId) {
    const check = this.checkMove(nodeId);
    if (!check.ok) return this._fail(check.reason, check.edge);
    this.used[check.edge.index] = 1;
    this.trail.push(check.edge.index);
    this.path.push(nodeId);
    this.counters.moves++;
    if (this.trail.length === this.totalEdges) this.state = SessionState.COMPLETE;
    return { ok: true, reason: MoveReason.OK, edge: check.edge, complete: this.isComplete };
  }

  /** Son hamleyi geri alır. Başlangıç düğümünü de geri alabilir (oturum IDLE olur). */
  undo() {
    if (this.state === SessionState.COMPLETE || this.path.length === 0) return false;
    if (this.trail.length > 0) {
      const edgeIndex = this.trail.pop();
      this.used[edgeIndex] = 0;
      this.counters.undos++;
    }
    this.path.pop();
    if (this.path.length === 0) this.state = SessionState.IDLE;
    return true;
  }

  /** @param {boolean} [counted] false: oyuncunun kararı değil (parmak kalktı), yıldız düşürmez */
  reset(counted = true) {
    const hadProgress = this.trail.length > 0;
    this.path.length = 0;
    this.trail.length = 0;
    this.used.fill(0);
    this.state = SessionState.IDLE;
    if (hadProgress && counted) this.counters.resets++;
    return hadProgress;
  }

  /** Mevcut düğümden yapılabilecek geçerli hamleler. */
  availableMoves() {
    if (this.state !== SessionState.ACTIVE) return [];
    const from = this.current;
    const out = [];
    for (const { edge, to } of this.graph.neighbors(from)) {
      if (!this.used[edge.index] && this.graph.canTraverse(edge, from)) out.push(to);
    }
    return out;
  }

  /** Kenar kaldı ama gidilecek yer yok. */
  get isDeadEnd() {
    return this.state === SessionState.ACTIVE && this.availableMoves().length === 0;
  }

  /** Parmak kalktığında çağrılır. 'reset' politikasında yarım çizim silinir. @returns {boolean} sıfırlandı mı */
  lift() {
    if (this.liftPolicy === 'reset' && this.state === SessionState.ACTIVE) {
      this.reset(false);
      return true;
    }
    return false;
  }

  snapshot() { return { path: this.path.slice() }; }

  /** Güvenli geri yükleme: yol kurallara uymuyorsa oturum temiz kalır ve false döner. Sayaçlar değişmez. */
  restore(snap) {
    const path = snap && Array.isArray(snap.path) ? snap.path : null;
    if (!path) return false;
    const keep = { ...this.counters };
    this.reset();
    let ok = true;
    if (path.length > 0) {
      ok = this.start(path[0]).ok;
      for (let i = 1; ok && i < path.length; i++) ok = this.moveTo(path[i]).ok;
    }
    if (!ok) this.reset();
    this.counters = keep;
    return ok;
  }

  _fail(reason, edge = null) {
    this.counters.invalid++;
    return { ok: false, reason, edge, complete: false };
  }
}

// ---- src/input/hitTest.js ----
// Saf geometri: dokunma noktası / sürükleme parçası hangi düğümlere isabet ediyor?
// Noktalar ekran koordinatındadır: [{id,x,y}].

/** Düğümler arası en küçük mesafe. Tek düğümde Infinity. */
function minNodeSpacing(points) {
  let best = Infinity;
  for (let i = 0; i < points.length; i++) {
    for (let j = i + 1; j < points.length; j++) {
      const d = Math.hypot(points[i].x - points[j].x, points[i].y - points[j].y);
      if (d < best) best = d;
    }
  }
  return best;
}

/**
 * İsabet yarıçapı: parmak için olabildiğince büyük, ama komşu dairelerle asla çakışmayacak kadar küçük.
 * spacingRatio < 0.5 olduğu sürece bir nokta en fazla tek düğümün dairesindedir.
 */
function computeHitRadius(points, { maxPx, minPx, spacingRatio }) {
  const spacing = minNodeSpacing(points);
  if (!Number.isFinite(spacing)) return maxPx;
  const bySpacing = spacing * spacingRatio;
  // Alt sınır da çakışma yaratmamalı: spacing/2'nin altında kal.
  const floor = Math.min(minPx, spacing * 0.499);
  return Math.max(floor, Math.min(maxPx, bySpacing));
}

/** (x,y) noktasına yarıçap içinde en yakın düğümün id'si, yoksa null. */
function nodeAtPoint(points, x, y, radius) {
  let bestId = null;
  let bestD = radius;
  for (const p of points) {
    const d = Math.hypot(p.x - x, p.y - y);
    if (d <= bestD) { bestD = d; bestId = p.id; }
  }
  return bestId;
}

/**
 * (x0,y0)→(x1,y1) parçasının süpürdüğü düğümler, parça boyunca sırasıyla.
 * Hızlı sürüklemede iki dokunma olayı arasında kalan düğümleri kaçırmamak için kullanılır.
 * @returns {number[]} düğüm id'leri
 */
function nodesAlongSegment(points, x0, y0, x1, y1, radius) {
  const dx = x1 - x0;
  const dy = y1 - y0;
  const len2 = dx * dx + dy * dy;
  const hits = [];
  for (const p of points) {
    let t = 0;
    if (len2 > 0) {
      t = ((p.x - x0) * dx + (p.y - y0) * dy) / len2;
      if (t < 0) t = 0; else if (t > 1) t = 1;
    }
    const cx = x0 + dx * t;
    const cy = y0 + dy * t;
    const d = Math.hypot(p.x - cx, p.y - cy);
    if (d <= radius) hits.push({ id: p.id, t, d });
  }
  hits.sort((a, b) => (a.t - b.t) || (a.d - b.d));
  return hits.map((h) => h.id);
}

// ---- src/core/geometry.js ----
// Kenar eğrileri ve eğri üzerinde gezinme. Saf geometri; DOM bilmez.
// Bir kenar a→b yönünde noktalarla örneklenmiş bir çoklu çizgidir (düz, yaylı ya da ara noktalardan geçen düzgün eğri).

const SPAN_SAMPLES = 10;
const BULGE_SAMPLES = 16;

/**
 * @param {{x:number,y:number}} pa
 * @param {{x:number,y:number}} pb
 * @param {number} [bulge]  akora dik kavis (akor uzunluğunun oranı, ikinci dereceden eğri)
 * @param {number[][]} [via]  geçilecek ara noktalar [[x,y],...]; varsa kavis yok sayılır
 * @returns {{x:number,y:number}[]}
 */
function sampleEdgeCurve(pa, pb, bulge = 0, via = null) {
  if (Array.isArray(via) && via.length > 0) {
    const ctrl = [pa, ...via.map(([x, y]) => ({ x, y })), pb];
    const out = [{ x: pa.x, y: pa.y }];
    for (let i = 0; i + 1 < ctrl.length; i++) {
      const p0 = ctrl[Math.max(0, i - 1)]; const p1 = ctrl[i]; const p2 = ctrl[i + 1]; const p3 = ctrl[Math.min(ctrl.length - 1, i + 2)];
      for (let k = 1; k <= SPAN_SAMPLES; k++) {
        const t = k / SPAN_SAMPLES; const t2 = t * t; const t3 = t2 * t;
        const f = (a, b, c, d) => 0.5 * ((2 * b) + (-a + c) * t + (2 * a - 5 * b + 4 * c - d) * t2 + (-a + 3 * b - 3 * c + d) * t3);
        out.push({ x: f(p0.x, p1.x, p2.x, p3.x), y: f(p0.y, p1.y, p2.y, p3.y) });
      }
    }
    out[out.length - 1] = { x: pb.x, y: pb.y };
    return out;
  }
  if (bulge) {
    const cx = (pa.x + pb.x) / 2 - (pb.y - pa.y) * bulge;
    const cy = (pa.y + pb.y) / 2 + (pb.x - pa.x) * bulge;
    const out = [];
    for (let k = 0; k <= BULGE_SAMPLES; k++) {
      const t = k / BULGE_SAMPLES; const u = 1 - t;
      out.push({ x: u * u * pa.x + 2 * u * t * cx + t * t * pb.x, y: u * u * pa.y + 2 * u * t * cy + t * t * pb.y });
    }
    return out;
  }
  return [{ x: pa.x, y: pa.y }, { x: pb.x, y: pb.y }];
}

/** Noktalardan uzunluk tablolu çoklu çizgi. */
function makePolyline(pts) {
  const cum = [0];
  for (let i = 1; i < pts.length; i++) cum.push(cum[i - 1] + Math.hypot(pts[i].x - pts[i - 1].x, pts[i].y - pts[i - 1].y));
  return { pts, cum, length: cum[cum.length - 1] };
}

/** Başlangıçtan `dist` uzaklıktaki nokta ve o noktadaki yön (birim vektör). */
function polylinePointAt(poly, dist) {
  const d = Math.max(0, Math.min(poly.length, dist));
  let i = 1;
  while (i < poly.cum.length - 1 && poly.cum[i] < d) i++;
  const a = poly.pts[i - 1]; const b = poly.pts[i];
  const seg = poly.cum[i] - poly.cum[i - 1];
  const f = seg > 0 ? (d - poly.cum[i - 1]) / seg : 0;
  const len = Math.hypot(b.x - a.x, b.y - a.y) || 1;
  return { x: a.x + (b.x - a.x) * f, y: a.y + (b.y - a.y) * f, tx: (b.x - a.x) / len, ty: (b.y - a.y) / len };
}

/** [from,to] aralığındaki parçanın noktaları (from<=to). */
function polylineSlice(poly, from, to) {
  const lo = Math.max(0, Math.min(poly.length, from)); const hi = Math.max(lo, Math.min(poly.length, to));
  const first = polylinePointAt(poly, lo);
  const out = [{ x: first.x, y: first.y }];
  for (let i = 1; i < poly.pts.length - 1; i++) if (poly.cum[i] > lo && poly.cum[i] < hi) out.push(poly.pts[i]);
  const last = polylinePointAt(poly, hi);
  out.push({ x: last.x, y: last.y });
  return out;
}

/**
 * (x,y) noktasına en yakın nokta; yalnız [lo,hi] yay uzunluğu penceresinde aranır (eğrinin kendine yaklaştığı yerde
 * atlama olmasın). @returns {{dist:number, s:number}} dist: nokta-eğri uzaklığı, s: başlangıçtan yay uzunluğu
 */
function polylineClosest(poly, x, y, lo = 0, hi = poly.length) {
  let best = { dist: Infinity, s: lo };
  for (let i = 1; i < poly.pts.length; i++) {
    const s0 = poly.cum[i - 1]; const s1 = poly.cum[i];
    if (s1 < lo || s0 > hi) continue;
    const a = poly.pts[i - 1]; const b = poly.pts[i];
    const dx = b.x - a.x; const dy = b.y - a.y;
    const len2 = dx * dx + dy * dy;
    let f = len2 > 0 ? ((x - a.x) * dx + (y - a.y) * dy) / len2 : 0;
    f = Math.max(0, Math.min(1, f));
    let s = s0 + f * (s1 - s0);
    if (s < lo) s = lo; if (s > hi) s = hi;
    const p = polylinePointAt(poly, s);
    const d = Math.hypot(p.x - x, p.y - y);
    if (d < best.dist) best = { dist: d, s };
  }
  return best;
}

// ---- src/input/strokeController.js ----
// Dokunma olaylarını oturum hamlelerine çevirir. DOM bilmez; koordinat ve pointer id alır.
// Çizgi "ray" üzerinde ilerler: parmak, bulunulan düğümden çıkan kenarlardan birinin üzerine izdüşürülür; nokta o kenar
// boyunca kayar, ucuna varınca hamle işlenir ve aynı parmak hareketiyle sıradaki kenara geçilir. Parmak geri gelirse
// çizgi geri sarılır. Köşelere "yapışma" yoktur: kenarın tamamı parmakla birlikte çizilir.




const StrokeEvent = Object.freeze({
  START: 'start',       // {node}
  MOVE: 'move',         // {node, from, edge}
  UNDO: 'undo',         // {}
  INVALID: 'invalid',   // {node, reason, edge}
  COMPLETE: 'complete', // {}
  DEADEND: 'deadend',   // {}
  RESET: 'reset',       // {cause}
  LIFT: 'lift',         // {}
});

const START_RADIUS_FACTOR = 1.7;   // başlangıç düğümüne dokunma payı
const CAPTURE_FACTOR = 1.7;        // parmak kenara bu kadar yakınsa (yarıçap katı) kenarı sürebilir
const HYSTERESIS_FACTOR = 0.4;     // kenar değiştirmek için ötekinin bu kadar daha yakın olması gerekir
const WINDOW_MIN_PX = 140;         // tek olayda bir kenarda ilerlenebilecek en az yay uzunluğu penceresi
const END_TOLERANCE_FACTOR = 0.5; // kenarın ucuna bu kadar kala hamle işlenir
const MAX_STEPS_PER_EVENT = 16;    // tek parmak hareketinde en çok kaç kenar geçilebilir
const INVALID_ADVANCE_FACTOR = 0.35;

class StrokeController {
  /**
   * @param {object} deps
   * @param {() => import('../core/session.js').PuzzleSession} deps.getSession
   * @param {() => {id:number,x:number,y:number}[]} deps.getPoints  düğümlerin ekran koordinatları
   * @param {() => {pts:{x:number,y:number}[],cum:number[],length:number}[]} deps.getPaths  kenar index'ine göre ekran yolları (a→b)
   * @param {() => number} deps.getRadius
   * @param {(type:string, detail:object) => void} deps.emit
   */
  constructor({ getSession, getPoints, getPaths, getRadius, emit }) {
    this._getSession = getSession;
    this._getPoints = getPoints;
    this._getPaths = getPaths;
    this._getRadius = getRadius;
    this._emit = emit;
    this.activePointer = null; // aynı anda tek parmak
    this.drawing = false;
    this.pointer = null;       // {x,y}
    /** Çizilmekte olan kenar: {edge, from, to, s, back}. s: `from` düğümünden yay uzunluğu. Renderer okur. */
    this.partial = null;
    this._lastInvalidNode = null;
    this._lastInvalidEdge = null;
  }

  pointerDown(pointerId, x, y) {
    if (!isFiniteXY(x, y)) return;
    if (this.activePointer !== null) return; // ikinci parmak yok sayılır
    const session = this._getSession();
    if (!session || session.state === SessionState.COMPLETE) return;
    const radius = this._getRadius();
    const points = this._getPoints();
    if (session.state === SessionState.IDLE) {
      const hit = nodeAtPoint(points, x, y, radius * START_RADIUS_FACTOR);
      this._begin(pointerId, x, y);
      if (hit === null) return;
      const r = session.start(hit);
      if (r.ok) {
        this._emit(StrokeEvent.START, { node: hit });
        if (r.complete) this._finish();
      } else this._invalid(hit, r);
      return;
    }
    // Yarım çizime devam (katı olmayan politika): parmak çizginin ucuna yakın olmalı.
    const tip = points.find((p) => p.id === session.current);
    if (tip && Math.hypot(tip.x - x, tip.y - y) <= radius * START_RADIUS_FACTOR * 1.3) this._begin(pointerId, x, y);
  }

  _begin(pointerId, x, y) {
    this.activePointer = pointerId;
    this.drawing = true;
    this.pointer = { x, y };
    this.partial = null;
    this._lastInvalidNode = null;
    this._lastInvalidEdge = null;
  }

  pointerMove(pointerId, x, y) {
    if (pointerId !== this.activePointer || !this.drawing) return;
    if (!isFiniteXY(x, y)) return;
    const session = this._getSession();
    if (!session) return;
    // Hızlı hareketlerde olay aralığı uzayabilir: parmağın izlediği yol küçük adımlarla taranır, böylece kenarlar atlanmaz.
    const from = this.pointer || { x, y };
    const dist = Math.hypot(x - from.x, y - from.y);
    const stepPx = Math.max(4, this._getRadius() * 0.6);
    const steps = Math.min(200, Math.max(1, Math.ceil(dist / stepPx)));
    for (let k = 1; k <= steps && this.drawing; k++) {
      const px = from.x + ((x - from.x) * k) / steps; const py = from.y + ((y - from.y) * k) / steps;
      this.pointer = { x: px, y: py };
      this._advance(session, px, py);
    }
    if (this.drawing) this.pointer = { x, y };
  }

  pointerUp(pointerId) { this._end(pointerId, 'lift'); }
  pointerCancel(pointerId) { this._end(pointerId, 'cancel'); }
  /** Uygulama arka plana alındı / odak kayboldu: çizim güvenle sonlandırılır. */
  interrupt() { if (this.activePointer !== null) this._end(this.activePointer, 'interrupt'); }

  _end(pointerId, cause) {
    if (pointerId !== this.activePointer) return;
    this.activePointer = null;
    this.drawing = false;
    this.pointer = null;
    this.partial = null;
    this._lastInvalidNode = null;
    this._lastInvalidEdge = null;
    const session = this._getSession();
    if (!session) return;
    if (session.lift()) this._emit(StrokeEvent.RESET, { cause });
    else this._emit(StrokeEvent.LIFT, { cause });
  }

  /** Parmağın bulunduğu yere göre noktayı ilerletir/geri sarar. */
  _advance(session, x, y) {
    const radius = this._getRadius();
    for (let step = 0; step < MAX_STEPS_PER_EVENT && this.drawing; step++) {
      if (session.state !== SessionState.ACTIVE) return;
      const choice = this._choose(session, x, y, radius);
      if (!choice) return;
      const { cand, s } = choice;
      const length = cand.length;
      const endTol = Math.max(6, radius * END_TOLERANCE_FACTOR);
      if (s >= length - endTol) {
        // kenarın ucuna varıldı: hamle işlenir, aynı parmak hareketiyle sıradaki kenara geçilir
        this.partial = null;
        if (cand.back) {
          session.undo();
          this._lastInvalidEdge = null;
          this._emit(StrokeEvent.UNDO, {});
          continue;
        }
        const from = session.current;
        const r = session.moveTo(cand.to);
        if (!r.ok) { this._invalid(cand.to, r); return; }
        this._lastInvalidNode = null; this._lastInvalidEdge = null;
        this._emit(StrokeEvent.MOVE, { node: cand.to, from, edge: r.edge });
        if (r.complete) { this._finish(); return; }
        if (session.isDeadEnd) { this._emit(StrokeEvent.DEADEND, {}); return; }
        continue;
      }
      this.partial = s > 0.5 ? { edge: cand.edge, from: cand.from, to: cand.to, s, back: cand.back, length } : null;
      return;
    }
  }

  /** Adaylar arasından parmağa en uygun kenarı seçer. @returns {{cand:object, s:number}|null} */
  _choose(session, x, y, radius) {
    const paths = this._getPaths();
    const u = session.current;
    const graph = session.graph;
    const cands = [];
    const blocked = [];
    for (const { edge, to } of graph.neighbors(u)) {
      const forward = !session.isEdgeUsed(edge) && graph.canTraverse(edge, u);
      const lastIndex = session.trail.length ? session.trail[session.trail.length - 1] : -1;
      if (edge.index === lastIndex) continue; // geri sarma adayı aşağıda
      const cand = this._candidate(paths, edge, u, to, false);
      if (!cand) continue;
      if (forward) cands.push(cand); else blocked.push({ cand, reason: session.isEdgeUsed(edge) ? MoveReason.EDGE_USED : MoveReason.WRONG_DIRECTION });
    }
    if (session.trail.length > 0) {
      const edge = graph.edges[session.trail[session.trail.length - 1]];
      const w = session.path[session.path.length - 2];
      const back = this._candidate(paths, edge, u, w, true);
      if (back) cands.push(back);
    }
    const capture = radius * CAPTURE_FACTOR;
    const win = Math.max(WINDOW_MIN_PX, radius * 3);
    const cur = this.partial;
    let best = null;
    for (const cand of cands) {
      const active = cur && cur.edge.index === cand.edge.index && cur.back === cand.back;
      const lo = active ? Math.max(0, cur.s - win) : 0;
      const hi = active ? Math.min(cand.length, cur.s + win) : Math.min(cand.length, win);
      const hit = cand.closest(x, y, lo, hi);
      if (cand.back && !active && hit.s < radius * 0.5) continue; // düğüme yeni varıldı: küçük geri kayma geri sarma sayılmaz
      const score = hit.dist - (active ? radius * HYSTERESIS_FACTOR : 0);
      if (hit.dist <= capture && (!best || score < best.score)) best = { cand, s: hit.s, dist: hit.dist, score };
    }
    if (!best) {
      this._checkBlocked(blocked, x, y, radius);
      return null;
    }
    this._lastInvalidEdge = null;
    return { cand: best.cand, s: best.s };
  }

  /** Kullanılamayan (kullanılmış ya da ters yönlü) kenarı sürmeye çalışmak uyarı üretir. */
  _checkBlocked(blocked, x, y, radius) {
    let worst = null;
    for (const b of blocked) {
      const hit = b.cand.closest(x, y, 0, b.cand.length);
      if (hit.dist <= radius * CAPTURE_FACTOR * 0.8 && hit.s >= radius * INVALID_ADVANCE_FACTOR && (!worst || hit.dist < worst.dist)) worst = { ...b, dist: hit.dist };
    }
    if (!worst) { this._lastInvalidEdge = null; return; }
    if (this._lastInvalidEdge === worst.cand.edge.index) return;
    this._lastInvalidEdge = worst.cand.edge.index;
    this._emit(StrokeEvent.INVALID, { node: worst.cand.to, reason: worst.reason, edge: worst.cand.edge });
  }

  /** `from` düğümünden `to` düğümüne doğru yönlenmiş aday kenar. */
  _candidate(paths, edge, from, to, back) {
    const poly = paths[edge.index];
    if (!poly) return null;
    const forwardOrient = edge.a === from;
    const length = poly.length;
    return {
      edge, from, to, back, length,
      closest(x, y, lo, hi) {
        if (forwardOrient) return polylineClosest(poly, x, y, lo, hi);
        const r = polylineClosest(poly, x, y, length - hi, length - lo);
        return { dist: r.dist, s: length - r.s };
      },
    };
  }

  _finish() {
    this.drawing = false;
    this.pointer = null;
    this.partial = null;
    this._emit(StrokeEvent.COMPLETE, {});
  }

  _invalid(nodeId, result) {
    if (this._lastInvalidNode === nodeId) return;
    this._lastInvalidNode = nodeId;
    this._emit(StrokeEvent.INVALID, { node: nodeId, reason: result.reason || MoveReason.NO_EDGE, edge: result.edge || null });
  }
}

function isFiniteXY(x, y) { return Number.isFinite(x) && Number.isFinite(y); }

// ---- src/input/pointerAdapter.js ----
// DOM Pointer Events → StrokeController. İnce bağdaştırıcı; mantık içermez.

/**
 * @param {HTMLElement} element
 * @param {import('./strokeController.js').StrokeController} controller
 * @param {(p:{x:number,y:number}|null) => void} onPointer  lastik çizgi için konum
 * @returns {() => void} dinleyicileri kaldıran fonksiyon
 */
function attachPointerAdapter(element, controller, onPointer) {
  const local = (ev) => {
    const rect = element.getBoundingClientRect();
    return { x: ev.clientX - rect.left, y: ev.clientY - rect.top };
  };
  const down = (ev) => {
    if (ev.pointerType === 'mouse' && ev.button !== 0) return;
    ev.preventDefault();
    try { element.setPointerCapture(ev.pointerId); } catch (e) { /* bazı tarayıcılar reddeder; çizim yine çalışır */ }
    const p = local(ev);
    controller.pointerDown(ev.pointerId, p.x, p.y);
    onPointer(controller.pointer);
  };
  const move = (ev) => {
    if (ev.pointerId !== controller.activePointer) return;
    ev.preventDefault();
    // Tarayıcının birleştirdiği ara noktaları da işle: hızlı çizimde daha isabetli.
    const batch = typeof ev.getCoalescedEvents === 'function' ? ev.getCoalescedEvents() : null;
    const list = batch && batch.length ? batch : [ev];
    for (const e of list) { const p = local(e); controller.pointerMove(ev.pointerId, p.x, p.y); }
    onPointer(controller.pointer);
  };
  const up = (ev) => { controller.pointerUp(ev.pointerId); onPointer(null); };
  const cancel = (ev) => { controller.pointerCancel(ev.pointerId); onPointer(null); };
  const interrupt = () => { controller.interrupt(); onPointer(null); };
  const visibility = () => { if (document.hidden) interrupt(); };
  const block = (ev) => ev.preventDefault();

  element.addEventListener('pointerdown', down);
  element.addEventListener('pointermove', move);
  element.addEventListener('pointerup', up);
  element.addEventListener('pointercancel', cancel);
  element.addEventListener('lostpointercapture', cancel);
  element.addEventListener('contextmenu', block);
  // Dokunma hareketini tarayıcının "fırlatma" (fling) hareketine çevirmesini engeller. Aksi halde Chrome,
  // hızlı biten bir çizimden sonraki ilk dokunuşu (ör. "Sonraki bölüm") yutuyor.
  element.addEventListener('touchstart', block, { passive: false });
  element.addEventListener('touchmove', block, { passive: false });
  window.addEventListener('blur', interrupt);
  document.addEventListener('visibilitychange', visibility);
  return () => {
    element.removeEventListener('pointerdown', down);
    element.removeEventListener('pointermove', move);
    element.removeEventListener('pointerup', up);
    element.removeEventListener('pointercancel', cancel);
    element.removeEventListener('lostpointercapture', cancel);
    element.removeEventListener('contextmenu', block);
    element.removeEventListener('touchstart', block);
    element.removeEventListener('touchmove', block);
    window.removeEventListener('blur', interrupt);
    document.removeEventListener('visibilitychange', visibility);
  };
}

// Koordinatlar birimsizdir (y aşağı). Her şeklin Euler yolu olduğu testlerde ve üretimde doğrulanır.

function polar(cx, cy, r, deg) {
  const a = (deg * Math.PI) / 180;
  return [Math.round((cx + r * Math.cos(a)) * 1000) / 1000, Math.round((cy + r * Math.sin(a)) * 1000) / 1000];
}
/** Daire yayı üzerindeki ara noktalar (uç noktalar hariç). */
function arcVia(cx, cy, r, degrees) { return degrees.map((d) => polar(cx, cy, r, d)); }

/** Adlandırılmış düğümlerden ve [adA, adB, araNoktalar?, tekYön?] kenarlarından seviye verisi kurar. */
function figure(id, nodeMap, edgeList, start) {
  const names = Object.keys(nodeMap);
  const index = new Map(names.map((n, i) => [n, i]));
  const edges = edgeList.map(([a, b, via, oneWay]) => {
    const ai = index.get(a); const bi = index.get(b);
    if (ai === undefined || bi === undefined) throw new Error(`${id}: tanımsız düğüm ${a}/${b}`);
    if (via && via.length) return [ai, bi, oneWay ? 1 : 0, 0, via];
    return oneWay ? [ai, bi, 1] : [ai, bi];
  });
  const level = { id, tier: 'shapes', nodes: names.map((n) => nodeMap[n]), edges };
  if (start) level.start = start.map((n) => index.get(n));
  return level;
}

const r3 = (v) => Math.round(v * 1000) / 1000;
function pol(cx, cy, r, deg) { const a = (deg * Math.PI) / 180; return [r3(cx + r * Math.cos(a)), r3(cy + r * Math.sin(a))]; }

    return via && via.length ? [ai, bi, 0, 0, via] : [ai, bi];

  return { id, tier: 'shapes', nodes: names.map((n) => nodeMap[n]), edges };
