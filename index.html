// Bulmaca topolojisi: düğümler ve kenarlar. Oluşturulduktan sonra değişmez.


class GraphError extends Error {
  constructor(message) { super(message); this.name = 'GraphError'; }
}

function edgeKey(a, b) {
  return a < b ? `${a}-${b}` : `${b}-${a}`;
}

class Graph {
  /**
   * @param {{id:number,x:number,y:number}[]} nodes
   * @param {{a:number,b:number,oneWay?:boolean,bulge?:number,via?:number[][]}[]} edges  oneWay: yalnızca a→b yönünde geçilir
   */
  constructor(nodes, edges) {
    if (!Array.isArray(nodes) || !Array.isArray(edges)) throw new GraphError('nodes ve edges dizi olmalı');
    this.nodes = [];
    this._nodeById = new Map();
    this._adj = new Map();
    for (const n of nodes) {
      if (!n || !Number.isInteger(n.id)) throw new GraphError('düğüm id tam sayı olmalı');
      if (!Number.isFinite(n.x) || !Number.isFinite(n.y)) throw new GraphError(`düğüm ${n.id}: geçersiz koordinat`);
      if (this._nodeById.has(n.id)) throw new GraphError(`yinelenen düğüm id: ${n.id}`);
      const node = Object.freeze({ id: n.id, x: n.x, y: n.y });
      this._nodeById.set(n.id, node);
      this._adj.set(n.id, []);
      this.nodes.push(node);
    }
    this.edges = [];
    this._edgeByKey = new Map();
    for (const e of edges) {
      if (!e || !this._nodeById.has(e.a) || !this._nodeById.has(e.b)) {
        throw new GraphError(`kenar tanımsız düğüme bağlı: ${e && e.a}-${e && e.b}`);
      }
      if (e.a === e.b) throw new GraphError(`kendine dönen kenar: ${e.a}`);
      const key = edgeKey(e.a, e.b);
      if (this._edgeByKey.has(key)) throw new GraphError(`yinelenen kenar: ${key}`);
      const bulge = Number.isFinite(e.bulge) ? e.bulge : 0;
      const via = Array.isArray(e.via) && e.via.length ? e.via : null;
      const pa = this._nodeById.get(e.a); const pb = this._nodeById.get(e.b);
      const path = sampleEdgeCurve(pa, pb, bulge, via); // seviye koordinatlarında a→b
      const edge = Object.freeze({ index: this.edges.length, key, a: e.a, b: e.b, oneWay: e.oneWay === true, bulge, via, path });
      this._edgeByKey.set(key, edge);
      this._adj.get(e.a).push(Object.freeze({ edge, to: e.b }));
      this._adj.get(e.b).push(Object.freeze({ edge, to: e.a }));
      this.edges.push(edge);
    }
    Object.freeze(this.nodes);
    Object.freeze(this.edges);
  }

  hasNode(id) { return this._nodeById.has(id); }
  node(id) { return this._nodeById.get(id) || null; }
  /** @returns {{edge:object,to:number}[]} */
  neighbors(id) { return this._adj.get(id) || []; }
  edgeBetween(a, b) { return this._edgeByKey.get(edgeKey(a, b)) || null; }
  /** Kenar `from` düğümünden çıkarak geçilebilir mi (tek yön kuralı)? */
  canTraverse(edge, from) { return edge.oneWay ? edge.a === from : (edge.a === from || edge.b === from); }
  get hasOneWay() { return this.edges.some((e) => e.oneWay); }
}

// ---- src/levels/schema.js ----
// Seviye verisi şeması ve doğrulaması. Seviye verisi koddan bağımsızdır:
// { id, tier, nodes:[[x,y],...], edges:[[a,b] | [a,b,1]], start?:[nodeIndex,...] }
// Kenardaki üçüncü değer 1 ise kenar yalnızca a→b yönünde geçilir.




const TIERS = Object.freeze(['tutorial', 'shapes', 'easy', 'normal', 'hard', 'expert']);

// Bir kenar, başka bir düğümün dokunma dairesinin içinden geçmemeli; yoksa kenarı izleyen parmak
// o düğümü de "seçer". Dokunma yarıçapı oranına küçük bir pay eklenir (en küçük düğüm aralığına oranla).
const EDGE_CLEARANCE_MARGIN = 0.2; // titreyen parmak için pay: kenar, komşu olmayan düğümün dairesinden en az bu kadar uzak geçer
const NODE_ON_EDGE_TOLERANCE = CONFIG.input.hitRadiusSpacingRatio + EDGE_CLEARANCE_MARGIN;
/** Eğri kenarın akor uzunluğuna göre en büyük kavisi. */
const MAX_BULGE = 0.6;
const MAX_NODES = 64;

function pointSegmentDistance(px, py, ax, ay, bx, by) {
  const dx = bx - ax; const dy = by - ay;
  const len2 = dx * dx + dy * dy;
  let t = len2 ? ((px - ax) * dx + (py - ay) * dy) / len2 : 0;
  t = Math.max(0, Math.min(1, t));
  return Math.hypot(px - (ax + dx * t), py - (ay + dy * t));
}

/** @returns {{ok:boolean, errors:string[]}} */
function validateLevelData(data) {
  const errors = [];
  if (!data || typeof data !== 'object') return { ok: false, errors: ['seviye nesne değil'] };
  if (typeof data.id !== 'string' || !data.id) errors.push('id eksik');
  if (!TIERS.includes(data.tier)) errors.push(`geçersiz zorluk: ${data.tier}`);
  const nodes = data.nodes; const edges = data.edges;
  if (!Array.isArray(nodes) || nodes.length < 2) errors.push('en az 2 düğüm gerekli');
  if (!Array.isArray(edges) || edges.length < 1) errors.push('en az 1 kenar gerekli');
  if (errors.length) return { ok: false, errors };
  if (nodes.length > MAX_NODES) errors.push('çok fazla düğüm');
  for (let i = 0; i < nodes.length; i++) {
    const n = nodes[i];
    if (!Array.isArray(n) || n.length !== 2 || !Number.isFinite(n[0]) || !Number.isFinite(n[1])) errors.push(`düğüm ${i}: geçersiz koordinat`);
  }
  if (errors.length) return { ok: false, errors };
  let minSpacing = Infinity;
  for (let i = 0; i < nodes.length; i++) {
    for (let j = i + 1; j < nodes.length; j++) {
      minSpacing = Math.min(minSpacing, Math.hypot(nodes[i][0] - nodes[j][0], nodes[i][1] - nodes[j][1]));
    }
  }
  if (!(minSpacing > 1e-6)) errors.push('üst üste binen düğümler');
  const seen = new Set();
  const degree = new Array(nodes.length).fill(0);
  for (let k = 0; k < edges.length; k++) {
    const e = edges[k];
    if (!Array.isArray(e) || (e.length < 2 || e.length > 5)) { errors.push(`kenar ${k}: biçim hatalı`); continue; }
    const [a, b, dir, bulge, via] = e;
    if (!Number.isInteger(a) || !Number.isInteger(b) || a < 0 || b < 0 || a >= nodes.length || b >= nodes.length) { errors.push(`kenar ${k}: tanımsız düğüm`); continue; }
    if (a === b) { errors.push(`kenar ${k}: kendine dönüyor`); continue; }
    if (e.length === 3 && dir !== 1) errors.push(`kenar ${k}: yön bayrağı yalnızca 1 olabilir`);
    if (e.length >= 4) {
      if (dir !== 0 && dir !== 1) errors.push(`kenar ${k}: yön bayrağı 0 ya da 1 olmalı`);
      if (!Number.isFinite(bulge) || Math.abs(bulge) > MAX_BULGE) errors.push(`kenar ${k}: eğrilik geçersiz`);
    }
    if (e.length === 5 && !(Array.isArray(via) && via.length <= 12 && via.every((q) => Array.isArray(q) && q.length === 2 && q.every(Number.isFinite)))) errors.push(`kenar ${k}: ara noktalar geçersiz`);
    const key = a < b ? `${a}-${b}` : `${b}-${a}`;
    if (seen.has(key)) errors.push(`kenar ${k}: yinelenen bağlantı ${key}`);
    seen.add(key);
    degree[a]++; degree[b]++;
  }
  if (errors.length) return { ok: false, errors };
  for (let i = 0; i < nodes.length; i++) if (degree[i] === 0) errors.push(`düğüm ${i}: hiçbir kenara bağlı değil`);
  // Bir kenarın üstünde başka düğüm durmamalı (oyuncu için belirsiz bağlantı).
  for (const e of edges) {
    const [a, b, , bulge, via] = e;
    const path = sampleEdgeCurve({ x: nodes[a][0], y: nodes[a][1] }, { x: nodes[b][0], y: nodes[b][1] }, e.length >= 4 ? bulge : 0, e.length === 5 ? via : null);
    for (let i = 0; i < nodes.length; i++) {
      if (i === a || i === b) continue;
      let d = Infinity;
      for (let q = 1; q < path.length; q++) d = Math.min(d, pointSegmentDistance(nodes[i][0], nodes[i][1], path[q - 1].x, path[q - 1].y, path[q].x, path[q].y));
      if (d < minSpacing * NODE_ON_EDGE_TOLERANCE) errors.push(`düğüm ${i}, ${a}-${b} kenarına fazla yakın`);
    }
  }
  if (data.start !== undefined) {
    if (!Array.isArray(data.start) || data.start.length === 0) errors.push('start boş olamaz');
    else for (const s of data.start) if (!Number.isInteger(s) || s < 0 || s >= nodes.length) errors.push(`start: tanımsız düğüm ${s}`);
  }
  return { ok: errors.length === 0, errors };
}

/** Doğrulanmış seviye verisinden oyun nesneleri üretir. Geçersiz veride hata fırlatır. */
function levelToGraph(data) {
  const v = validateLevelData(data);
  if (!v.ok) throw new Error(`Geçersiz seviye ${data && data.id}: ${v.errors.join('; ')}`);
  const nodes = data.nodes.map((p, i) => ({ id: i, x: p[0], y: p[1] }));
  const edges = data.edges.map((e) => ({ a: e[0], b: e[1], oneWay: e[2] === 1, bulge: e.length >= 4 ? e[3] : 0, via: e.length === 5 ? e[4] : null }));
  return { graph: new Graph(nodes, edges), startNodes: data.start ? data.start.slice() : null };
}

// ---- src/levels/catalog.js ----
// Bölüm kataloğu: alıştırma + üretilmiş paket, tek sıralı liste. Graph nesneleri yalnız istenince kurulur.






/** Elle çizilmiş ek şekilleri kendi kademelerinin içine, `slot` (0..1) konumuna serpiştirir. */
function weaveExtras(pack, extras) {
  const out = [];
  const present = new Set([...pack, ...extras].map((l) => l.tier));
  const tiers = TIERS.filter((tier) => present.has(tier) && tier !== 'tutorial' && tier !== 'shapes');
  for (const tier of tiers) {
    const block = pack.filter((l) => l.tier === tier);
    const mine = extras.filter((e) => e.tier === tier).sort((a, b) => a.slot - b.slot);
    let k = 0;
    block.forEach((l, i) => {
      while (k < mine.length && Math.round(mine[k].slot * block.length) <= i) out.push(mine[k++]);
      out.push(l);
    });
    while (k < mine.length) out.push(mine[k++]);
  }
  return out;
}

class LevelCatalog {
  constructor(levels = [...TUTORIAL_LEVELS, ...weaveExtras(LEVEL_PACK, [...FIGURE_LEVELS, ...MORE_FIGURES])]) {
    this.levels = levels;
    this._indexById = new Map(levels.map((l, i) => [l.id, i]));
    this.tiers = TIERS.map((tier) => {
      const indices = [];
      levels.forEach((l, i) => { if (l.tier === tier) indices.push(i); });
      return { tier, first: indices.length ? indices[0] : -1, count: indices.length };
    }).filter((t) => t.count > 0);
  }
  get count() { return this.levels.length; }
  has(index) { return Number.isInteger(index) && index >= 0 && index < this.levels.length; }
  data(index) { return this.has(index) ? this.levels[index] : null; }
  indexOf(id) { return this._indexById.has(id) ? this._indexById.get(id) : -1; }
  /** Oynanabilir bölüm. Bozuk veride hata fırlatır (çağıran yakalar ve kullanıcıya bildirir). */
  load(index) {
    const data = this.data(index);
    if (!data) throw new Error(`Bölüm bulunamadı: ${index}`);
    const { graph, startNodes } = levelToGraph(data);
    return { index, id: data.id, tier: data.tier, graph, startNodes, number: index + 1 };
  }
}

// ---- src/levels/rng.js ----
// Tohumlu rastgele sayı üreteci: aynı tohum her cihazda aynı diziyi verir (günlük bulmaca için şart).
function hashString(str) {
  let h = 2166136261 >>> 0;
  for (let i = 0; i < str.length; i++) {
    h ^= str.charCodeAt(i);
    h = Math.imul(h, 16777619);
  }
  return h >>> 0;
}

function createRng(seed) {
  let a = (typeof seed === 'string' ? hashString(seed) : seed) >>> 0;
  const next = () => {
    a = (a + 0x6D2B79F5) >>> 0;
    let t = a;
    t = Math.imul(t ^ (t >>> 15), t | 1);
    t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
  return {
    next,
    int: (minIncl, maxIncl) => minIncl + Math.floor(next() * (maxIncl - minIncl + 1)),
    pick: (arr) => arr[Math.floor(next() * arr.length)],
    shuffle: (arr) => {
      for (let i = arr.length - 1; i > 0; i--) {
        const j = Math.floor(next() * (i + 1));
        const tmp = arr[i]; arr[i] = arr[j]; arr[j] = tmp;
      }
      return arr;
    },
  };
}

// ---- src/levels/ornaments.js ----
// Süs (ornament) bölümleri: yıldız çokgenler, halkalı mandalalar ve dönme/ayna simetrili desenler.
// Rastgele ızgara parçaları yerine, simetrik ve göze hoş gelen çizimler üretir. Her kenar kesişimi gerçek bir düğümdür
// (çizim "düzlemselleştirilir"), bu yüzden oyuncu hiçbir zaman belirsiz bir çaprazlama görmez.
// Saf işlevler: tarayıcıda (meydan okuma bölümleri) ve derleme aracında (paket) aynı kod çalışır.


const ORN_EPS = 1e-9;
const ORN_MERGE = 1e-6;
const ORN_SIZE = 10;
const ORN_MIN_EDGE = 0.42; // en kısa kenar (10 birimlik çizimde): daha kısası parmakla seçilemez
const ORN_MIN_ANGLE = 15; // bir düğümde birleşen iki kenar arasındaki en küçük açı (derece)
const ORN_MAX_NODES = 60;
const ORN_MIN_WIDTH = 6.5; // normalleştirilmiş çizimin dar kenarı en az bu kadar olmalı (kutu 10 birim)
const ORN_MAX_RATIO = 6.5; // en uzun / en kısa kenar: çok dengesiz çizimler hoş durmaz

const ornCross = (ax, ay, bx, by) => ax * by - ay * bx;
const ornRound = (v, d = 3) => { const f = 10 ** d; return Math.round(v * f) / f; };

/** Kenarları kesiştikleri yerlerden böler; kesişimler düğüm olur. Üst üste binen (aynı doğrultulu) kenar varsa null. */
function ornPlanarize(points, edges) {
  const pts = points.map((p) => [p[0], p[1]]);
  const keyOf = (x, y) => `${Math.round(x / ORN_MERGE)},${Math.round(y / ORN_MERGE)}`;
  const index = new Map(pts.map((p, i) => [keyOf(p[0], p[1]), i]));
  const splits = edges.map(() => []);
  const findPoint = (x, y) => {
    const k = keyOf(x, y);
    if (index.has(k)) return index.get(k);
    pts.push([x, y]); index.set(k, pts.length - 1);
    return pts.length - 1;
  };
  const scale = ORN_SIZE;
  for (let i = 0; i < edges.length; i++) {
    const [a1, b1] = edges[i];
    const p = pts[a1]; const q = pts[b1];
    const dx = q[0] - p[0]; const dy = q[1] - p[1]; const len2 = dx * dx + dy * dy;
    // Kenarın üstünde duran başka düğümler.
    for (let n = 0; n < points.length; n++) {
      if (n === a1 || n === b1) continue;
      const t = ((pts[n][0] - p[0]) * dx + (pts[n][1] - p[1]) * dy) / len2;
      if (t <= ORN_EPS || t >= 1 - ORN_EPS) continue;
      if (Math.hypot(pts[n][0] - (p[0] + dx * t), pts[n][1] - (p[1] + dy * t)) < 1e-6 * scale) splits[i].push({ t, p: n });
    }
    for (let j = i + 1; j < edges.length; j++) {
      const [a2, b2] = edges[j];
      if (a2 === a1 || a2 === b1 || b2 === a1 || b2 === b1) {
        // Ortak uçlu iki kenar aynı doğrultuda üst üste biniyorsa çizim geçersizdir.
        const shared = (a2 === a1 || a2 === b1) ? a2 : b2;
        const o1 = shared === a1 ? q : p; const o2 = shared === a2 ? pts[b2] : pts[a2];
        const s = pts[shared];
        const c = ornCross(o1[0] - s[0], o1[1] - s[1], o2[0] - s[0], o2[1] - s[1]);
        const d = (o1[0] - s[0]) * (o2[0] - s[0]) + (o1[1] - s[1]) * (o2[1] - s[1]);
        if (Math.abs(c) < 1e-9 && d > 0) return null;
        continue;
      }
      const r = pts[a2]; const s2 = pts[b2];
      const ex = s2[0] - r[0]; const ey = s2[1] - r[1];
      const den = ornCross(dx, dy, ex, ey);
      const wx = r[0] - p[0]; const wy = r[1] - p[1];
      if (Math.abs(den) < 1e-12) {
        if (Math.abs(ornCross(wx, wy, dx, dy)) < 1e-9) {
          // aynı doğru üzerinde: örtüşüyor mu?
          const t0 = (wx * dx + wy * dy) / len2; const t1 = ((s2[0] - p[0]) * dx + (s2[1] - p[1]) * dy) / len2;
          if (Math.max(Math.min(t0, t1), 0) < Math.min(Math.max(t0, t1), 1) - 1e-9) return null;
        }
        continue;
      }
      const t = ornCross(wx, wy, ex, ey) / den;
      const u = ornCross(wx, wy, dx, dy) / den;
      if (t < -ORN_EPS || t > 1 + ORN_EPS || u < -ORN_EPS || u > 1 + ORN_EPS) continue;
      const id = findPoint(p[0] + dx * t, p[1] + dy * t);
      if (id !== a1 && id !== b1) splits[i].push({ t, p: id });
      if (id !== a2 && id !== b2) splits[j].push({ t: u, p: id });
    }
  }
  const out = []; const seen = new Set();
  for (let i = 0; i < edges.length; i++) {
    const [a, b] = edges[i];
    const list = splits[i].sort((x, y) => x.t - y.t);
    let prev = a;
    for (const { p } of [...list, { p: b }]) {
      if (p === prev) continue;
      const key = prev < p ? `${prev}-${p}` : `${p}-${prev}`;
      if (seen.has(key)) return null; // aynı parça iki kez: örtüşme
      seen.add(key); out.push([prev, p]); prev = p;
    }
  }
  return { nodes: pts, edges: out };
}

function ornStats(nodes, edges) {
  const adj = nodes.map(() => []);
  for (const [a, b] of edges) { adj[a].push(b); adj[b].push(a); }
  let odd = 0;
  for (const l of adj) if (l.length % 2) odd++;
  const seen = new Set([0]); const stack = [0];
  while (stack.length) { const v = stack.pop(); for (const w of adj[v]) if (!seen.has(w)) { seen.add(w); stack.push(w); } }
  return { adj, odd, connected: seen.size === nodes.length };
}

/** Çizimi 10 birimlik dikey bir kutuya sığdırır. */
function ornNormalize(nodes) {
  let minX = Infinity; let minY = Infinity; let maxX = -Infinity; let maxY = -Infinity;
  for (const [x, y] of nodes) { minX = Math.min(minX, x); minY = Math.min(minY, y); maxX = Math.max(maxX, x); maxY = Math.max(maxY, y); }
  const w = maxX - minX; const h = maxY - minY;
  const landscape = w > h + 1e-9;
  const k = ORN_SIZE / Math.max(w, h);
  return nodes.map(([x, y]) => (landscape ? [ornRound((y - minY) * k), ornRound((x - minX) * k)] : [ornRound((x - minX) * k), ornRound((y - minY) * k)]));
}

/** Kenar uzunluğu ve açı kalitesi: sıkışık, sivri ya da ezilmiş çizimleri eler. */
function ornGoodLooking(nodes, edges, adj) {
  let shortest = Infinity; let longest = 0;
  for (const [a, b] of edges) { const l = Math.hypot(nodes[a][0] - nodes[b][0], nodes[a][1] - nodes[b][1]); shortest = Math.min(shortest, l); longest = Math.max(longest, l); }
  if (shortest < ORN_MIN_EDGE || longest > shortest * ORN_MAX_RATIO) return false;
  const minCos = Math.cos((ORN_MIN_ANGLE * Math.PI) / 180);
  for (let v = 0; v < nodes.length; v++) {
    const dirs = adj[v].map((w) => { const dx = nodes[w][0] - nodes[v][0]; const dy = nodes[w][1] - nodes[v][1]; const l = Math.hypot(dx, dy); return [dx / l, dy / l]; });
    for (let i = 0; i < dirs.length; i++) for (let j = i + 1; j < dirs.length; j++) if (dirs[i][0] * dirs[j][0] + dirs[i][1] * dirs[j][1] > minCos) return false;
  }
  return true;
}

/**
 * Ham çizimi (düğüm + kenar) bölüm verisine dönüştürür: düzlemselleştirir, Euler koşulunu, görünümü ve şemayı denetler.
 * @returns {{nodes:number[][], edges:number[][]}|null}
 */
function ornFinish(points, edges, limits) {
  const planar = ornPlanarize(points, edges);
  if (!planar) return null;
  const { nodes: rawNodes, edges: planarEdges } = planar;
  if (rawNodes.length > ORN_MAX_NODES || planarEdges.length < limits.minEdges || planarEdges.length > limits.maxEdges) return null;
  const st = ornStats(rawNodes, planarEdges);
  if (!st.connected || st.odd > 2 || planarEdges.length === rawNodes.length) return null; // düz halka (çokgen) bulmaca değildir
  const nodes = ornNormalize(rawNodes);
  let lo = Infinity; let hi = 0;
  for (const p of nodes) { lo = Math.min(lo, p[0]); hi = Math.max(hi, p[0]); }
  if (hi - lo < ORN_MIN_WIDTH) return null; // ince, dar çizimler ekranı boş bırakır
  if (!ornGoodLooking(nodes, planarEdges, st.adj)) return null;
  const level = { id: 'orn', tier: 'normal', nodes, edges: planarEdges.map((e) => [e[0], e[1]]) };
  if (!validateLevelData(level).ok) return null;
  return level;
}

// ---------------------------------------------------------------------------------------------- aileler

/** Yıldız çokgenler: n noktalı daire üzerinde, her s adımı için (k, k+s) bağlantıları. */
function ornCirculant(rng) {
  const n = rng.int(5, 13);
  const maxStep = Math.floor((n - 1) / 2);
  const steps = [];
  for (let s = 1; s <= maxStep; s++) steps.push(s);
  const picked = rng.shuffle(steps.slice()).slice(0, rng.int(1, Math.min(3, steps.length))).sort((a, b) => a - b);
  const points = [];
  for (let k = 0; k < n; k++) { const a = -Math.PI / 2 + (2 * Math.PI * k) / n; points.push([Math.cos(a), Math.sin(a)]); }
  const edges = [];
  for (const s of picked) for (let k = 0; k < n; k++) edges.push([k, (k + s) % n]);
  // Aynı bağlantı iki kez eklenmesin (s = n/2 dışlandı, yine de güvenli olsun).
  const seen = new Set(); const uniq = [];
  for (const [a, b] of edges) { const key = a < b ? `${a}-${b}` : `${b}-${a}`; if (!seen.has(key)) { seen.add(key); uniq.push([a, b]); } }
  return { points, edges: uniq, tag: `c${n}:${picked.join(',')}` };
}

/** İç içe halkalar: komşu halkaların düğümleri zikzak ("antiprizma") bantlarla bağlanır, halka kenarları isteğe bağlıdır. */
function ornRings(rng) {
  const n = rng.int(4, 10);
  const rings = rng.int(2, 3);
  const points = []; const edges = [];
  let radius = 1;
  const ids = [];
  const ratio = 0.5 + rng.next() * 0.25;
  for (let r = 0; r < rings; r++) {
    const row = [];
    for (let k = 0; k < n; k++) {
      const a = -Math.PI / 2 + (2 * Math.PI * (k + (r % 2) * 0.5)) / n;
      points.push([radius * Math.cos(a), radius * Math.sin(a)]);
      row.push(points.length - 1);
    }
    ids.push(row); radius *= ratio;
  }
  const ringOn = [];
  for (let r = 0; r < rings; r++) ringOn.push(rng.next() < 0.7);
  for (let r = 0; r < rings; r++) if (ringOn[r]) for (let k = 0; k < n; k++) edges.push([ids[r][k], ids[r][(k + 1) % n]]);
  for (let r = 0; r + 1 < rings; r++) {
    for (let k = 0; k < n; k++) {
      edges.push([ids[r][k], ids[r + 1][k]]);
      edges.push([ids[r][k], ids[r + 1][(k + n - 1) % n]]);
    }
  }
  return { points, edges, tag: `r${n}x${rings}:${ringOn.map((v) => (v ? 1 : 0)).join('')}` };
}

/** Üçgen kafes parçaları: üçgen, eşkenar dörtgen, yamuk. Köşe dereceleri tek olanlar en fazla iki olmalı (ornFinish denetler). */
function ornTriangular(rng) {
  const kind = rng.pick(['tri', 'rhomb', 'trap', 'para']);
  const a = rng.int(2, 5); const b = rng.int(2, 4);
  const inside = (i, j) => {
    if (kind === 'tri') return i >= 0 && j >= 0 && i + j <= a;
    if (kind === 'rhomb') return i >= 0 && j >= 0 && i <= a && j <= a;
    if (kind === 'trap') return j >= 0 && j <= b && i >= 0 && i + j <= a + b;
    return i >= 0 && j >= 0 && i <= a && j <= b;
  };
  const points = []; const id = new Map();
  for (let i = -1; i <= a + b + 1; i++) for (let j = -1; j <= a + b + 1; j++) if (inside(i, j)) { id.set(`${i},${j}`, points.length); points.push([i + j / 2, (j * Math.sqrt(3)) / 2]); }
  const edges = [];
  for (const [key, v] of id) {
    const [i, j] = key.split(',').map(Number);
    for (const [di, dj] of [[1, 0], [0, 1], [-1, 1]]) {
      const w = id.get(`${i + di},${j + dj}`);
      if (w !== undefined) edges.push([v, w]);
    }
  }
  return { points, edges, tag: `t${kind}${a}x${b}` };
}

/**
 * Dönme (ve isteğe bağlı ayna) simetrili mandala: n kat simetri; dilimdeki birkaç düğümün yörüngesi alınır,
 * kısa kenar adayları yörüngelere ayrılır ve rastgele bir yörünge alt kümesi seçilir.
 */
function ornMandala(rng) {
  const n = rng.pick([1, 1, 1, 1, 2, 2, 2, 3, 4, 5, 6, 6, 7, 8, 8, 9, 10, 11, 12, 14]);
  const mirror = n <= 5 || rng.next() < 0.9; // yalnız döndürmeli desenler küçük n'de dağınık görünür
  const gens = n === 1 ? rng.int(4, 8) : (n === 2 ? rng.int(3, 6) : rng.int(2, 5));
  const sector = (2 * Math.PI) / n;
  const gen = [];
  const usedR = new Set();
  for (let g = 0; g < gens; g++) {
    let r = 0.3 + rng.next() * 0.7;
    if (g === 0 && rng.next() < 0.25) r = 1; // dış halka
    if (usedR.has(ornRound(r, 1))) r = Math.min(1, r + 0.17);
    usedR.add(ornRound(r, 1));
    let th = rng.next();
    if (mirror) th = th < 0.3 ? 0 : (th > 0.7 ? 0.5 : th * 0.5); // ayna ekseni üstünde ya da arasında (sector * th)
    else th *= 1;
    gen.push([r, th * sector]);
  }
  const center = rng.next() < 0.3;
  const transforms = [];
  for (let k = 0; k < n; k++) { transforms.push((x, y) => { const c = Math.cos(sector * k); const s = Math.sin(sector * k); return [x * c - y * s, x * s + y * c]; }); }
  if (mirror) for (let k = 0; k < n; k++) { transforms.push((x, y) => { const c = Math.cos(sector * k); const s = Math.sin(sector * k); const my = -y; return [x * c - my * s, x * s + my * c]; }); }
  const points = []; const index = new Map();
  const keyOf = (x, y) => `${Math.round(x * 1e5)},${Math.round(y * 1e5)}`;
  const add = (x, y) => { const k = keyOf(x, y); if (!index.has(k)) { index.set(k, points.length); points.push([x, y]); } return index.get(k); };
  if (center) add(0, 0);
  for (const [r, th] of gen) { const x = r * Math.cos(th); const y = r * Math.sin(th); for (const t of transforms) { const [px, py] = t(x, y); add(px, py); } }
  if (points.length > 56 || points.length < 6) return null;
  // Aday kenarlar: yeterince yakın düğüm çiftleri.
  const dists = [];
  for (let i = 0; i < points.length; i++) for (let j = i + 1; j < points.length; j++) dists.push(Math.hypot(points[i][0] - points[j][0], points[i][1] - points[j][1]));
  dists.sort((a, b) => a - b);
  const limit = dists[Math.min(dists.length - 1, Math.floor(points.length * (1.2 + rng.next() * 2.2)))];
  const permute = transforms.map((t) => points.map((p) => { const [x, y] = t(p[0], p[1]); const k = index.get(keyOf(x, y)); return k === undefined ? -1 : k; }));
  const orbitOf = new Map(); const orbits = [];
  for (let i = 0; i < points.length; i++) {
    for (let j = i + 1; j < points.length; j++) {
      if (Math.hypot(points[i][0] - points[j][0], points[i][1] - points[j][1]) > limit + 1e-9) continue;
      const k0 = `${i}-${j}`;
      if (orbitOf.has(k0)) continue;
      const orb = new Set();
      for (const pm of permute) {
        const a = pm[i]; const b = pm[j];
        if (a < 0 || b < 0) continue;
        orb.add(a < b ? `${a}-${b}` : `${b}-${a}`);
      }
      const list = [...orb].map((s) => s.split('-').map(Number));
      orbits.push(list);
      for (const s of orb) orbitOf.set(s, orbits.length - 1);
    }
  }
  if (orbits.length < 3) return null;
  return { points, orbits, tag: `m${n}${mirror ? 'm' : 'r'}`, subset: true };
}

/** Mandala yörüngelerinden rastgele bir alt küme seçip ham kenar listesi verir. */
function ornPickOrbits(skeleton, rng, maxRaw) {
  const p = 0.3 + rng.next() * 0.4;
  const edges = [];
  for (const orb of skeleton.orbits) if (rng.next() < p) for (const e of orb) edges.push(e);
  if (edges.length < 8 || edges.length > maxRaw) return null;
  return { points: skeleton.points, edges, tag: skeleton.tag };
}

/** Bir ailenin tek denemesi: { level, tag } ya da null. */
function ornTry(rng, family, limits) {
  if (family === 'mandala') {
    const sk = ornMandala(rng);
    if (!sk) return null;
    for (let attempt = 0; attempt < 40; attempt++) {
      const raw = ornPickOrbits(sk, rng, limits.maxEdges);
      if (!raw) continue;
      const level = ornFinish(raw.points, raw.edges, limits);
      if (level) return { level, tag: raw.tag };
    }
    return null;
  }
  const raw = family === 'circulant' ? ornCirculant(rng) : (family === 'rings' ? ornRings(rng) : ornTriangular(rng));
  const level = ornFinish(raw.points, raw.edges, limits);
  return level ? { level, tag: raw.tag } : null;
}

/** Bir Euler izi (Hierholzer) bulur; tek dereceli düğüm varsa onlardan birinden başlar. */
function ornEulerTrail(level, rng) {
  const n = level.nodes.length;
  const adj = Array.from({ length: n }, () => []);
  level.edges.forEach((e, k) => { adj[e[0]].push([e[1], k]); adj[e[1]].push([e[0], k]); });
  const oddNodes = adj.map((l, i) => (l.length % 2 ? i : -1)).filter((i) => i >= 0);
  const start = oddNodes.length ? rng.pick(oddNodes) : rng.int(0, n - 1);
  const used = new Uint8Array(level.edges.length);
  const ptr = adj.map(() => 0);
  for (const l of adj) rng.shuffle(l);
  const stack = [[start, -1]]; const trail = [];
  while (stack.length) {
    const [v, viaEdge] = stack[stack.length - 1];
    while (ptr[v] < adj[v].length && used[adj[v][ptr[v]][1]]) ptr[v]++;
    if (ptr[v] === adj[v].length) { stack.pop(); trail.push([v, viaEdge]); } else {
      const [w, k] = adj[v][ptr[v]++]; used[k] = 1; stack.push([w, k]);
    }
  }
  trail.reverse();
  return { start, steps: trail.slice(1).map(([v, k], i) => ({ from: trail[i][0], to: v, edge: k })) };
}

/** Euler izi boyunca birkaç kenarı tek yönlü yapar: iz hâlâ geçerli olduğundan bölüm çözülebilir kalır. */
function ornWithOneWay(level, count, rng) {
  if (!count) return level;
  const trail = ornEulerTrail(level, rng);
  if (trail.steps.length !== level.edges.length) return level;
  const chosen = new Set(rng.shuffle(trail.steps.map((_, i) => i)).slice(0, count));
  const edges = level.edges.map((e) => [e[0], e[1]]);
  trail.steps.forEach((s, i) => { if (chosen.has(i)) edges[s.edge] = [s.from, s.to, 1]; });
  return { ...level, edges };
}

/** Soyut çizge parmak izi (renk inceltme): döndürülmüş, aynalanmış ya da başka biçimde çizilmiş aynı çizge aynı değeri verir. */
function ornGraphHash(level) {
  const n = level.nodes.length;
  const adj = Array.from({ length: n }, () => []);
  for (const [a, b] of level.edges) { adj[a].push(b); adj[b].push(a); }
  let color = adj.map((l) => String(l.length));
  for (let round = 0; round < 5; round++) {
    color = adj.map((l, v) => `${color[v]}(${l.map((w) => color[w]).sort().join(',')})`);
    const ids = new Map([...new Set(color)].sort().map((c, i) => [c, String(i)]));
    color = color.map((c) => ids.get(c));
  }
  return `${n}:${level.edges.length}:${color.slice().sort().join('.')}`;
}

/**
 * Çizim parmak izi: soyut çizge + düğümlerin merkeze uzaklıkları + kenar uzunlukları (kaba basamaklı).
 * Döndürülmüş ya da aynalanmış kopyalar aynı değeri verir; yalnızca biraz kaydırılmış çizimler de ayrı sayılmaz.
 */
function ornDrawingHash(level) {
  const cx = level.nodes.reduce((a, p) => a + p[0], 0) / level.nodes.length;
  const cy = level.nodes.reduce((a, p) => a + p[1], 0) / level.nodes.length;
  const q = (v, step) => Math.round(v / step);
  const radii = level.nodes.map((p) => q(Math.hypot(p[0] - cx, p[1] - cy), 0.9)).sort((a, b) => a - b).join(',');
  const lens = level.edges.map(([a, b]) => q(Math.hypot(level.nodes[a][0] - level.nodes[b][0], level.nodes[a][1] - level.nodes[b][1]), 0.9)).sort((a, b) => a - b).join(',');
  return `${ornGraphHash(level)}|${radii}|${lens}`;
}

// ---- src/levels/solver.js ----
// Çözücü: çözülebilirlik, ipucu, çözüm sayımı. İki bağımsız yöntem içerir:
//  1) geri izlemeli arama (her kural için geçerli, tek yönlü kenarlar dahil)
//  2) Euler teoremi (yalnız yönsüz çizgeler) — testlerde (1) ile çapraz doğrulanır.


class SearchBudgetExceeded extends Error {}

function unusedDegreeOdd(graph, used, nodeId) {
  let d = 0;
  for (const { edge } of graph.neighbors(nodeId)) if (!used[edge.index]) d++;
  return (d & 1) === 1;
}

/** Kalan tüm kenarlara mevcut düğümden (yön gözetmeden) ulaşılabiliyor mu? */
function remainingConnected(graph, used, current, remaining) {
  if (remaining === 0) return true;
  const seenNode = new Set([current]);
  const stack = [current];
  const seenEdge = new Set();
  while (stack.length) {
    const n = stack.pop();
    for (const { edge, to } of graph.neighbors(n)) {
      if (used[edge.index]) continue;
      seenEdge.add(edge.index);
      if (!seenNode.has(to)) { seenNode.add(to); stack.push(to); }
    }
  }
  return seenEdge.size === remaining;
}

function feasible(graph, used, current, remaining) {
  if (!remainingConnected(graph, used, current, remaining)) return false;
  if (graph.hasOneWay) return true; // yönlü kenar varken parite ölçütü yeterli değil; aramaya bırak
  let odd = 0; let currentOdd = false;
  for (const n of graph.nodes) {
    if (unusedDegreeOdd(graph, used, n.id)) { odd++; if (n.id === current) currentOdd = true; }
  }
  return odd === 0 || (odd === 2 && currentOdd);
}

function dfs(graph, used, path, remaining, onSolution, budget) {
  if (remaining === 0) return onSolution(path);
  if (++budget.count > budget.max) throw new SearchBudgetExceeded();
  const current = path[path.length - 1];
  if (!feasible(graph, used, current, remaining)) return false;
  for (const { edge, to } of graph.neighbors(current)) {
    if (used[edge.index] || !graph.canTraverse(edge, current)) continue;
    used[edge.index] = 1; path.push(to);
    const stop = dfs(graph, used, path, remaining - 1, onSolution, budget);
    path.pop(); used[edge.index] = 0;
    if (stop) return true;
  }
  return false;
}

function replay(graph, prefix) {
  const used = new Uint8Array(graph.edges.length);
  if (!graph.hasNode(prefix[0])) return null;
  for (let i = 1; i < prefix.length; i++) {
    const edge = graph.edgeBetween(prefix[i - 1], prefix[i]);
    if (!edge || used[edge.index] || !graph.canTraverse(edge, prefix[i - 1])) return null;
    used[edge.index] = 1;
  }
  return used;
}

function candidateStarts(graph, startNodes) {
  return startNodes && startNodes.length ? startNodes.filter((id) => graph.hasNode(id)) : graph.nodes.map((n) => n.id);
}

/**
 * Tam bir çözüm yolu (düğüm id dizisi) döndürür; yoksa null.
 * opts.path verilirse çözüm o yarım çizimin devamı olmak zorundadır.
 */
function findSolution(graph, opts = {}) {
  const budget = { count: 0, max: opts.maxExpansions || CONFIG.solver.maxExpansions };
  let found = null;
  const capture = (p) => { found = p.slice(); return true; };
  try {
    if (opts.path && opts.path.length) {
      if (opts.startNodes && opts.startNodes.length && !opts.startNodes.includes(opts.path[0])) return null;
      const used = replay(graph, opts.path);
      if (!used) return null;
      const remaining = graph.edges.length - (opts.path.length - 1);
      dfs(graph, used, opts.path.slice(), remaining, capture, budget);
      return found;
    }
    for (const s of candidateStarts(graph, opts.startNodes)) {
      const used = new Uint8Array(graph.edges.length);
      if (dfs(graph, used, [s], graph.edges.length, capture, budget)) return found;
    }
  } catch (err) {
    if (err instanceof SearchBudgetExceeded) return null; // bilinmeyen = çözülemez say (güvenli taraf)
    throw err;
  }
  return found;
}

/** Çözüm sayısı (üst sınırlı). @returns {{count:number, capped:boolean}} */
function countSolutions(graph, startNodes = null, cap = CONFIG.solver.solutionCountCap) {
  const budget = { count: 0, max: CONFIG.solver.maxExpansions };
  let count = 0;
  const tick = () => { count++; return count >= cap; };
  try {
    for (const s of candidateStarts(graph, startNodes)) {
      const used = new Uint8Array(graph.edges.length);
      if (dfs(graph, used, [s], graph.edges.length, tick, budget)) return { count, capped: true };
    }
  } catch (err) {
    if (err instanceof SearchBudgetExceeded) return { count, capped: true };
    throw err;
  }
  return { count, capped: false };
}

/** İzin verilen başlangıçlar içinde çözüme götürenler. */
function solvableStarts(graph, startNodes = null) {
  return candidateStarts(graph, startNodes).filter((s) => findSolution(graph, { path: [s] }) !== null);
}

/**
 * Oyuncunun mevcut çizimine göre ipucu.
 * @returns {{type:'start',node:number}|{type:'move',from:number,to:number}|{type:'undo'}|{type:'done'}|{type:'none'}}
 */
function nextHint(graph, path, startNodes = null) {
  if (!path || path.length === 0) {
    const sol = findSolution(graph, { startNodes });
    return sol ? { type: 'start', node: sol[0] } : { type: 'none' };
  }
  if (path.length - 1 === graph.edges.length) return { type: 'done' };
  const sol = findSolution(graph, { path, startNodes });
  if (!sol) return { type: 'undo' };
  return { type: 'move', from: path[path.length - 1], to: sol[path.length] };
}

/**
 * Euler teoremi (yalnız yönsüz çizge): bağlantılı ve tek dereceli düğüm sayısı 0 ya da 2 ise iz vardır.
 * @returns {{solvable:boolean, oddNodes:number[], starts:number[]}}
 */
function eulerTheorem(graph) {
  if (graph.hasOneWay) throw new Error('eulerTheorem yalnız yönsüz çizgeler içindir');
  const used = new Uint8Array(graph.edges.length);
  const oddNodes = graph.nodes.filter((n) => unusedDegreeOdd(graph, used, n.id)).map((n) => n.id);
  const anchor = graph.edges.length ? graph.edges[0].a : null;
  const connected = anchor === null ? true : remainingConnected(graph, used, anchor, graph.edges.length);
  const solvable = connected && (oddNodes.length === 0 || oddNodes.length === 2);
  let starts = [];
  if (solvable) starts = oddNodes.length === 2 ? oddNodes.slice() : graph.nodes.filter((n) => graph.neighbors(n.id).length > 0).map((n) => n.id);
  return { solvable, oddNodes, starts };
}

// ---- src/levels/fresh.js ----
// Çalışma anında (günlük bulmaca, meydan okuma bölümleri) yeni bir süs bölümü üretir; paketteki bölümlerle aynı üreticiyi kullanır.




const FRESH_FAMILIES = ['mandala', 'mandala', 'mandala', 'mandala', 'rings', 'rings', 'circulant', 'tri'];
const FRESH_ATTEMPTS = 400;

/**
 * @param rng tohumlu üreteç
 * @param {{minEdges:number, maxEdges:number, oneWay:[number,number]}} spec
 * @returns {{data, graph, startNodes}|null}
 */
function freshLevel(rng, id, tier, spec) {
  for (let attempt = 0; attempt < FRESH_ATTEMPTS; attempt++) {
    const relax = attempt > 80 ? 10 : attempt > 25 ? 5 : 0; // zor kenar aralığı tutmuyorsa biraz gevşet; yine de bölüm üretilsin
    const r = ornTry(rng, rng.pick(FRESH_FAMILIES), { minEdges: spec.minEdges - relax, maxEdges: spec.maxEdges + relax });
    if (!r) continue;
    const data = { ...ornWithOneWay(r.level, rng.int(spec.oneWay[0], spec.oneWay[1]), rng), id, tier };
    const { graph, startNodes } = levelToGraph(data);
    if (findSolution(graph, { startNodes, maxExpansions: 20000 })) return { data, graph, startNodes };
  }
  return null;
}

// ---- src/levels/daily.js ----
// Günlük bulmaca: tarihten türeyen tohum → herkes aynı gün aynı bulmacayı görür. Çalışma anında doğrulanır.



const DAILY_TIER_BY_WEEKDAY = ['hard', 'normal', 'normal', 'hard', 'hard', 'hard', 'expert']; // Pazar..Cumartesi
const DAILY_SEED_PREFIX = 'linetra-daily-v2:';
const DAILY_SPECS = { normal: { minEdges: 14, maxEdges: 24, oneWay: [0, 1] }, hard: { minEdges: 18, maxEdges: 32, oneWay: [1, 3] }, expert: { minEdges: 24, maxEdges: 40, oneWay: [2, 5] } };
const MAX_SEED_RETRIES = 20;

function pad2(n) { return String(n).padStart(2, '0'); }

/** Yerel tarihe göre 'YYYY-AA-GG'. */
function dateKey(date = new Date()) {
  return `${date.getFullYear()}-${pad2(date.getMonth() + 1)}-${pad2(date.getDate())}`;
}

function previousDateKey(key) {
  const [y, m, d] = key.split('-').map(Number);
  return dateKey(new Date(y, m - 1, d - 1));
}

function isDateKey(key) {
  return typeof key === 'string' && /^\d{4}-\d{2}-\d{2}$/.test(key);
}

/** @returns {{id,tier,graph,startNodes,data,dateKey}} */
function dailyLevel(key = dateKey()) {
  if (!isDateKey(key)) throw new Error(`Geçersiz tarih anahtarı: ${key}`);
  const [y, m, d] = key.split('-').map(Number);
  const tier = DAILY_TIER_BY_WEEKDAY[new Date(y, m - 1, d).getDay()];
  for (let retry = 0; retry < MAX_SEED_RETRIES; retry++) {
    const rng = createRng(`${DAILY_SEED_PREFIX}${key}:${retry}`);
    const made = freshLevel(rng, `daily-${key}`, tier, DAILY_SPECS[tier]);
    if (made) return { id: made.data.id, tier, graph: made.graph, startNodes: made.startNodes, data: made.data, dateKey: key };
  }
  throw new Error(`Günlük bulmaca üretilemedi: ${key}`);
}

// ---- src/levels/continued.js ----
// Bütün bölümler bitince devam eden "meydan okuma" bölümleri: sıra numarasından türeyen tohumla üretilir,
// herkes aynı sırada aynı bölümü görür. Her bölüm çalışma anında şemadan ve çözücüden geçer.



const MORE_SEED_PREFIX = 'linetra-more-v2:';
const MORE_SEED_RETRIES = 12;

/** k büyüdükçe kenar sayısı ve tek yönlü kenar sayısı artar (48. bölümde tavana ulaşır). */
function continuedSpec(k) {
  const grow = Math.min(Math.floor(k / 4), 12);
  return { minEdges: 26 + grow, maxEdges: 42 + grow, oneWay: [2, Math.min(4 + Math.floor(k / 10), 8)] };
}

/** @param {number} k 0'dan başlayan sıra; @param {number} firstNumber bu bölümün oyundaki ilk numarası (k=0 için) */
function continuedLevel(k, firstNumber = 1) {
  if (!Number.isInteger(k) || k < 0) throw new Error(`Geçersiz sıra: ${k}`);
  const spec = continuedSpec(k);
  for (let retry = 0; retry < MORE_SEED_RETRIES; retry++) {
    const made = freshLevel(createRng(`${MORE_SEED_PREFIX}${k}:${retry}`), `m-${k + 1}`, 'expert', spec);
    if (made) return { id: made.data.id, tier: 'expert', graph: made.graph, startNodes: made.startNodes, data: made.data, index: firstNumber - 1 + k, number: firstNumber + k, extra: k };
  }
  throw new Error(`Bölüm üretilemedi: ${k}`);
}

// ---- src/progress/storage.js ----
// Güvenli kayıt katmanı. Depolama yoksa, doluysa ya da veri bozuksa oyun çökmez; güvenli varsayılana döner.
// Her başarılı yazımda bir önceki sağlam kayıt ".bak" olarak tutulur.

function createMemoryBackend() {
  const map = new Map();
  return {
    getItem: (k) => (map.has(k) ? map.get(k) : null),
    setItem: (k, v) => { map.set(k, String(v)); },
    removeItem: (k) => { map.delete(k); },
  };
}

/** Tarayıcı depolamasını dener; erişilemiyorsa bellek içi yedeğe düşer. */
function resolveBackend(getNative) {
  try {
    const native = getNative();
    const probe = '__linetra_probe__';
    native.setItem(probe, '1');
    native.removeItem(probe);
    return { backend: native, persistent: true };
  } catch (err) {
    return { backend: createMemoryBackend(), persistent: false };
  }
}

class SafeStore {
  /**
   * @param {{getItem:Function,setItem:Function,removeItem:Function}} backend
   * @param {string} key
   * @param {(raw:any)=>object} sanitize  her türlü girdiyi geçerli duruma çevirir; kurtarılamazsa hata fırlatır
   * @param {(info:{stage:string,error:Error})=>void} [onProblem]
   */
  constructor(backend, key, sanitize, onProblem = () => {}) {
    this.backend = backend;
    this.key = key;
    this.sanitize = sanitize;
    this.onProblem = onProblem;
    this.lastLoadSource = 'none'; // 'main' | 'backup' | 'default'
  }

  _read(key) {
    const text = this.backend.getItem(key);
    if (text === null || text === undefined) return undefined;
    return this.sanitize(JSON.parse(text));
  }

  load(makeDefault) {
    for (const [key, source] of [[this.key, 'main'], [`${this.key}.bak`, 'backup']]) {
      try {
        const value = this._read(key);
        if (value !== undefined) { this.lastLoadSource = source; return value; }
      } catch (error) {
        this.onProblem({ stage: `load-${source}`, error });
      }
    }
    this.lastLoadSource = 'default';
    return makeDefault();
  }

  /** @returns {boolean} yazılabildi mi */
  save(value) {
    try {
      const text = JSON.stringify(value);
      const previous = this.backend.getItem(this.key);
      if (previous !== null && previous !== undefined && previous !== text) {
        try { JSON.parse(previous); this.backend.setItem(`${this.key}.bak`, previous); } catch (e) { /* bozuk eski kayıt yedeklenmez */ }
      }
      this.backend.setItem(this.key, text);
      return true;
    } catch (error) {
      this.onProblem({ stage: 'save', error });
      return false;
    }
  }

  clear() {
    try { this.backend.removeItem(this.key); this.backend.removeItem(`${this.key}.bak`); return true; }
    catch (error) { this.onProblem({ stage: 'clear', error }); return false; }
  }
}

    trail: '#C92F12', accent: '#CC3A17', accentInk: '#FFFFFF', contour: '#E1E8EE',
  }),

const BY_ID = new Map(BACKGROUNDS.map((b) => [b.id, b]));

function isBackgroundId(id) { return typeof id === 'string' && BY_ID.has(id); }
function getBackground(id) { return BY_ID.get(id) || BY_ID.get(DEFAULT_BACKGROUND); }
function isBackgroundUnlocked(background, solvedCount) { return solvedCount >= background.unlockAt; }

/** Seçili zemin geçersiz ya da kilitliyse varsayılan siyaha düşer. */
function resolveBackground(id, solvedCount) {
  const chosen = BY_ID.get(id);
  return chosen && isBackgroundUnlocked(chosen, solvedCount) ? chosen : getBackground(DEFAULT_BACKGROUND);
}

/** Çözülen sayısı `before`'dan `after`'a çıkarken açılan zeminler. */
function newlyUnlocked(before, after) {
  return BACKGROUNDS.filter((b) => b.unlockAt > before && b.unlockAt <= after);
}

// Çizgi rengi: zeminden bağımsız seçilir. Her renk, koyu ve açık zemin için ayrı tonda tanımlıdır;

const AUTO_LINE = 'auto';

  Object.freeze({ id: 'red', nameKey: 'lcRed', dark: '#FF1F1F', light: '#D40000' }),
  Object.freeze({ id: 'orange', nameKey: 'lcOrange', dark: '#FF8000', light: '#C25600' }),

]);
const LINE_BY_ID = new Map(LINE_COLORS.map((c) => [c.id, c]));

function isLineChoice(id) { return id === AUTO_LINE || (typeof id === 'string' && LINE_BY_ID.has(id)); }

/** Zemin ve seçilen çizgi renginden gerçek iz rengi (hex). Geçersiz seçim zeminin kendi rengine düşer. */
function resolveTrail(background, lineId) {
  const chosen = typeof lineId === 'string' ? LINE_BY_ID.get(lineId) : undefined;
  return chosen ? chosen[background.tone] : background.colors.trail;
}

/** CSS özel değişkenleri. Çizim kodu da renkleri bunlardan okur. */
function backgroundVars(background, lineId = AUTO_LINE) {
  const c = background.colors;

    '--trail': resolveTrail(background, lineId), '--accent': c.accent, '--accent-ink': c.accentInk,

}

// ---- src/progress/progress.js ----
// Oyuncu ilerlemesi: tamamlanan bölümler, yıldızlar, ayarlar, istatistikler, günlük seri, başarımlar.





const MAX_STARS = CONFIG.rules.maxStars;
const MAX_DAILY_HISTORY = 400;
const KNOWN_TIPS = ['oneWay'];

function defaultSave() {
  return {
    v: CONFIG.save.version,
    levels: {},   // id -> { stars }
    daily: {},    // dateKey -> { stars }
    settings: { sound: true, haptics: true, lang: CONFIG.i18n.auto, bg: DEFAULT_BACKGROUND, line: AUTO_LINE },
    stats: { strokes: 0, hints: 0, undos: 0, playMs: 0, streak: 0, bestStreak: 0, lastDaily: null },
    tips: {},     // öğretici ipucu adı -> true (bir kez gösterildi)
    achievements: {}, // id -> zaman damgası
    more: 0,      // bütün bölümler bittikten sonra çözülen meydan okuma bölümü sayısı
  };
}

function clampInt(v, min, max, fallback) {
  return Number.isFinite(v) ? Math.max(min, Math.min(max, Math.floor(v))) : fallback;
}
function starValue(v) { return Number.isFinite(v) && v >= 1 ? Math.min(MAX_STARS, Math.floor(v)) : 0; }
function isValidLang(v) { return v === CONFIG.i18n.auto || CONFIG.i18n.languages.includes(v); }
function isPlainObject(o) { return o !== null && typeof o === 'object' && !Array.isArray(o); }

/** Her türlü girdiyi geçerli kayda çevirir. Tanınmayan sürüm ya da nesne olmayan veri hata fırlatır. */
function sanitizeSave(raw) {
  if (!isPlainObject(raw)) throw new Error('kayıt nesne değil');
  if (raw.v !== CONFIG.save.version) throw new Error(`desteklenmeyen kayıt sürümü: ${raw.v}`);
  const out = defaultSave();
  if (isPlainObject(raw.levels)) {
    for (const [id, rec] of Object.entries(raw.levels)) {
      if (typeof id === 'string' && id.length <= 32 && isPlainObject(rec)) {
        const stars = starValue(rec.stars);
        if (stars) out.levels[id] = { stars };
      }
    }
  }
  if (isPlainObject(raw.daily)) {
    for (const key of Object.keys(raw.daily).filter(isDateKey).sort().slice(-MAX_DAILY_HISTORY)) {
      const rec = raw.daily[key];
      const stars = isPlainObject(rec) ? starValue(rec.stars) : 0;
      if (stars) out.daily[key] = { stars };
    }
  }
  if (isPlainObject(raw.settings)) {
    for (const k of Object.keys(out.settings)) if (k !== 'lang' && k !== 'bg' && k !== 'line' && typeof raw.settings[k] === 'boolean') out.settings[k] = raw.settings[k];
    if (isBackgroundId(raw.settings.bg)) out.settings.bg = raw.settings.bg;
    if (isLineChoice(raw.settings.line)) out.settings.line = raw.settings.line;
    if (isValidLang(raw.settings.lang)) out.settings.lang = raw.settings.lang;
  }
  if (isPlainObject(raw.stats)) {
    const s = raw.stats;
    for (const k of ['strokes', 'hints', 'undos', 'playMs', 'streak', 'bestStreak']) out.stats[k] = clampInt(s[k], 0, Number.MAX_SAFE_INTEGER, 0);
    out.stats.lastDaily = isDateKey(s.lastDaily) ? s.lastDaily : null;
    if (out.stats.bestStreak < out.stats.streak) out.stats.bestStreak = out.stats.streak;
  }
  if (isPlainObject(raw.tips)) {
    for (const k of KNOWN_TIPS) if (raw.tips[k] === true) out.tips[k] = true;
  }
  if (isPlainObject(raw.achievements)) {
    const known = new Set(ACHIEVEMENTS.map((a) => a.id));
    for (const [id, ts] of Object.entries(raw.achievements)) if (known.has(id) && Number.isFinite(ts)) out.achievements[id] = ts;
  }
  out.more = clampInt(raw.more, 0, 1e6, 0);
  return out;
}

/** Yıldız: 3'ten başlar; geri alma/yeniden başlatma −1, ipucu −1; en az 1. */
function computeStars({ undos = 0, resets = 0, hints = 0 }) {
  let stars = MAX_STARS;
  if (undos + resets > 0) stars--;
  if (hints > 0) stars--;
  return Math.max(1, stars);
}

class Progress {
  /**
   * @param {import('./storage.js').SafeStore} store
   * @param {import('../levels/catalog.js').LevelCatalog} catalog
   * @param {() => number} [now]
   */
  constructor(store, catalog, now = () => Date.now()) {
    this.store = store;
    this.catalog = catalog;
    this.now = now;
    this.data = store.load(defaultSave);
    this.lastSaveOk = true;
  }

  get settings() { return this.data.settings; }
  hasSeenTip(name) { return this.data.tips[name] === true; }
  markTipSeen(name) {
    if (!KNOWN_TIPS.includes(name) || this.data.tips[name]) return false;
    this.data.tips[name] = true;
    return this._save();
  }
  setSetting(name, value) {
    if (!(name in this.data.settings)) return false;
    if (name === 'bg') {
      // Kilitli zemin seçilemez; kilit çözülen bölüm sayısından hesaplanır.
      if (!isBackgroundId(value) || !isBackgroundUnlocked(getBackground(value), this.solvedCount())) return false;
    } else if (name === 'line') {
      if (!isLineChoice(value)) return false;
    } else if (name === 'lang' ? !isValidLang(value) : typeof value !== 'boolean') return false;
    this.data.settings[name] = value;
    return this._save();
  }

  /** Çözülmüş (en az 1 yıldızlı) bölüm sayısı. Günlük bulmacalar sayılmaz. */
  solvedCount() {
    let n = 0;
    for (const level of this.catalog.levels) if (this.starsFor(level.id) > 0) n++;
    return n;
  }

  starsFor(levelId) { const r = this.data.levels[levelId]; return r ? r.stars : 0; }
  isCompleted(levelId) { return this.starsFor(levelId) > 0; }

  /** Kilit: tamamlanmamış ilk N bölüm açık; tamamlananlar her zaman açık. */
  isUnlocked(index) {
    if (!this.catalog.has(index)) return false;
    if (this.isCompleted(this.catalog.data(index).id)) return true;
    let open = 0;
    for (let i = 0; i < index; i++) {
      if (!this.isCompleted(this.catalog.data(i).id)) { open++; if (open >= CONFIG.rules.unlockWindow) return false; }
    }
    return true;
  }

  /** Oynanacak sıradaki bölüm: tamamlanmamış ilk bölüm; hepsi bittiyse son bölüm. */
  nextLevelIndex() {
    for (let i = 0; i < this.catalog.count; i++) if (!this.isCompleted(this.catalog.data(i).id)) return i;
    return Math.max(0, this.catalog.count - 1);
  }

  /** @returns {{stars:number,improved:boolean,newAchievements:string[],newBackgrounds:string[],saved:boolean}} */
  recordLevel(levelId, counters) {
    const stars = computeStars(counters);
    const prev = this.starsFor(levelId);
    const solvedBefore = this.solvedCount();
    if (stars > prev) this.data.levels[levelId] = { stars };
    const result = this._finish(stars, stars > prev, counters);
    result.newBackgrounds = newlyUnlocked(solvedBefore, this.solvedCount()).map((b) => b.id);
    return result;
  }

  recordDaily(key, counters) {
    if (!isDateKey(key)) throw new Error(`Geçersiz tarih anahtarı: ${key}`);
    const stars = computeStars(counters);
    const prev = this.data.daily[key] ? this.data.daily[key].stars : 0;
    if (!prev) {
      const st = this.data.stats;
      st.streak = st.lastDaily === previousDateKey(key) ? st.streak + 1 : 1;
      if (st.lastDaily === null || key > st.lastDaily) st.lastDaily = key;
      st.bestStreak = Math.max(st.bestStreak, st.streak);
    }
    if (stars > prev) this.data.daily[key] = { stars };
    const result = this._finish(stars, stars > prev, counters);
    result.newBackgrounds = [];
    return result;
  }

  /** Meydan okuma bölümlerinden kaçı çözüldü; sıradaki bölümün sırası da budur. */
  moreSolved() { return this.data.more; }

  /** k. meydan okuma bölümü çözüldü. Yalnız sıradaki bölüm ilerlemeyi artırır; eskileri tekrar oynamak sayılmaz. */
  recordMore(k, counters) {
    const stars = computeStars(counters);
    const first = k === this.data.more;
    if (first) this.data.more++;
    const result = this._finish(stars, first, counters);
    result.newBackgrounds = [];
    return result;
  }

  dailyStars(key) { return this.data.daily[key] ? this.data.daily[key].stars : 0; }

  /** Bugün itibarıyla geçerli seri (dün ya da bugün çözülmediyse 0). */
  currentStreak(todayKey) {
    const last = this.data.stats.lastDaily;
    return last === todayKey || last === previousDateKey(todayKey) ? this.data.stats.streak : 0;
  }

  addPlayTime(ms) {
    if (Number.isFinite(ms) && ms > 0) { this.data.stats.playMs += Math.floor(ms); this._save(); }
  }

  summary() {
    let solved = 0; let perfect = 0; let stars = 0;
    const tierTotal = {}; const tierSolved = {};
    for (const level of this.catalog.levels) {
      tierTotal[level.tier] = (tierTotal[level.tier] || 0) + 1;
      const s = this.starsFor(level.id);
      if (s) { solved++; stars += s; tierSolved[level.tier] = (tierSolved[level.tier] || 0) + 1; if (s === MAX_STARS) perfect++; }
    }
    const tierDone = {};
    for (const t of Object.keys(tierTotal)) tierDone[t] = (tierSolved[t] || 0) === tierTotal[t];
    const st = this.data.stats;
    return {
      total: this.catalog.count, solved, perfect, stars, maxStars: this.catalog.count * MAX_STARS,
      tierTotal, tierSolved, tierDone,
      dailySolved: Object.keys(this.data.daily).length,
      streak: st.streak, bestStreak: st.bestStreak,
      strokes: st.strokes, hints: st.hints, undos: st.undos, playMs: st.playMs,
    };
  }

  resetAll() {
    const settings = { ...this.data.settings };
    this.data = defaultSave();
    this.data.settings = settings;
    this.data.settings.bg = DEFAULT_BACKGROUND; // ilerleme silindi: kilitler de kapandı
    return this._save();
  }

  _finish(stars, improved, counters) {
    const st = this.data.stats;
    st.strokes += clampInt(counters.moves, 0, 1e6, 0);
    st.hints += clampInt(counters.hints, 0, 1e6, 0);
    st.undos += clampInt(counters.undos, 0, 1e6, 0) + clampInt(counters.resets, 0, 1e6, 0);
    const newAchievements = this._unlockAchievements();
    return { stars, improved, newAchievements, saved: this._save() };
  }

  _unlockAchievements() {
    const s = this.summary();
    const fresh = [];
    for (const a of ACHIEVEMENTS) {
      if (!this.data.achievements[a.id] && a.test(s)) { this.data.achievements[a.id] = this.now(); fresh.push(a.id); }
    }
    return fresh;
  }

  _save() { this.lastSaveOk = this.store.save(this.data); return this.lastSaveOk; }
}

// ---- src/render/viewport.js ----
// Seviye koordinatlarını (birimsiz) ekran pikseline oturtur. Saf fonksiyon.


/**
 * @returns {{scale:number, points:{id:number,x:number,y:number}[]}}
 */
function computeBoardLayout(nodes, width, height, { paddingPx, maxSpacingPx }, extraPoints = []) {
  let minX = Infinity; let minY = Infinity; let maxX = -Infinity; let maxY = -Infinity;
  for (const n of [...nodes, ...extraPoints]) {
    if (n.x < minX) minX = n.x; if (n.x > maxX) maxX = n.x;
    if (n.y < minY) minY = n.y; if (n.y > maxY) maxY = n.y;
  }
  const spanX = maxX - minX; const spanY = maxY - minY;
  const availW = Math.max(1, width - paddingPx * 2);
  const availH = Math.max(1, height - paddingPx * 2);
  let scale = Math.min(spanX > 0 ? availW / spanX : Infinity, spanY > 0 ? availH / spanY : Infinity);
  const spacing = minNodeSpacing(nodes);
  if (Number.isFinite(spacing) && spacing > 0) scale = Math.min(scale, maxSpacingPx / spacing);
  if (!Number.isFinite(scale) || scale <= 0) scale = 1;
  const offX = (width - spanX * scale) / 2 - minX * scale;
  const offY = (height - spanY * scale) / 2 - minY * scale;
  return { scale, offX, offY, points: nodes.map((n) => ({ id: n.id, x: n.x * scale + offX, y: n.y * scale + offY })) };
}

// ---- src/render/renderer.js ----
// Oyun tahtası çizimi (Canvas 2D). Yalnız bir şey değiştiğinde ya da animasyon sürerken kare çizer.






const NODE_RADIUS_RATIO = 0.4;
const NODE_RADIUS_MIN = 7;
const NODE_RADIUS_MAX = 13;
const EDGE_WIDTH_RATIO = 0.82;
const TAU = Math.PI * 2;

class BoardRenderer {
  /**
   * @param {HTMLCanvasElement} canvas
   * @param {object} env
   * @param {() => Record<string,string>} env.readColors  {edge,arrow,node,nodeDone,trail,danger,hint,bg}
   * @param {() => number} env.now
   * @param {(cb:Function) => void} env.schedule  requestAnimationFrame
   * @param {boolean} env.reducedMotion
   */
  constructor(canvas, env) {
    this.canvas = canvas;
    this.ctx = canvas.getContext('2d');
    this.env = env;
    this.graph = null;
    this.session = null;
    this.startNodes = null;
    this.points = [];
    this._pointById = new Map();
    this.paths = [];   // kenar index'ine göre ekran yolları (a→b)
    this.live = null;  // {partial} — giriş denetleyicisinin canlı durumu
    this.hitRadius = CONFIG.input.hitRadiusMaxPx;
    this.width = 0; this.height = 0; this.dpr = 1;
    this.pointer = null;
    this._scheduled = false;
    this._frame = this._frame.bind(this);
    this.frameCount = 0;
    this.refreshColors();
    this._resetFx();
  }

  refreshColors() {
    const c = this.env.readColors();
    this.colors = c;
    this.invalidate();
  }

  _resetFx() {
    this.fx = { edgeAt: new Map(), pulseAt: new Map(), shakeAt: new Map(), badEdge: null, winAt: null, hint: null };
  }

  setBoard(graph, session, startNodes) {
    this.graph = graph; this.session = session; this.startNodes = startNodes ? new Set(startNodes) : null;
    this.pointer = null;
    this._resetFx();
    this._layout();
    this.invalidate();
  }

  resize(width, height, dpr) {
    if (!(width > 0) || !(height > 0)) return;
    this.width = width; this.height = height; this.dpr = Math.max(1, Math.min(3, dpr || 1));
    this.canvas.width = Math.round(width * this.dpr);
    this.canvas.height = Math.round(height * this.dpr);
    this._layout();
    this.invalidate();
  }

  _layout() {
    if (!this.graph || !this.width) return;
    const extra = [];
    for (const e of this.graph.edges) for (const q of e.path) extra.push(q);
    const layout = computeBoardLayout(this.graph.nodes, this.width, this.height, {
      paddingPx: CONFIG.layout.boardPaddingPx, maxSpacingPx: CONFIG.layout.maxNodeSpacingPx,
    }, extra);
    this.points = layout.points;
    this.paths = this.graph.edges.map((e) => makePolyline(e.path.map((q) => ({ x: q.x * layout.scale + layout.offX, y: q.y * layout.scale + layout.offY }))));
    this._pointById = new Map(layout.points.map((p) => [p.id, p]));
    this.hitRadius = computeHitRadius(layout.points, {
      maxPx: CONFIG.input.hitRadiusMaxPx, minPx: CONFIG.input.hitRadiusMinPx, spacingRatio: CONFIG.input.hitRadiusSpacingRatio,
    });
    this.nodeRadius = Math.max(NODE_RADIUS_MIN, Math.min(NODE_RADIUS_MAX, this.hitRadius * NODE_RADIUS_RATIO));
    this.edgeWidth = this.nodeRadius * EDGE_WIDTH_RATIO;
  }

  // ---- oyun olayları ----
  notifyStart(nodeId) { this.fx.pulseAt.set(nodeId, this.env.now()); this.fx.hint = null; this.invalidate(); }
  notifyMove(edge, nodeId) { const t = this.env.now(); this.fx.edgeAt.set(edge.index, t); this.fx.pulseAt.set(nodeId, t); this.fx.hint = null; this.invalidate(); }
  /** Gerçek oyunda kenar zaten parmakla çizildi; yalnızca yeniden çizim ister. */
  notifyCommit() { this.fx.hint = null; this.invalidate(); }
  notifyInvalid(nodeId, edge) { const t = this.env.now(); this.fx.shakeAt.set(nodeId, t); this.fx.badEdge = edge ? { index: edge.index, at: t } : null; this.invalidate(); }
  notifyWin() { this.fx.winAt = this.env.now(); this.pointer = null; this.invalidate(); }
  notifyChange() { this.fx.hint = null; this.fx.edgeAt.clear(); this.invalidate(); }
  /** @param {{type:string,node?:number,from?:number,to?:number}} hint */
  showHint(hint) { this.fx.hint = { ...hint, at: this.env.now() }; this.invalidate(); }
  setPointer(p) { this.pointer = p; this.invalidate(); }

  invalidate() {
    if (this._scheduled) return;
    this._scheduled = true;
    this.env.schedule(this._frame);
  }

  _frame() {
    this._scheduled = false;
    this.frameCount++;
    if (this._draw(this.env.now())) this.invalidate();
  }

  _progress(startedAt, duration, now) {
    if (startedAt === undefined || startedAt === null) return 1;
    if (this.env.reducedMotion || duration <= 0) return 1;
    return Math.max(0, Math.min(1, (now - startedAt) / duration));
  }

  /** @returns {boolean} animasyon sürüyor mu */
  _draw(now) {
    const { ctx, graph, session, colors, fx } = this;
    ctx.setTransform(this.dpr, 0, 0, this.dpr, 0, 0);
    ctx.clearRect(0, 0, this.width, this.height);
    if (!graph || !session || !this.points.length || this.paths.length !== graph.edges.length) return false;
    let animating = false;
    const P = this._pointById;
    const partial = this.live && this.live.partial ? this.live.partial : null;
    ctx.lineCap = 'round'; ctx.lineJoin = 'round';

    // 1) Tüm kenarlar (zemin): soluk renk
    ctx.lineWidth = this.edgeWidth;
    ctx.strokeStyle = colors.edge;
    ctx.beginPath();
    for (const e of graph.edges) this._pathRange(this.paths[e.index], 0, this.paths[e.index].length);
    ctx.stroke();

    // 2) Hatalı kenar parlaması
    if (fx.badEdge) {
      const t = this._progress(fx.badEdge.at, CONFIG.anim.shakeMs, now);
      if (t < 1) {
        const poly = this.paths[fx.badEdge.index];
        ctx.globalAlpha = 1 - t; ctx.strokeStyle = colors.danger; ctx.lineWidth = this.edgeWidth * 1.5;
        ctx.beginPath(); this._pathRange(poly, 0, poly.length); ctx.stroke();
        ctx.globalAlpha = 1; animating = true;
      } else fx.badEdge = null;
    }

    // 3) Çizilen iz: parlak, tek renk. Geri sarılan son kenar kısalır; ilerleyen kenar parmakla birlikte uzar.
    let winT = 1;
    if (fx.winAt !== null) { winT = this._progress(fx.winAt, CONFIG.anim.winMs, now); if (winT < 1) animating = true; }
    const winSwell = fx.winAt !== null ? 1 + 0.45 * Math.sin(winT * Math.PI) : 1;
    ctx.strokeStyle = colors.trail;
    ctx.shadowColor = colors.trail; ctx.shadowBlur = this.edgeWidth * 1.1;
    ctx.lineWidth = this.edgeWidth * 1.25 * winSwell;
    ctx.beginPath();
    const lastIdx = session.trail.length - 1;
    for (let k = 0; k <= lastIdx; k++) {
      const edge = graph.edges[session.trail[k]]; const poly = this.paths[edge.index];
      let lo = 0; let hi = poly.length;
      if (fx.edgeAt.has(edge.index)) { // yalnız animasyonlu oynatmada (tanıtım): kenar kısa sürede çizilir
        const p = this._progress(fx.edgeAt.get(edge.index), CONFIG.anim.edgeDrawMs, now);
        if (p < 1) { animating = true; const reach = poly.length * p; if (edge.a === session.path[k]) hi = reach; else lo = poly.length - reach; } else fx.edgeAt.delete(edge.index);
      }
      if (partial && partial.back && k === lastIdx) {
        const keep = poly.length - partial.s; // geri sarılırken w düğümünden başlayarak kalan uzunluk
        if (edge.a === partial.to) { hi = keep; } else { lo = poly.length - keep; }
      }
      this._pathRange(poly, lo, hi);
    }
    if (partial && !partial.back) {
      const poly = this.paths[partial.edge.index];
      if (partial.edge.a === partial.from) this._pathRange(poly, 0, partial.s); else this._pathRange(poly, poly.length - partial.s, poly.length);
    }
    ctx.stroke();
    ctx.shadowBlur = 0;

    // 4) Tek yön okları
    for (const e of graph.edges) if (e.oneWay) this._arrow(this.paths[e.index], session.isEdgeUsed(e) ? colors.bg : colors.arrow);

    // 5) İpucu
    if (fx.hint) {
      const t = this._progress(fx.hint.at, CONFIG.anim.hintMs, now);
      const life = this.env.reducedMotion ? (now - fx.hint.at) / CONFIG.anim.hintMs : t;
      if (life < 1) {
        animating = true;
        ctx.strokeStyle = colors.hint; ctx.fillStyle = colors.hint;
        if (fx.hint.type === 'move') {
          const e = graph.edgeBetween(fx.hint.from, fx.hint.to);
          if (e) {
            const poly = this.paths[e.index];
            ctx.lineWidth = this.edgeWidth * 0.5;
            ctx.setLineDash([this.edgeWidth, this.edgeWidth * 1.2]);
            ctx.lineDashOffset = this.env.reducedMotion ? 0 : -now / 28;
            ctx.beginPath(); this._pathRange(poly, 0, poly.length); ctx.stroke();
            ctx.setLineDash([]);
          }
          this._ring(P.get(fx.hint.to), this.nodeRadius * 1.9, colors.hint, 3);
        } else if (fx.hint.type === 'start') {
          const wobble = this.env.reducedMotion ? 0 : Math.sin(now / 160) * 2;
          this._ring(P.get(fx.hint.node), this.nodeRadius * 2 + wobble, colors.hint, 3);
        }
      } else fx.hint = null;
    }

    // 6) Başlangıç halkaları (çizim başlamadan önce)
    if (session.state === SessionState.IDLE && this.startNodes) {
      for (const id of this.startNodes) this._ring(P.get(id), this.nodeRadius * 1.75, colors.trail, 2.5);
    }

    // 7) Nokta (çizginin ucu): parmağı izleyen gri/beyaz daire
    if (session.path.length > 0) {
      const dot = this._dotPosition(session, partial);
      if (dot) {
        const deadEnd = session.isDeadEnd;
        ctx.beginPath(); ctx.arc(dot.x, dot.y, this.edgeWidth * 0.62, 0, TAU);
        ctx.fillStyle = colors.dot || '#d8d8e4'; ctx.fill();
        if (deadEnd) this._ring(dot, this.edgeWidth * 1.3, colors.danger, 3);
      }
    }
    return animating;
  }

  _dotPosition(session, partial) {
    if (partial) {
      const poly = this.paths[partial.edge.index];
      let d;
      if (partial.back) d = partial.edge.a === partial.to ? poly.length - partial.s : partial.s; // w→u yönünde kalan uzunluk
      else d = partial.edge.a === partial.from ? partial.s : poly.length - partial.s;
      return polylinePointAt(poly, d);
    }
    return this._pointById.get(session.current) || null;
  }

  _ring(c, radius, color, width) {
    const { ctx } = this;
    ctx.beginPath(); ctx.arc(c.x, c.y, radius, 0, TAU);
    ctx.lineWidth = width; ctx.strokeStyle = color; ctx.stroke();
  }

  /** Yolun [from,to] yay aralığını geçerli çizime ekler (a→b yay uzunluğu). */
  _pathRange(poly, from, to) {
    const pts = polylineSlice(poly, from, to);
    this.ctx.moveTo(pts[0].x, pts[0].y);
    for (let i = 1; i < pts.length; i++) this.ctx.lineTo(pts[i].x, pts[i].y);
  }

  /** Tek yönlü kenarın ortasında a→b yönünü gösteren iki çentik. */
  _arrow(poly, color) {
    const { ctx } = this;
    if (poly.length < 1) return;
    const size = this.edgeWidth * 0.62;
    ctx.strokeStyle = color; ctx.lineWidth = Math.max(1.6, this.edgeWidth * 0.26);
    for (const offset of [-size * 0.9, size * 0.9]) {
      const p = polylinePointAt(poly, poly.length / 2 + offset);
      const ux = p.tx; const uy = p.ty;
      ctx.beginPath();
      ctx.moveTo(p.x - ux * size * 0.5 - uy * size * 0.6, p.y - uy * size * 0.5 + ux * size * 0.6);
      ctx.lineTo(p.x + ux * size * 0.5, p.y + uy * size * 0.5);
      ctx.lineTo(p.x - ux * size * 0.5 + uy * size * 0.6, p.y - uy * size * 0.5 - ux * size * 0.6);
      ctx.stroke();
    }
  }
}

// ---- src/audio/audio.js ----
// Ses: tamamı Web Audio ile kodla sentezlenir; hiçbir ses dosyası kullanılmaz.
// Her hamlede nota pentatonik dizide bir basamak yükselir: çizgi uzadıkça melodi tırmanır.
const PENTATONIC_SEMITONES = [0, 2, 4, 7, 9];
const BASE_FREQUENCY_HZ = 261.63;
const MAX_STEP = 19;
const MASTER_GAIN = 0.16;

function stepFrequency(step) {
  const s = Math.max(0, Math.min(MAX_STEP, step));
  const semis = PENTATONIC_SEMITONES[s % PENTATONIC_SEMITONES.length] + 12 * Math.floor(s / PENTATONIC_SEMITONES.length);
  return BASE_FREQUENCY_HZ * 2 ** (semis / 12);
}

class GameAudio {
  /** @param {() => boolean} isEnabled  @param {() => (AudioContext|null)} createContext */
  constructor(isEnabled, createContext) {
    this.isEnabled = isEnabled;
    this.createContext = createContext;
    this.ctx = null;
    this.master = null;
    this.failed = false;
  }

  /** Kullanıcı dokunuşu içinde çağrılmalı (tarayıcı kuralı). */
  unlock() {
    if (this.failed || !this.isEnabled()) return;
    try {
      if (!this.ctx) {
        this.ctx = this.createContext();
        if (!this.ctx) { this.failed = true; return; }
        this.master = this.ctx.createGain();
        this.master.gain.value = MASTER_GAIN;
        this.master.connect(this.ctx.destination);
      }
      if (this.ctx.state === 'suspended') this.ctx.resume().catch(() => {});
    } catch (err) { this.failed = true; }
  }

  suspend() { if (this.ctx && this.ctx.state === 'running') this.ctx.suspend().catch(() => {}); }

  _tone(freq, startOffset, duration, type, peak) {
    if (!this.ctx || !this.isEnabled() || this.ctx.state !== 'running') return;
    try {
      const t0 = this.ctx.currentTime + startOffset;
      const osc = this.ctx.createOscillator();
      const gain = this.ctx.createGain();
      osc.type = type;
      osc.frequency.setValueAtTime(freq, t0);
      gain.gain.setValueAtTime(0.0001, t0);
      gain.gain.exponentialRampToValueAtTime(peak, t0 + 0.012);
      gain.gain.exponentialRampToValueAtTime(0.0001, t0 + duration);
      osc.connect(gain); gain.connect(this.master);
      osc.start(t0); osc.stop(t0 + duration + 0.02);
    } catch (err) { /* ses hatası oyunu durdurmaz */ }
  }

  select(step) { this._tone(stepFrequency(step), 0, 0.22, 'triangle', 1); }
  undo() { this._tone(196, 0, 0.12, 'sine', 0.7); }
  // Hata ("yandın"): keskin, alçalan iki vuruş — "dat-dat". Doğru hamle sesinden belirgin biçimde ayrışır.
  invalid() { this._tone(240, 0, 0.07, 'sawtooth', 0.55); this._tone(120, 0.075, 0.2, 'sawtooth', 0.55); }
  // Yanma: çizim yarıda bırakıldı — hızla alçalan cızırtılı süpürme.
  burn() { this._tone(420, 0, 0.1, 'sawtooth', 0.5); this._tone(210, 0.09, 0.12, 'sawtooth', 0.5); this._tone(90, 0.2, 0.3, 'square', 0.45); }
  // Çıkmaz: tek, daha uzun ve alçak "dat".
  deadend() { this._tone(160, 0, 0.09, 'sawtooth', 0.5); this._tone(80, 0.09, 0.3, 'square', 0.4); }
  tap() { this._tone(660, 0, 0.06, 'sine', 0.5); }
  win() { [0, 2, 4, 5, 7].forEach((step, i) => this._tone(stepFrequency(step + 5), i * 0.085, 0.4, 'triangle', 0.9)); }
}
