const BY_ID = new Map(BACKGROUNDS.map((b) => [b.id, b]));

function isBackgroundId(id) { return typeof id === 'string' && BY_ID.has(id); }
function getBackground(id) { return BY_ID.get(id) || BY_ID.get(DEFAULT_BACKGROUND); }
function isBackgroundUnlocked(background, solvedCount) { return solvedCount >= background.unlockAt; }

/** Seçili zemin geçersiz ya da kilitliyse varsayılan siyaha düşer. */
function resolveBackground(id, solvedCount) {
  const chosen = BY_ID.get(id);
  return chosen && isBackgroundUnlocked(chosen, solvedCount) ? chosen : getBackground(DEFAULT_BACKGROUND);
}

/** Çözülen sayısı `before`'dan `after`'a çıkarken açılan zeminler. */
function newlyUnlocked(before, after) {
  return BACKGROUNDS.filter((b) => b.unlockAt > before && b.unlockAt <= after);
}

function isLineChoice(id) { return id === AUTO_LINE || (typeof id === 'string' && LINE_BY_ID.has(id)); }

/** Zemin ve seçilen çizgi renginden gerçek iz rengi (hex). Geçersiz seçim zeminin kendi rengine düşer. */

// ---- src/progress/progress.js ----
// Oyuncu ilerlemesi: tamamlanan bölümler, yıldızlar, ayarlar, istatistikler, günlük seri, başarımlar.





const MAX_STARS = CONFIG.rules.maxStars;
const MAX_DAILY_HISTORY = 400;
const KNOWN_TIPS = ['oneWay'];

function defaultSave() {
  return {
    v: CONFIG.save.version,
    levels: {},   // id -> { stars }
    daily: {},    // dateKey -> { stars }
    settings: { sound: true, haptics: true, lang: CONFIG.i18n.auto, bg: DEFAULT_BACKGROUND, line: AUTO_LINE },
    stats: { strokes: 0, hints: 0, undos: 0, playMs: 0, streak: 0, bestStreak: 0, lastDaily: null },
    tips: {},     // öğretici ipucu adı -> true (bir kez gösterildi)
    achievements: {}, // id -> zaman damgası
  };
}

function clampInt(v, min, max, fallback) {
  return Number.isFinite(v) ? Math.max(min, Math.min(max, Math.floor(v))) : fallback;
}
function starValue(v) { return Number.isFinite(v) && v >= 1 ? Math.min(MAX_STARS, Math.floor(v)) : 0; }
function isValidLang(v) { return v === CONFIG.i18n.auto || CONFIG.i18n.languages.includes(v); }
function isPlainObject(o) { return o !== null && typeof o === 'object' && !Array.isArray(o); }

/** Her türlü girdiyi geçerli kayda çevirir. Tanınmayan sürüm ya da nesne olmayan veri hata fırlatır. */
function sanitizeSave(raw) {
  if (!isPlainObject(raw)) throw new Error('kayıt nesne değil');
  if (raw.v !== CONFIG.save.version) throw new Error(`desteklenmeyen kayıt sürümü: ${raw.v}`);
  const out = defaultSave();
  if (isPlainObject(raw.levels)) {
    for (const [id, rec] of Object.entries(raw.levels)) {
      if (typeof id === 'string' && id.length <= 32 && isPlainObject(rec)) {
        const stars = starValue(rec.stars);
        if (stars) out.levels[id] = { stars };
      }
    }
  }
  if (isPlainObject(raw.daily)) {
    for (const key of Object.keys(raw.daily).filter(isDateKey).sort().slice(-MAX_DAILY_HISTORY)) {
      const rec = raw.daily[key];
      const stars = isPlainObject(rec) ? starValue(rec.stars) : 0;
      if (stars) out.daily[key] = { stars };
    }
  }
  if (isPlainObject(raw.settings)) {
    for (const k of Object.keys(out.settings)) if (k !== 'lang' && k !== 'bg' && k !== 'line' && typeof raw.settings[k] === 'boolean') out.settings[k] = raw.settings[k];
    if (isBackgroundId(raw.settings.bg)) out.settings.bg = raw.settings.bg;
    if (isLineChoice(raw.settings.line)) out.settings.line = raw.settings.line;
    if (isValidLang(raw.settings.lang)) out.settings.lang = raw.settings.lang;
  }
  if (isPlainObject(raw.stats)) {
    const s = raw.stats;
    for (const k of ['strokes', 'hints', 'undos', 'playMs', 'streak', 'bestStreak']) out.stats[k] = clampInt(s[k], 0, Number.MAX_SAFE_INTEGER, 0);
    out.stats.lastDaily = isDateKey(s.lastDaily) ? s.lastDaily : null;
    if (out.stats.bestStreak < out.stats.streak) out.stats.bestStreak = out.stats.streak;
  }
  if (isPlainObject(raw.tips)) {
    for (const k of KNOWN_TIPS) if (raw.tips[k] === true) out.tips[k] = true;
  }
  if (isPlainObject(raw.achievements)) {
    const known = new Set(ACHIEVEMENTS.map((a) => a.id));
    for (const [id, ts] of Object.entries(raw.achievements)) if (known.has(id) && Number.isFinite(ts)) out.achievements[id] = ts;
  }
  return out;
}

/** Yıldız: 3'ten başlar; geri alma/yeniden başlatma −1, ipucu −1; en az 1. */
function computeStars({ undos = 0, resets = 0, hints = 0 }) {
  let stars = MAX_STARS;
  if (undos + resets > 0) stars--;
  if (hints > 0) stars--;
  return Math.max(1, stars);
}

class Progress {
  /**
   * @param {import('./storage.js').SafeStore} store
   * @param {import('../levels/catalog.js').LevelCatalog} catalog
   * @param {() => number} [now]
   */
  constructor(store, catalog, now = () => Date.now()) {
    this.store = store;
    this.catalog = catalog;
    this.now = now;
    this.data = store.load(defaultSave);
    this.lastSaveOk = true;
  }

  get settings() { return this.data.settings; }
  hasSeenTip(name) { return this.data.tips[name] === true; }
  markTipSeen(name) {
    if (!KNOWN_TIPS.includes(name) || this.data.tips[name]) return false;
    this.data.tips[name] = true;
    return this._save();
  }
  setSetting(name, value) {
    if (!(name in this.data.settings)) return false;
    if (name === 'bg') {
      // Kilitli zemin seçilemez; kilit çözülen bölüm sayısından hesaplanır.
      if (!isBackgroundId(value) || !isBackgroundUnlocked(getBackground(value), this.solvedCount())) return false;
    } else if (name === 'line') {
      if (!isLineChoice(value)) return false;
    } else if (name === 'lang' ? !isValidLang(value) : typeof value !== 'boolean') return false;
    this.data.settings[name] = value;
    return this._save();
  }

  /** Çözülmüş (en az 1 yıldızlı) bölüm sayısı. Günlük bulmacalar sayılmaz. */
  solvedCount() {
    let n = 0;
    for (const level of this.catalog.levels) if (this.starsFor(level.id) > 0) n++;
    return n;
  }

  starsFor(levelId) { const r = this.data.levels[levelId]; return r ? r.stars : 0; }
  isCompleted(levelId) { return this.starsFor(levelId) > 0; }

  /** Kilit: tamamlanmamış ilk N bölüm açık; tamamlananlar her zaman açık. */
  isUnlocked(index) {
    if (!this.catalog.has(index)) return false;
    if (this.isCompleted(this.catalog.data(index).id)) return true;
    let open = 0;
    for (let i = 0; i < index; i++) {
      if (!this.isCompleted(this.catalog.data(i).id)) { open++; if (open >= CONFIG.rules.unlockWindow) return false; }
    }
    return true;
  }

  /** Oynanacak sıradaki bölüm: tamamlanmamış ilk bölüm; hepsi bittiyse son bölüm. */
  nextLevelIndex() {
    for (let i = 0; i < this.catalog.count; i++) if (!this.isCompleted(this.catalog.data(i).id)) return i;
    return Math.max(0, this.catalog.count - 1);
  }

  /** @returns {{stars:number,improved:boolean,newAchievements:string[],newBackgrounds:string[],saved:boolean}} */
  recordLevel(levelId, counters) {
    const stars = computeStars(counters);
    const prev = this.starsFor(levelId);
    const solvedBefore = this.solvedCount();
    if (stars > prev) this.data.levels[levelId] = { stars };
    const result = this._finish(stars, stars > prev, counters);
    result.newBackgrounds = newlyUnlocked(solvedBefore, this.solvedCount()).map((b) => b.id);
    return result;
  }

  recordDaily(key, counters) {
    if (!isDateKey(key)) throw new Error(`Geçersiz tarih anahtarı: ${key}`);
    const stars = computeStars(counters);
    const prev = this.data.daily[key] ? this.data.daily[key].stars : 0;
    if (!prev) {
      const st = this.data.stats;
      st.streak = st.lastDaily === previousDateKey(key) ? st.streak + 1 : 1;
      if (st.lastDaily === null || key > st.lastDaily) st.lastDaily = key;
      st.bestStreak = Math.max(st.bestStreak, st.streak);
    }
    if (stars > prev) this.data.daily[key] = { stars };
    const result = this._finish(stars, stars > prev, counters);
    result.newBackgrounds = [];
    return result;
  }

  dailyStars(key) { return this.data.daily[key] ? this.data.daily[key].stars : 0; }

  /** Bugün itibarıyla geçerli seri (dün ya da bugün çözülmediyse 0). */
  currentStreak(todayKey) {
    const last = this.data.stats.lastDaily;
    return last === todayKey || last === previousDateKey(todayKey) ? this.data.stats.streak : 0;
  }

  addPlayTime(ms) {
    if (Number.isFinite(ms) && ms > 0) { this.data.stats.playMs += Math.floor(ms); this._save(); }
  }

  summary() {
    let solved = 0; let perfect = 0; let stars = 0;
    const tierTotal = {}; const tierSolved = {};
    for (const level of this.catalog.levels) {
      tierTotal[level.tier] = (tierTotal[level.tier] || 0) + 1;
      const s = this.starsFor(level.id);
      if (s) { solved++; stars += s; tierSolved[level.tier] = (tierSolved[level.tier] || 0) + 1; if (s === MAX_STARS) perfect++; }
    }
    const tierDone = {};
    for (const t of Object.keys(tierTotal)) tierDone[t] = (tierSolved[t] || 0) === tierTotal[t];
    const st = this.data.stats;
    return {
      total: this.catalog.count, solved, perfect, stars, maxStars: this.catalog.count * MAX_STARS,
      tierTotal, tierSolved, tierDone,
      dailySolved: Object.keys(this.data.daily).length,
      streak: st.streak, bestStreak: st.bestStreak,
      strokes: st.strokes, hints: st.hints, undos: st.undos, playMs: st.playMs,
    };
  }

  resetAll() {
    const settings = { ...this.data.settings };
    this.data = defaultSave();
    this.data.settings = settings;
    this.data.settings.bg = DEFAULT_BACKGROUND; // ilerleme silindi: kilitler de kapandı
    return this._save();
  }

  _finish(stars, improved, counters) {
    const st = this.data.stats;
    st.strokes += clampInt(counters.moves, 0, 1e6, 0);
    st.hints += clampInt(counters.hints, 0, 1e6, 0);
    st.undos += clampInt(counters.undos, 0, 1e6, 0) + clampInt(counters.resets, 0, 1e6, 0);
    const newAchievements = this._unlockAchievements();
    return { stars, improved, newAchievements, saved: this._save() };
  }

  _unlockAchievements() {
    const s = this.summary();
    const fresh = [];
    for (const a of ACHIEVEMENTS) {
      if (!this.data.achievements[a.id] && a.test(s)) { this.data.achievements[a.id] = this.now(); fresh.push(a.id); }
    }
    return fresh;
  }

  _save() { this.lastSaveOk = this.store.save(this.data); return this.lastSaveOk; }
}

// ---- src/render/viewport.js ----
// Seviye koordinatlarını (birimsiz) ekran pikseline oturtur. Saf fonksiyon.


/**
 * @returns {{scale:number, points:{id:number,x:number,y:number}[]}}
 */
function computeBoardLayout(nodes, width, height, { paddingPx, maxSpacingPx }, extraPoints = []) {
  let minX = Infinity; let minY = Infinity; let maxX = -Infinity; let maxY = -Infinity;
  for (const n of [...nodes, ...extraPoints]) {
    if (n.x < minX) minX = n.x; if (n.x > maxX) maxX = n.x;
    if (n.y < minY) minY = n.y; if (n.y > maxY) maxY = n.y;
  }
  const spanX = maxX - minX; const spanY = maxY - minY;
  const availW = Math.max(1, width - paddingPx * 2);
  const availH = Math.max(1, height - paddingPx * 2);
  let scale = Math.min(spanX > 0 ? availW / spanX : Infinity, spanY > 0 ? availH / spanY : Infinity);
  const spacing = minNodeSpacing(nodes);
  if (Number.isFinite(spacing) && spacing > 0) scale = Math.min(scale, maxSpacingPx / spacing);
  if (!Number.isFinite(scale) || scale <= 0) scale = 1;
  const offX = (width - spanX * scale) / 2 - minX * scale;
  const offY = (height - spanY * scale) / 2 - minY * scale;
  return { scale, offX, offY, points: nodes.map((n) => ({ id: n.id, x: n.x * scale + offX, y: n.y * scale + offY })) };
}

// ---- src/render/renderer.js ----
// Oyun tahtası çizimi (Canvas 2D). Yalnız bir şey değiştiğinde ya da animasyon sürerken kare çizer.






const NODE_RADIUS_RATIO = 0.4;
const NODE_RADIUS_MIN = 7;
const NODE_RADIUS_MAX = 13;
const EDGE_WIDTH_RATIO = 0.82;
const TAU = Math.PI * 2;

class BoardRenderer {
  /**
   * @param {HTMLCanvasElement} canvas
   * @param {object} env
   * @param {() => Record<string,string>} env.readColors  {edge,arrow,node,nodeDone,trail,danger,hint,bg}
   * @param {() => number} env.now
   * @param {(cb:Function) => void} env.schedule  requestAnimationFrame
   * @param {boolean} env.reducedMotion
   */
  constructor(canvas, env) {
    this.canvas = canvas;
    this.ctx = canvas.getContext('2d');
    this.env = env;
    this.graph = null;
    this.session = null;
    this.startNodes = null;
    this.points = [];
    this._pointById = new Map();
    this.paths = [];   // kenar index'ine göre ekran yolları (a→b)
    this.live = null;  // {partial} — giriş denetleyicisinin canlı durumu
    this.hitRadius = CONFIG.input.hitRadiusMaxPx;
    this.width = 0; this.height = 0; this.dpr = 1;
    this.pointer = null;
    this._scheduled = false;
    this._frame = this._frame.bind(this);
    this.frameCount = 0;
    this.refreshColors();
    this._resetFx();
  }

  refreshColors() {
    const c = this.env.readColors();
    this.colors = c;
    this.invalidate();
  }

  _resetFx() {
    this.fx = { edgeAt: new Map(), pulseAt: new Map(), shakeAt: new Map(), badEdge: null, winAt: null, hint: null };
  }

  setBoard(graph, session, startNodes) {
    this.graph = graph; this.session = session; this.startNodes = startNodes ? new Set(startNodes) : null;
    this.pointer = null;
    this._resetFx();
    this._layout();
    this.invalidate();
  }

  resize(width, height, dpr) {
    if (!(width > 0) || !(height > 0)) return;
    this.width = width; this.height = height; this.dpr = Math.max(1, Math.min(3, dpr || 1));
    this.canvas.width = Math.round(width * this.dpr);
    this.canvas.height = Math.round(height * this.dpr);
    this._layout();
    this.invalidate();
  }

  _layout() {
    if (!this.graph || !this.width) return;
    const extra = [];
    for (const e of this.graph.edges) for (const q of e.path) extra.push(q);
    const layout = computeBoardLayout(this.graph.nodes, this.width, this.height, {
      paddingPx: CONFIG.layout.boardPaddingPx, maxSpacingPx: CONFIG.layout.maxNodeSpacingPx,
    }, extra);
    this.points = layout.points;
    this.paths = this.graph.edges.map((e) => makePolyline(e.path.map((q) => ({ x: q.x * layout.scale + layout.offX, y: q.y * layout.scale + layout.offY }))));
    this._pointById = new Map(layout.points.map((p) => [p.id, p]));
    this.hitRadius = computeHitRadius(layout.points, {
      maxPx: CONFIG.input.hitRadiusMaxPx, minPx: CONFIG.input.hitRadiusMinPx, spacingRatio: CONFIG.input.hitRadiusSpacingRatio,
    });
    this.nodeRadius = Math.max(NODE_RADIUS_MIN, Math.min(NODE_RADIUS_MAX, this.hitRadius * NODE_RADIUS_RATIO));
    this.edgeWidth = this.nodeRadius * EDGE_WIDTH_RATIO;
  }

  // ---- oyun olayları ----
  notifyStart(nodeId) { this.fx.pulseAt.set(nodeId, this.env.now()); this.fx.hint = null; this.invalidate(); }
  notifyMove(edge, nodeId) { const t = this.env.now(); this.fx.edgeAt.set(edge.index, t); this.fx.pulseAt.set(nodeId, t); this.fx.hint = null; this.invalidate(); }
  /** Gerçek oyunda kenar zaten parmakla çizildi; yalnızca yeniden çizim ister. */
  notifyCommit() { this.fx.hint = null; this.invalidate(); }
  notifyInvalid(nodeId, edge) { const t = this.env.now(); this.fx.shakeAt.set(nodeId, t); this.fx.badEdge = edge ? { index: edge.index, at: t } : null; this.invalidate(); }
  notifyWin() { this.fx.winAt = this.env.now(); this.pointer = null; this.invalidate(); }
  notifyChange() { this.fx.hint = null; this.fx.edgeAt.clear(); this.invalidate(); }
  /** @param {{type:string,node?:number,from?:number,to?:number}} hint */
  showHint(hint) { this.fx.hint = { ...hint, at: this.env.now() }; this.invalidate(); }
  setPointer(p) { this.pointer = p; this.invalidate(); }

  invalidate() {
    if (this._scheduled) return;
    this._scheduled = true;
    this.env.schedule(this._frame);
  }

  _frame() {
    this._scheduled = false;
    this.frameCount++;
    if (this._draw(this.env.now())) this.invalidate();
  }

  _progress(startedAt, duration, now) {
    if (startedAt === undefined || startedAt === null) return 1;
    if (this.env.reducedMotion || duration <= 0) return 1;
    return Math.max(0, Math.min(1, (now - startedAt) / duration));
  }

  /** @returns {boolean} animasyon sürüyor mu */
  _draw(now) {
    const { ctx, graph, session, colors, fx } = this;
    ctx.setTransform(this.dpr, 0, 0, this.dpr, 0, 0);
    ctx.clearRect(0, 0, this.width, this.height);
    if (!graph || !session || !this.points.length || this.paths.length !== graph.edges.length) return false;
    let animating = false;
    const P = this._pointById;
    const partial = this.live && this.live.partial ? this.live.partial : null;
    ctx.lineCap = 'round'; ctx.lineJoin = 'round';

    // 1) Tüm kenarlar (zemin): soluk renk
    ctx.lineWidth = this.edgeWidth;
    ctx.strokeStyle = colors.edge;
    ctx.beginPath();
    for (const e of graph.edges) this._pathRange(this.paths[e.index], 0, this.paths[e.index].length);
    ctx.stroke();

    // 2) Hatalı kenar parlaması
    if (fx.badEdge) {
      const t = this._progress(fx.badEdge.at, CONFIG.anim.shakeMs, now);
      if (t < 1) {
        const poly = this.paths[fx.badEdge.index];
        ctx.globalAlpha = 1 - t; ctx.strokeStyle = colors.danger; ctx.lineWidth = this.edgeWidth * 1.5;
        ctx.beginPath(); this._pathRange(poly, 0, poly.length); ctx.stroke();
        ctx.globalAlpha = 1; animating = true;
      } else fx.badEdge = null;
    }

    // 3) Çizilen iz: parlak, tek renk. Geri sarılan son kenar kısalır; ilerleyen kenar parmakla birlikte uzar.
    let winT = 1;
    if (fx.winAt !== null) { winT = this._progress(fx.winAt, CONFIG.anim.winMs, now); if (winT < 1) animating = true; }
    const winSwell = fx.winAt !== null ? 1 + 0.45 * Math.sin(winT * Math.PI) : 1;
    ctx.strokeStyle = colors.trail;
    ctx.shadowColor = colors.trail; ctx.shadowBlur = this.edgeWidth * 1.1;
    ctx.lineWidth = this.edgeWidth * 1.25 * winSwell;
    ctx.beginPath();
    const lastIdx = session.trail.length - 1;
    for (let k = 0; k <= lastIdx; k++) {
      const edge = graph.edges[session.trail[k]]; const poly = this.paths[edge.index];
      let lo = 0; let hi = poly.length;
      if (fx.edgeAt.has(edge.index)) { // yalnız animasyonlu oynatmada (tanıtım): kenar kısa sürede çizilir
        const p = this._progress(fx.edgeAt.get(edge.index), CONFIG.anim.edgeDrawMs, now);
        if (p < 1) { animating = true; const reach = poly.length * p; if (edge.a === session.path[k]) hi = reach; else lo = poly.length - reach; } else fx.edgeAt.delete(edge.index);
      }
      if (partial && partial.back && k === lastIdx) {
        const keep = poly.length - partial.s; // geri sarılırken w düğümünden başlayarak kalan uzunluk
        if (edge.a === partial.to) { hi = keep; } else { lo = poly.length - keep; }
      }
      this._pathRange(poly, lo, hi);
    }
    if (partial && !partial.back) {
      const poly = this.paths[partial.edge.index];
      if (partial.edge.a === partial.from) this._pathRange(poly, 0, partial.s); else this._pathRange(poly, poly.length - partial.s, poly.length);
    }
    ctx.stroke();
    ctx.shadowBlur = 0;

    // 4) Tek yön okları
    for (const e of graph.edges) if (e.oneWay) this._arrow(this.paths[e.index], session.isEdgeUsed(e) ? colors.bg : colors.arrow);

    // 5) İpucu
    if (fx.hint) {
      const t = this._progress(fx.hint.at, CONFIG.anim.hintMs, now);
      const life = this.env.reducedMotion ? (now - fx.hint.at) / CONFIG.anim.hintMs : t;
      if (life < 1) {
        animating = true;
        ctx.strokeStyle = colors.hint; ctx.fillStyle = colors.hint;
        if (fx.hint.type === 'move') {
          const e = graph.edgeBetween(fx.hint.from, fx.hint.to);
          if (e) {
            const poly = this.paths[e.index];
            ctx.lineWidth = this.edgeWidth * 0.5;
            ctx.setLineDash([this.edgeWidth, this.edgeWidth * 1.2]);
            ctx.lineDashOffset = this.env.reducedMotion ? 0 : -now / 28;
            ctx.beginPath(); this._pathRange(poly, 0, poly.length); ctx.stroke();
            ctx.setLineDash([]);
          }
          this._ring(P.get(fx.hint.to), this.nodeRadius * 1.9, colors.hint, 3);
        } else if (fx.hint.type === 'start') {
          const wobble = this.env.reducedMotion ? 0 : Math.sin(now / 160) * 2;
          this._ring(P.get(fx.hint.node), this.nodeRadius * 2 + wobble, colors.hint, 3);
        }
      } else fx.hint = null;
    }

    // 6) Başlangıç halkaları (çizim başlamadan önce)
    if (session.state === SessionState.IDLE && this.startNodes) {
      for (const id of this.startNodes) this._ring(P.get(id), this.nodeRadius * 1.75, colors.trail, 2.5);
    }

    // 7) Nokta (çizginin ucu): parmağı izleyen gri/beyaz daire
    if (session.path.length > 0) {
      const dot = this._dotPosition(session, partial);
      if (dot) {
        const deadEnd = session.isDeadEnd;
        ctx.beginPath(); ctx.arc(dot.x, dot.y, this.edgeWidth * 0.62, 0, TAU);
        ctx.fillStyle = colors.dot || '#d8d8e4'; ctx.fill();
        if (deadEnd) this._ring(dot, this.edgeWidth * 1.3, colors.danger, 3);
      }
    }
    return animating;
  }

  _dotPosition(session, partial) {
    if (partial) {
      const poly = this.paths[partial.edge.index];
      let d;
      if (partial.back) d = partial.edge.a === partial.to ? poly.length - partial.s : partial.s; // w→u yönünde kalan uzunluk
      else d = partial.edge.a === partial.from ? partial.s : poly.length - partial.s;
      return polylinePointAt(poly, d);
    }
    return this._pointById.get(session.current) || null;
  }

  _ring(c, radius, color, width) {
    const { ctx } = this;
    ctx.beginPath(); ctx.arc(c.x, c.y, radius, 0, TAU);
    ctx.lineWidth = width; ctx.strokeStyle = color; ctx.stroke();
  }

  /** Yolun [from,to] yay aralığını geçerli çizime ekler (a→b yay uzunluğu). */
  _pathRange(poly, from, to) {
    const pts = polylineSlice(poly, from, to);
    this.ctx.moveTo(pts[0].x, pts[0].y);
    for (let i = 1; i < pts.length; i++) this.ctx.lineTo(pts[i].x, pts[i].y);
  }

  /** Tek yönlü kenarın ortasında a→b yönünü gösteren iki çentik. */
  _arrow(poly, color) {
    const { ctx } = this;
    if (poly.length < 1) return;
    const size = this.edgeWidth * 0.62;
    ctx.strokeStyle = color; ctx.lineWidth = Math.max(1.6, this.edgeWidth * 0.26);
    for (const offset of [-size * 0.9, size * 0.9]) {
      const p = polylinePointAt(poly, poly.length / 2 + offset);
      const ux = p.tx; const uy = p.ty;
      ctx.beginPath();
      ctx.moveTo(p.x - ux * size * 0.5 - uy * size * 0.6, p.y - uy * size * 0.5 + ux * size * 0.6);
      ctx.lineTo(p.x + ux * size * 0.5, p.y + uy * size * 0.5);
      ctx.lineTo(p.x - ux * size * 0.5 + uy * size * 0.6, p.y - uy * size * 0.5 - ux * size * 0.6);
      ctx.stroke();
    }
  }
}

// ---- src/audio/audio.js ----
// Ses: tamamı Web Audio ile kodla sentezlenir; hiçbir ses dosyası kullanılmaz.
// Her hamlede nota pentatonik dizide bir basamak yükselir: çizgi uzadıkça melodi tırmanır.
const PENTATONIC_SEMITONES = [0, 2, 4, 7, 9];
const BASE_FREQUENCY_HZ = 261.63;
const MAX_STEP = 19;
const MASTER_GAIN = 0.16;

function stepFrequency(step) {
  const s = Math.max(0, Math.min(MAX_STEP, step));
  const semis = PENTATONIC_SEMITONES[s % PENTATONIC_SEMITONES.length] + 12 * Math.floor(s / PENTATONIC_SEMITONES.length);
  return BASE_FREQUENCY_HZ * 2 ** (semis / 12);
}

class GameAudio {
  /** @param {() => boolean} isEnabled  @param {() => (AudioContext|null)} createContext */
  constructor(isEnabled, createContext) {
    this.isEnabled = isEnabled;
    this.createContext = createContext;
    this.ctx = null;
    this.master = null;
    this.failed = false;
  }

  /** Kullanıcı dokunuşu içinde çağrılmalı (tarayıcı kuralı). */
  unlock() {
    if (this.failed || !this.isEnabled()) return;
    try {
      if (!this.ctx) {
        this.ctx = this.createContext();
        if (!this.ctx) { this.failed = true; return; }
        this.master = this.ctx.createGain();
        this.master.gain.value = MASTER_GAIN;
        this.master.connect(this.ctx.destination);
      }
      if (this.ctx.state === 'suspended') this.ctx.resume().catch(() => {});
    } catch (err) { this.failed = true; }
  }

  suspend() { if (this.ctx && this.ctx.state === 'running') this.ctx.suspend().catch(() => {}); }

  _tone(freq, startOffset, duration, type, peak) {
    if (!this.ctx || !this.isEnabled() || this.ctx.state !== 'running') return;
    try {
      const t0 = this.ctx.currentTime + startOffset;
      const osc = this.ctx.createOscillator();
      const gain = this.ctx.createGain();
      osc.type = type;
      osc.frequency.setValueAtTime(freq, t0);
      gain.gain.setValueAtTime(0.0001, t0);
      gain.gain.exponentialRampToValueAtTime(peak, t0 + 0.012);
      gain.gain.exponentialRampToValueAtTime(0.0001, t0 + duration);
      osc.connect(gain); gain.connect(this.master);
      osc.start(t0); osc.stop(t0 + duration + 0.02);
    } catch (err) { /* ses hatası oyunu durdurmaz */ }
  }

  select(step) { this._tone(stepFrequency(step), 0, 0.22, 'triangle', 1); }
  undo() { this._tone(196, 0, 0.12, 'sine', 0.7); }
  // Hata ("yandın"): keskin, alçalan iki vuruş — "dat-dat". Doğru hamle sesinden belirgin biçimde ayrışır.
  invalid() { this._tone(240, 0, 0.07, 'sawtooth', 0.55); this._tone(120, 0.075, 0.2, 'sawtooth', 0.55); }
  // Yanma: çizim yarıda bırakıldı — hızla alçalan cızırtılı süpürme.
  burn() { this._tone(420, 0, 0.1, 'sawtooth', 0.5); this._tone(210, 0.09, 0.12, 'sawtooth', 0.5); this._tone(90, 0.2, 0.3, 'square', 0.45); }
  // Çıkmaz: tek, daha uzun ve alçak "dat".
  deadend() { this._tone(160, 0, 0.09, 'sawtooth', 0.5); this._tone(80, 0.09, 0.3, 'square', 0.4); }
  tap() { this._tone(660, 0, 0.06, 'sine', 0.5); }
  win() { [0, 2, 4, 5, 7].forEach((step, i) => this._tone(stepFrequency(step + 5), i * 0.085, 0.4, 'triangle', 0.9)); }
}

/** Anahtar eşlemeleri (veri kimliği → metin anahtarı). */
const TIER_KEYS = Object.freeze({ tutorial: 'tierTutorial', shapes: 'tierShapes', easy: 'tierEasy', normal: 'tierNormal', hard: 'tierHard', expert: 'tierExpert' });
const TIP_KEYS = Object.freeze({ 't-01': 'tip1', 't-02': 'tip2', 't-03': 'tip3', 't-04': 'tip4', 't-05': 'tip5', 't-06': 'tip6', 't-07': 'tip7', 't-08': 'tip8', 't-09': 'tip9' });
const REASON_KEYS = Object.freeze({ 'edge-used': 'statusEdgeUsed', 'wrong-direction': 'statusWrongDirection', 'wrong-start': 'statusWrongStart' });
const ACHIEVEMENT_KEYS = Object.freeze({
  'first-trail': 'aFirst', 'ten-trails': 'aTen', 'fifty-trails': 'aFifty', 'hundred-trails': 'aHundred', 'all-trails': 'aAll', 'clean-ten': 'aClean10', 'clean-fifty': 'aClean50',
  'tier-easy': 'aEasy', 'tier-normal': 'aNormal', 'tier-hard': 'aHard', 'tier-expert': 'aExpert', 'daily-first': 'aDaily', 'daily-streak-3': 'aStreak3', 'daily-streak-7': 'aStreak7',
});
/** Ayar 'auto' ise cihaz dillerinden desteklenen ilkini, yoksa İngilizceyi seçer. */
function resolveLanguage(setting, deviceLanguages = []) {
  if (CONFIG.i18n.languages.includes(setting)) return setting;
  for (const tag of deviceLanguages) {
    const code = String(tag || '').toLowerCase().split('-')[0];
    if (CONFIG.i18n.languages.includes(code)) return code;
  }
  return CONFIG.i18n.fallback;
}
/** @returns {(key:string, vars?:Record<string,string|number>) => string} */
function createTranslator(lang) {
  const table = LOCALES[lang] || LOCALES[CONFIG.i18n.fallback];
  const base = LOCALES[CONFIG.i18n.fallback];
  return (key, vars) => {
    let text = table[key];
    if (text === undefined) text = base[key];
    if (text === undefined) return key;
    return vars ? text.replace(/\{(\w+)\}/g, (m, name) => (vars[name] !== undefined ? String(vars[name]) : m)) : text;
  };
}

// ---- src/ui/app.js ----
// Uygulama bileşimi: ekranlar, yönlendirme ve oyun akışı. Kurallar core/, çizim render/ içindedir.















const APP_VERSION = '1.0.0';
const ROUTES = Object.freeze({ home: 'home', play: 'game', daily: 'game', awards: 'awards', prefs: 'prefs' });
const SCREENS = ['home', 'game', 'awards', 'prefs'];
const DEMO_LEVEL_ID = 't-09';
const DEMO_STEP_MS = 520;
const DEMO_REST_STEPS = 4;
const WIN_SHEET_DELAY_MS = 650;
const TOAST_MS = 2600;
const MAX_PLAY_SEGMENT_MS = 30 * 60 * 1000;
const STAR_PATH = 'M12 2.6l2.9 6 6.6.9-4.8 4.6 1.2 6.5L12 17.5l-5.9 3.1 1.2-6.5L2.5 9.5l6.6-.9z';
const SVG_NS = 'http://www.w3.org/2000/svg';

function byId(id) {
  const node = document.getElementById(id);
  if (!node) throw new Error(`Arayüz öğesi eksik: #${id}`);
  return node;
}

function el(tag, props = {}, children = []) {
  const node = document.createElement(tag);
  for (const [k, v] of Object.entries(props)) {
    if (k === 'class') node.className = v;
    else if (k === 'text') node.textContent = v;
    else node.setAttribute(k, v);
  }
  for (const c of children) node.append(c);
  return node;
}

function startApp(hotData = {}) {
  // ---- servisler ----
  const catalog = new LevelCatalog();
  const { backend, persistent } = resolveBackend(() => window.localStorage);
  const problems = [];
  const store = new SafeStore(backend, CONFIG.save.key, sanitizeSave, (p) => { problems.push(p); console.warn('[linetra] kayıt sorunu:', p.stage, p.error); });
  const progress = new Progress(store, catalog);
  // Zemin: çözülen bölüm sayısına göre açılır; seçili zemin kilitliyse siyaha düşer.
  let currentBackground = null;
  function applyBackgroundVars() {
    currentBackground = resolveBackground(progress.settings.bg, progress.solvedCount());
    const root = document.documentElement;
    for (const [name, value] of Object.entries(backgroundVars(currentBackground, progress.settings.line))) root.style.setProperty(name, value);
    root.style.colorScheme = currentBackground.tone;
    root.setAttribute('data-bg', currentBackground.id);
    const meta = document.querySelector('meta[name="theme-color"]');
    if (meta) meta.setAttribute('content', currentBackground.colors.bg);
  }
  applyBackgroundVars();
  const audio = new GameAudio(() => progress.settings.sound, () => {
    const Ctor = window.AudioContext || window.webkitAudioContext;
    return Ctor ? new Ctor() : null;
  });
  const motionQuery = window.matchMedia('(prefers-reduced-motion: reduce)');
  const readColors = () => {
    const cs = getComputedStyle(document.documentElement);
    const v = (name) => cs.getPropertyValue(name).trim();
    return { edge: v('--edge'), dot: v('--dot'), arrow: v('--arrow'), node: v('--node'), nodeDone: v('--node-done'), trail: v('--trail'), danger: v('--danger'), hint: v('--hint'), bg: v('--bg'), contour: v('--contour') };
  };
  const env = { readColors, now: () => performance.now(), schedule: (cb) => window.requestAnimationFrame(cb), reducedMotion: motionQuery.matches };
  const boardRenderer = new BoardRenderer(byId('board-canvas'), env);
  const demoRenderer = new BoardRenderer(byId('demo-canvas'), env);

  // ---- durum ----
  let game = null;          // { level, mode, session, hints, since, won }
  let route = 'home';
  let sheetTimer = 0;
  let toastTimer = 0;
  let saveWarned = false;
  let demo = null;
  let lang = CONFIG.i18n.fallback;
  let t = createTranslator(lang);

  function formatDateKey(key) {
    const [y, m, d] = key.split('-').map(Number);
    try { return new Date(y, m - 1, d).toLocaleDateString(lang, { day: 'numeric', month: 'long' }); } catch (e) { return key; }
  }
  function tierName(tier) { return t(TIER_KEYS[tier]); }
  function levelLabel() { return game.mode === 'daily' ? t('dailyTitle') : t('level', { n: game.level.number }); }

  /** Dili uygular: sabit metinleri doldurur. Ekranı yeniden çizmek çağırana aittir. */
  function applyLanguage() {
    const devices = Array.isArray(navigator.languages) && navigator.languages.length ? navigator.languages : [navigator.language];
    lang = resolveLanguage(progress.settings.lang, devices);
    t = createTranslator(lang);
    document.documentElement.lang = lang;
    for (const node of document.querySelectorAll('[data-i18n]')) node.textContent = t(node.getAttribute('data-i18n'));
    for (const node of document.querySelectorAll('[data-i18n-aria]')) node.setAttribute('aria-label', t(node.getAttribute('data-i18n-aria')));
  }

  function haptic(pattern) {
    if (!progress.settings.haptics || typeof navigator.vibrate !== 'function') return;
    try { navigator.vibrate(pattern); } catch (e) { /* desteklenmiyor */ }
  }

  function toast(message) {
    const box = byId('toast');
    box.textContent = message; box.hidden = false;
    window.clearTimeout(toastTimer);
    toastTimer = window.setTimeout(() => { box.hidden = true; }, TOAST_MS);
  }

  // ---- yönlendirme ----
  function go(name) {
    route = ROUTES[name] ? name : 'home';
    try { if (window.location.hash !== `#${route}`) window.location.hash = route; } catch (e) { /* hash yazılamıyorsa içeride devam */ }
    applyRoute();
  }

  function applyRoute() {
    const screen = ROUTES[route] || 'home';
    if (screen !== 'game') { commitPlayTime(true); hideSheet(); }
    if (route === 'play' && !(game && game.mode === 'campaign' && !game.won)) { if (!openCampaign(progress.nextLevelIndex())) { route = 'home'; return applyRoute(); } }
    if (route === 'daily' && !(game && game.mode === 'daily' && !game.won)) { if (!openDaily()) { route = 'home'; return applyRoute(); } }
    for (const s of SCREENS) byId(`screen-${s}`).hidden = s !== screen;
    if (screen === 'home') renderHome();
    else if (screen === 'game') renderGame();
    else if (screen === 'awards') renderAwards();
    else if (screen === 'prefs') renderPrefs();
    if (screen === 'home') startDemo(); else stopDemo();
    fitCanvases();
    return undefined;
  }

  // ---- oyun ----
  function commitPlayTime(pause) {
    if (!game || game.since === null) return;
    const elapsed = Math.min(MAX_PLAY_SEGMENT_MS, performance.now() - game.since);
    game.since = pause || game.won ? null : performance.now();
    progress.addPlayTime(elapsed);
  }

  function openLevel(level, mode) {
    commitPlayTime(true);
    hideSheet();
    const session = new PuzzleSession(level.graph, { startNodes: level.startNodes, liftPolicy: window.__linetraLiftPolicy === 'keep' ? 'keep' : 'reset' });
    game = { level, mode, session, hints: 0, since: performance.now(), won: false };
    boardRenderer.setBoard(level.graph, session, level.startNodes);
  }

  function openCampaign(index) {
    try { openLevel(catalog.load(index), 'campaign'); return true; } catch (err) {
      console.error('[linetra] bölüm açılamadı', err);
      toast(t('toastLevelFail'));
      return false;
    }
  }

  function openDaily() {
    try { openLevel(dailyLevel(dateKey()), 'daily'); return true; } catch (err) {
      console.error('[linetra] günlük bulmaca üretilemedi', err);
      toast(t('toastDailyFail'));
      return false;
    }
  }

  function setTip(text, warn = false) {
    const tip = byId('game-tip');
    tip.textContent = text || '';
    tip.className = warn ? 'tip warn' : 'tip';
  }

  // Tek yönlü çizgi ilk kez görülünce bir kez öğretilir: ipucu efektiyle çizilecek yer gösterilir (yıldız düşmez).
  function oneWayIntro() {
    if (!game || progress.hasSeenTip('oneWay')) return null;
    return game.session.graph.edges.find((e) => e.oneWay) || null;
  }

  function defaultTip() {
    if (!game) return '';
    if (game.mode === 'campaign' && TIP_KEYS[game.level.id]) return t(TIP_KEYS[game.level.id]);
    return '';
  }

  function updateHud() {
    if (!game) return;
    const s = game.session;
    byId('game-counter').replaceChildren(String(s.usedCount), el('span', { text: ` / ${s.totalEdges}` }));
    const idle = s.path.length === 0;
    byId('tool-undo').disabled = idle || s.isComplete;
    byId('tool-restart').disabled = idle || s.isComplete;
    byId('tool-hint').disabled = s.isComplete;
    byId('tool-undo').classList.toggle('nudge', s.isDeadEnd);
  }

  function renderGame() {
    if (!game) return;
    byId('game-tier').textContent = game.mode === 'daily' ? formatDateKey(game.level.dateKey) : tierName(game.level.tier);
    byId('game-title').textContent = levelLabel();
    const intro = oneWayIntro();
    setTip(intro ? t('tipOneWay') : defaultTip());
    if (intro) boardRenderer.showHint({ type: 'move', from: intro.a, to: intro.b });
    updateHud();
    if (game.since === null && !game.won) game.since = performance.now();
  }

  const stroke = new StrokeController({
    getSession: () => (game && !game.won ? game.session : null),
    getPoints: () => boardRenderer.points,
    getPaths: () => boardRenderer.paths,
    getRadius: () => boardRenderer.hitRadius,
    emit: onStroke,
  });

  function onStroke(type, detail) {
    if (!game) return;
    const s = game.session;
    switch (type) {
      case StrokeEvent.START:
        audio.select(0); haptic(8); boardRenderer.notifyStart(detail.node); setTip(defaultTip()); break;
      case StrokeEvent.MOVE:
        if (s.graph.edges[detail.edge.index].oneWay) progress.markTipSeen('oneWay');
        audio.select(s.trail.length); haptic(8); boardRenderer.notifyCommit(); break;
      case StrokeEvent.UNDO:
        audio.undo(); boardRenderer.notifyChange(); setTip(defaultTip()); break;
      case StrokeEvent.INVALID: {
        boardRenderer.notifyInvalid(detail.node, detail.reason === 'edge-used' || detail.reason === 'wrong-direction' ? detail.edge : null);
        const message = REASON_KEYS[detail.reason] ? t(REASON_KEYS[detail.reason]) : '';
        if (message) { audio.invalid(); haptic([18, 40, 18]); setTip(message, true); }
        break;
      }
      case StrokeEvent.DEADEND:
        audio.deadend(); haptic([30, 50, 30]); setTip(t('statusDeadend'), true); break;
      case StrokeEvent.RESET:
        audio.burn(); haptic([40, 30, 80]); boardRenderer.notifyChange(); setTip(t('statusStrict'), true); break;
      case StrokeEvent.COMPLETE:
        onWin(); break;
      default: break;
    }
    updateHud();
  }

  function onWin() {
    if (!game || game.won) return;
    commitPlayTime(true);
    game.won = true;
    boardRenderer.notifyWin();
    audio.win(); haptic([12, 30, 12, 30, 30]);
    const counters = { ...game.session.counters, hints: game.hints };
    const result = game.mode === 'daily' ? progress.recordDaily(game.level.dateKey, counters) : progress.recordLevel(game.level.id, counters);
    if (!result.saved && !saveWarned) { saveWarned = true; toast(t('toastSaveFail')); }
    setTip('');
    const won = game;
    window.clearTimeout(sheetTimer);
    sheetTimer = window.setTimeout(() => { if (game === won) showSheet(result); }, env.reducedMotion ? 0 : WIN_SHEET_DELAY_MS);
  }

  function showSheet(result) {
    const stars = byId('win-stars');
    stars.replaceChildren();
    stars.setAttribute('aria-label', t('ariaStars', { n: result.stars }));
    for (let i = 1; i <= CONFIG.rules.maxStars; i++) {
      const svg = document.createElementNS(SVG_NS, 'svg');
      svg.setAttribute('viewBox', '0 0 24 24');
      if (i <= result.stars) svg.setAttribute('class', 'on');
      const path = document.createElementNS(SVG_NS, 'path');
      path.setAttribute('d', STAR_PATH);
      svg.append(path); stars.append(svg);
    }
    byId('win-title').textContent = t(`win${result.stars}`);
    byId('win-detail').textContent = t('winDetail', { label: levelLabel(), n: game.session.totalEdges }) + (game.hints ? t('winHints', { n: game.hints }) : '');
    const awards = byId('win-awards');
    const news = [
      ...(result.newBackgrounds || []).map((id) => t('winBackground', { name: t(getBackground(id).nameKey) })),
      ...result.newAchievements.map((id) => t('winAward', { name: t(ACHIEVEMENT_KEYS[id]) })),
    ];
    awards.hidden = news.length === 0;
    awards.textContent = news.join(' · ');
    const next = byId('win-next');
    const hasNext = game.mode === 'campaign' && catalog.has(game.level.index + 1);
    next.textContent = game.mode === 'daily' ? t('winHome') : (hasNext ? t('winNext') : t('winHome'));
    byId('win-sheet').hidden = false;
    next.focus({ preventScroll: true });
  }

  function hideSheet() { window.clearTimeout(sheetTimer); byId('win-sheet').hidden = true; }

  function replay() {
    if (!game) return;
    openLevel(game.level, game.mode);
    renderGame();
  }

  function nextAfterWin() {
    if (!game) return go('home');
    if (game.mode === 'daily') return go('home');
    const nextIndex = game.level.index + 1;
    if (!catalog.has(nextIndex)) return go('home');
    if (openCampaign(nextIndex)) renderGame();
    return undefined;
  }

  function useHint() {
    if (!game || game.won) return;
    const s = game.session;
    const hint = nextHint(game.level.graph, s.path, game.level.startNodes);
    if (hint.type === 'start' || hint.type === 'move') { game.hints++; boardRenderer.showHint(hint); setTip(defaultTip()); audio.tap(); }
    else if (hint.type === 'undo') { game.hints++; setTip(t('statusHintUndo'), true); byId('tool-undo').classList.add('nudge'); audio.tap(); }
    else if (hint.type === 'none') setTip(t('statusHintNone'), true);
  }

  // ---- ana ekran ----
  function renderHome() {
    const sum = progress.summary();
    const nextIndex = progress.nextLevelIndex();
    const allDone = sum.solved >= sum.total;
    const nextData = catalog.data(nextIndex);
    byId('home-play-title').textContent = sum.solved === 0 ? t('playStart') : (allDone ? t('winReplay') : t('playContinue'));
    byId('home-play-sub').textContent = allDone ? t('playAllDone') : `${t('level', { n: nextIndex + 1 })} · ${tierName(nextData.tier)}`;
    const today = dateKey();
    const dailyMeta = byId('home-daily-meta');
    const streak = progress.currentStreak(today);
    if (progress.dailyStars(today)) { dailyMeta.textContent = streak > 1 ? t('dailySolvedStreak', { n: streak }) : t('dailySolved'); dailyMeta.className = 'meta on'; }
    else { dailyMeta.textContent = streak > 0 ? t('dailyStreak', { n: streak }) : t('dailyNew'); dailyMeta.className = 'meta'; }
    byId('home-awards-meta').textContent = `${Object.keys(progress.data.achievements).length} / ${ACHIEVEMENTS.length}`;
  }

  function startDemo() {
    stopDemo();
    const index = catalog.indexOf(DEMO_LEVEL_ID);
    if (index < 0) return;
    let level; let solution;
    try { level = catalog.load(index); solution = findSolution(level.graph, { startNodes: level.startNodes }); } catch (e) { return; }
    if (!solution) return;
    const session = new PuzzleSession(level.graph, { startNodes: level.startNodes });
    demoRenderer.setBoard(level.graph, session, null);
    demo = { session, solution, step: 0, timer: 0 };
    if (env.reducedMotion) {
      session.start(solution[0]);
      for (let i = 1; i < solution.length; i++) session.moveTo(solution[i]);
      demoRenderer.notifyChange();
      return;
    }
    demo.timer = window.setInterval(() => {
      if (document.hidden || !demo) return;
      const d = demo;
      if (d.step === 0) { d.session.reset(); d.session.start(d.solution[0]); demoRenderer.notifyChange(); demoRenderer.notifyStart(d.solution[0]); }
      else if (d.step < d.solution.length) { const r = d.session.moveTo(d.solution[d.step]); if (r.ok) demoRenderer.notifyMove(r.edge, d.solution[d.step]); }
      else if (d.step === d.solution.length) demoRenderer.notifyWin();
      d.step = d.step >= d.solution.length + DEMO_REST_STEPS ? 0 : d.step + 1;
    }, DEMO_STEP_MS);
  }

  function stopDemo() { if (demo) { window.clearInterval(demo.timer); demo = null; } }

  // ---- istatistik / başarım / ayarlar ----
  function renderAwards() {
    const got = progress.data.achievements;
    byId('awards-total').replaceChildren(String(Object.keys(got).length), el('span', { text: ` / ${ACHIEVEMENTS.length}` }));
    byId('awards-list').replaceChildren(...ACHIEVEMENTS.map((a) => {
      const name = t(ACHIEVEMENT_KEYS[a.id]); const how = t(`${ACHIEVEMENT_KEYS[a.id]}How`);
      return el('div', { class: got[a.id] ? 'award on' : 'award' }, [el('i', { class: 'mark' }), el('span', {}, [el('b', { text: name }), el('span', { text: how })])]);
    }));
  }

  function bgPreview(background, locked) {
    const c = background.colors;
    const svg = document.createElementNS(SVG_NS, 'svg');
    svg.setAttribute('viewBox', '0 0 100 44'); svg.setAttribute('aria-hidden', 'true');
    const add = (tag, attrs) => { const node = document.createElementNS(SVG_NS, tag); for (const [k, v] of Object.entries(attrs)) node.setAttribute(k, String(v)); svg.append(node); };
    const line = (d, stroke) => add('path', { d, fill: 'none', stroke, 'stroke-width': 5, 'stroke-linecap': 'round', 'stroke-linejoin': 'round' });
    add('rect', { width: 100, height: 44, fill: c.bg });
    line('M12 32 L38 12 L64 30 L88 10', c.edge);
    line('M12 32 L38 12 L64 30', c.trail);
    [[12, 32, c.trail], [38, 12, c.trail], [64, 30, c.trail], [88, 10, c.ink]].forEach(([cx, cy, fill]) => add('circle', { cx, cy, r: 5.5, fill, stroke: c.bg, 'stroke-width': 2 }));
    const children = [svg];
    if (locked) {
      const lock = document.createElementNS(SVG_NS, 'svg');
      lock.setAttribute('viewBox', '0 0 24 24');
      const path = document.createElementNS(SVG_NS, 'path');
      path.setAttribute('d', 'M7 11V8a5 5 0 0 1 10 0v3M5 11h14v9H5z');
      lock.append(path);
      children.push(el('span', { class: 'lock', 'aria-hidden': 'true' }, [lock]));
    }
    return el('span', { class: 'bg-preview' }, children);
  }

  function chooseBackground(id) {
    const ok = progress.setSetting('bg', id);
    if (progress.settings.bg !== id) return; // kilitli ya da geçersiz: değişmez
    applyBackgroundVars(); refreshTheme(); renderPrefs(); audio.tap();
    if (!ok && !saveWarned) { saveWarned = true; toast(t('toastPrefFail')); }
  }

  function chooseLine(id) {
    const ok = progress.setSetting('line', id);
    if (progress.settings.line !== id) return;
    applyBackgroundVars(); refreshTheme(); renderPrefs(); audio.tap();
    if (!ok && !saveWarned) { saveWarned = true; toast(t('toastPrefFail')); }
  }

  function renderLineColors() {
    const cur = progress.settings.line;
    const auto = el('button', { class: 'tab', type: 'button', role: 'radio', id: 'line-auto', 'aria-checked': String(cur === AUTO_LINE), 'aria-selected': String(cur === AUTO_LINE), text: t('lineAuto') });
    auto.addEventListener('click', () => chooseLine(AUTO_LINE));
    const sw = LINE_COLORS.map((c) => {
      const name = t(c.nameKey);
      const b = el('button', { class: 'swatch', type: 'button', role: 'radio', id: `line-${c.id}`, 'aria-checked': String(cur === c.id), 'aria-label': name, title: name });
      b.style.setProperty('--sw', resolveTrail(currentBackground, c.id));
      b.addEventListener('click', () => chooseLine(c.id));
      return b;
    });
    byId('line-list').replaceChildren(auto, ...sw);
  }

  function renderBackgrounds() {
    const solved = progress.solvedCount();
    byId('bg-list').replaceChildren(...BACKGROUNDS.map((b) => {
      const locked = !isBackgroundUnlocked(b, solved);
      const remaining = b.unlockAt - solved;
      const name = t(b.nameKey);
      const card = el('button', {
        class: 'bg-card', type: 'button', role: 'radio', id: `bg-${b.id}`,
        'aria-checked': String(!locked && currentBackground.id === b.id),
        'aria-label': locked ? `${name}, ${t('bgLocked', { n: remaining })}` : name,
      }, [bgPreview(b, locked), el('b', { text: name }), el('small', { text: locked ? t('bgLocked', { n: remaining }) : '' })]);
      if (locked) card.disabled = true;
      else card.addEventListener('click', () => chooseBackground(b.id));
      return card;
    }));
  }

  function renderPrefs() {
    for (const name of ['sound', 'haptics']) byId(`pref-${name}`).setAttribute('aria-checked', String(progress.settings[name]));
    byId('reset-idle').hidden = false; byId('reset-confirm').hidden = true;
    byId('prefs-note').textContent = `${t('noteAbout', { v: APP_VERSION })} ${persistent ? t('noteSaved') : t('noteNotSaved')}`;
    renderBackgrounds();
    renderLineColors();
    const choices = [CONFIG.i18n.auto, ...CONFIG.i18n.languages];
    byId('lang-list').replaceChildren(...choices.map((code) => {
      const chip = el('button', { class: 'tab', type: 'button', role: 'radio', 'aria-checked': String(progress.settings.lang === code), 'aria-selected': String(progress.settings.lang === code), id: `lang-${code}`, text: code === CONFIG.i18n.auto ? t('langAuto') : LANGUAGE_NAMES[code] });
      chip.addEventListener('click', () => {
        const ok = progress.setSetting('lang', code);
        audio.tap(); applyLanguage(); renderPrefs();
        if (!ok && !saveWarned) { saveWarned = true; toast(t('toastPrefFail')); }
      });
      return chip;
    }));
  }

  // ---- tuval boyutu, tema, arka plan ----
  function fitCanvases() {
    const dpr = window.devicePixelRatio || 1;
    for (const [id, renderer] of [['board-wrap', boardRenderer], ['demo-wrap', demoRenderer]]) {
      const r = byId(id).getBoundingClientRect();
      if (r.width > 0 && r.height > 0) renderer.resize(r.width, r.height, dpr);
    }
  }

  function drawTopo() {
    const canvas = byId('topo');
    const w = window.innerWidth; const h = window.innerHeight;
    if (!(w > 0 && h > 0)) return;
    const dpr = Math.min(2, window.devicePixelRatio || 1);
    canvas.width = Math.round(w * dpr); canvas.height = Math.round(h * dpr);
    const ctx = canvas.getContext('2d');
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.clearRect(0, 0, w, h);
    ctx.strokeStyle = readColors().contour; ctx.lineWidth = 1.2;
    // Eşyükselti çizgileri: iki "tepe" etrafında bozulmuş halkalar.
    const peaks = [[w * 0.86, h * 0.2, 0.7], [w * 0.1, h * 0.74, 2.3]];
    const reach = Math.hypot(w, h) * 0.62;
    for (const [cx, cy, phase] of peaks) {
      for (let radius = 26; radius < reach; radius += 30) {
        ctx.beginPath();
        for (let step = 0; step <= 72; step++) {
          const a = (step / 72) * Math.PI * 2;
          const wobble = 1 + 0.13 * Math.sin(a * 3 + phase) + 0.07 * Math.sin(a * 5 + phase * 2 + radius / 90);
          const x = cx + Math.cos(a) * radius * wobble; const y = cy + Math.sin(a) * radius * wobble;
          if (step === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
        }
        ctx.stroke();
      }
    }
  }

  function refreshTheme() { boardRenderer.refreshColors(); demoRenderer.refreshColors(); drawTopo(); }

  // ---- olay bağlama ----
  boardRenderer.live = stroke; // ilerleyen kenarın canlı durumu
  attachPointerAdapter(byId('board-canvas'), stroke, (p) => boardRenderer.setPointer(p));
  document.addEventListener('pointerdown', () => audio.unlock(), { capture: true });
  for (const btn of document.querySelectorAll('[data-go]')) btn.addEventListener('click', () => { audio.tap(); go(btn.getAttribute('data-go')); });
  byId('home-play').addEventListener('click', () => {
    audio.tap();
    const sum = progress.summary();
    if (openCampaign(sum.solved >= sum.total ? catalog.count - 1 : progress.nextLevelIndex())) go('play');
    return undefined;
  });
  byId('game-back').addEventListener('click', () => { audio.tap(); go('home'); });
  byId('tool-undo').addEventListener('click', () => {
    if (game && !game.won && game.session.undo()) { audio.undo(); boardRenderer.notifyChange(); setTip(defaultTip()); updateHud(); }
  });
  byId('tool-restart').addEventListener('click', () => {
    if (!game || game.won) return;
    game.session.reset(); audio.undo(); boardRenderer.notifyChange(); setTip(defaultTip()); updateHud();
  });
  byId('tool-hint').addEventListener('click', useHint);
  byId('win-replay').addEventListener('click', () => { audio.tap(); replay(); });
  byId('win-next').addEventListener('click', () => { audio.tap(); nextAfterWin(); });
  for (const sw of document.querySelectorAll('[data-pref]')) {
    sw.addEventListener('click', () => {
      const name = sw.getAttribute('data-pref');
      const ok = progress.setSetting(name, !progress.settings[name]);
      renderPrefs();
      if (name === 'sound' && progress.settings.sound) { audio.unlock(); audio.tap(); }
      if (name === 'haptics') haptic(20);
      if (!ok && !saveWarned) { saveWarned = true; toast(t('toastPrefFail')); }
    });
  }
  byId('reset-ask').addEventListener('click', () => { byId('reset-idle').hidden = true; byId('reset-confirm').hidden = false; });
  byId('reset-no').addEventListener('click', renderPrefs);
  byId('reset-yes').addEventListener('click', () => { progress.resetAll(); applyBackgroundVars(); refreshTheme(); game = null; renderPrefs(); toast(t('toastDeleted')); });

  window.addEventListener('hashchange', () => {
    const name = window.location.hash.replace('#', '') || 'home';
    if (name !== route) { route = ROUTES[name] ? name : 'home'; applyRoute(); }
  });
  window.addEventListener('resize', () => { fitCanvases(); drawTopo(); });
  if (typeof ResizeObserver === 'function') {
    const ro = new ResizeObserver(fitCanvases);
    ro.observe(byId('board-wrap')); ro.observe(byId('demo-wrap'));
  }
  document.addEventListener('visibilitychange', () => {
    if (document.hidden) { commitPlayTime(true); audio.suspend(); }
    else if (game && !game.won && ROUTES[route] === 'game') game.since = performance.now();
  });
  window.addEventListener('pagehide', () => commitPlayTime(true));
  if (motionQuery.addEventListener) motionQuery.addEventListener('change', () => { env.reducedMotion = motionQuery.matches; });
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(fitCanvases).catch(() => {});

  // ---- açılış ----
  applyLanguage();
  if (problems.length && store.lastLoadSource !== 'main') {
    toast(store.lastLoadSource === 'backup' ? t('toastRestored') : t('toastUnreadable'));
  }
  drawTopo();
  const initial = window.location.hash.replace('#', '');
  route = ROUTES[initial] ? initial : 'home';
  if (hotData && hotData.game && Number.isInteger(hotData.game.index) && openCampaign(hotData.game.index)) {
    game.session.restore({ path: hotData.game.path });
    game.hints = Number.isInteger(hotData.game.hints) ? hotData.game.hints : 0;
    boardRenderer.notifyChange();
  }
  applyRoute();

  return {
    // Test ve canlı güncelleme için dar bir pencere.
    snapshot: () => (game && game.mode === 'campaign' && !game.won ? { game: { index: game.level.index, path: game.session.path.slice(), hints: game.hints } } : {}),
    debug: { openLevel(i) { return openCampaign(i) && (go('play'), true); }, setLiftPolicy(p) { window.__linetraLiftPolicy = p; }, get game() { return game; }, get background() { return currentBackground.id; }, get lang() { return lang; }, stroke, solve: () => (game ? findSolution(game.level.graph, { startNodes: game.level.startNodes }) : null), boardRenderer, demoRenderer, progress, catalog, go, get route() { return route; } },
  };
}

const linetraBoot = (data) => {
  const app = startApp(data || {});
  window.__linetra = app;
  if (window.claude && window.claude.hot && typeof window.claude.hot.snapshot === 'function') window.claude.hot.snapshot(() => app.snapshot());
};
if (window.claude && window.claude.hot && typeof window.claude.hot.ready === 'function') window.claude.hot.ready(linetraBoot);
else linetraBoot(window.claude && window.claude.hot && window.claude.hot.data ? window.claude.hot.data : {});
})();
</script>

</body>
